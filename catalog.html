<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>编目规范 — 古代史及汉籍研究工具</title>
<style>
/* ============================================================
   v3 设计令牌（与 设计原型\桌面版-v3.html 同源）
   —— 圆角四档 / 灰阶层级 / 白卡无描边 + 轻阴影
   ============================================================ */
:root{
  --brand:#171A1F; --brand-2:#2A2E36; --brand-pressed:#0C0E12;
  --bg-page:#F2F3F5; --bg-card:#FFFFFF; --bg-fill:#F2F3F5; --bg-hover:#F7F8F9; --bg-badge:#EDEEF0;
  --t1:#171A1F; --t2:#5F6672; --t3:#8F959E; --t4:#C2C6CC; --divider:#F0F1F3;
  --r-card:24px; --r-mid:18px; --r-pill:999px; --r-badge:6px;
  --gap-page:28px; --gap-card:16px; --gap-block:24px; --pad-card:20px;
  --fs-page:20px; --fs-sec:15px; --fs-body:13.5px; --fs-sub:12px; --fs-caption:11.5px; --fs-tbl:12.5px;
  --shadow-card:0 6px 20px rgba(0,0,0,.06);
  --shadow-float:0 20px 50px rgba(0,0,0,.18);
  --shadow-brand:0 6px 16px rgba(23,26,31,.18);
  --font:-apple-system,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",Roboto,sans-serif;
  --font-serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --font-mono:'Consolas','Courier New',monospace;
  --ease:cubic-bezier(.2,0,0,1); --dur-fast:180ms;
  --transition-fast:var(--dur-fast) var(--ease); --ease-spring:var(--ease);
  /* —— 旧变量别名：历史内联样式/共享脚本仍可能引用 —— */
  --color-bg:var(--bg-page); --color-bg-alt:var(--bg-fill); --color-surface:var(--bg-card); --color-surface-hover:var(--bg-hover);
  --color-primary:var(--t1); --color-primary-light:var(--t2); --color-accent:var(--t1); --color-accent-light:var(--t2);
  --color-text:var(--t1); --color-text-secondary:var(--t2); --color-text-muted:var(--t3);
  --color-border:var(--divider); --color-border-light:var(--divider); --color-divider:var(--divider);
  --color-highlight:var(--bg-badge); --color-highlight-text:var(--t1);
  --color-table-header:var(--t1); --color-table-header-text:#FFFFFF;
  --color-shadow:rgba(0,0,0,.05); --color-shadow-lg:rgba(0,0,0,.09);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px;
  --shadow-sm:var(--shadow-card); --shadow-md:var(--shadow-card); --shadow-lg:var(--shadow-float);
}
[data-theme="dark"]{
  --brand:#FAFAFA; --brand-2:#E5E5E5; --brand-pressed:#FFFFFF;
  --bg-page:#0A0A0A; --bg-card:#171717; --bg-fill:#1F1F1F; --bg-hover:#262626; --bg-badge:#262626;
  --t1:#FAFAFA; --t2:#D4D4D4; --t3:#A3A3A3; --t4:#737373; --divider:rgba(255,255,255,.08);
  --shadow-card:0 6px 20px rgba(0,0,0,.5);
  --shadow-float:0 20px 50px rgba(0,0,0,.65);
  --shadow-brand:0 6px 16px rgba(0,0,0,.5);
  --color-table-header-text:#0A0A0A;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);font-size:var(--fs-body);line-height:1.7;color:var(--t1);background:var(--bg-page);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:var(--t4);border-radius:4px;opacity:.5}
:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
a{color:inherit}

/* ===== 顶栏（站点外壳） ===== */
.app-header{background:color-mix(in srgb,var(--bg-page) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--t1);padding:.7rem 0;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--divider)}
.header-inner{max-width:1080px;margin:0 auto;padding:0 var(--gap-page);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0}
.header-brand .bi{width:30px;height:30px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:1rem;color:var(--bg-page);font-weight:700}
.header-brand h1{font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--t1);white-space:nowrap;letter-spacing:-.01em}
.header-nav{display:flex;gap:.15rem;flex-shrink:0;align-items:center}
.header-nav a{color:var(--t2);text-decoration:none;font-size:var(--fs-sub);font-weight:500;padding:.35rem .7rem;border-radius:var(--r-pill);transition:all var(--transition-fast);white-space:nowrap}
.header-nav a:hover{color:var(--t1);background:var(--bg-badge)}
.header-nav a.active{color:var(--t1);background:var(--bg-badge);font-weight:600}
.header-actions{margin-left:auto;display:flex;gap:.4rem;align-items:center}
.btn-icon{width:34px;height:34px;border-radius:var(--r-pill);border:0;background:var(--bg-badge);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);font-size:.95rem}
.btn-icon:hover{background:var(--bg-hover);color:var(--t1);box-shadow:inset 0 0 0 1px var(--divider)}

/* 导航下拉（说明文档 / 用户） */
.nav-dropdown{position:relative;flex-shrink:0}
.nav-dropdown-btn{display:inline-flex;align-items:center;gap:.1rem;color:var(--t2);font-size:var(--fs-sub);font-weight:500;font-family:var(--font);padding:.35rem .7rem;border-radius:var(--r-pill);transition:all var(--transition-fast);white-space:nowrap;border:none;background:none;cursor:pointer}
.nav-dropdown-btn:hover{color:var(--t1);background:var(--bg-badge)}
.nav-dropdown-btn.active{color:var(--t1);background:var(--bg-badge);font-weight:600}
.nav-dropdown-btn svg{transition:transform var(--transition-fast)}
.nav-dropdown:hover .nav-dropdown-btn svg,.nav-dropdown:focus-within .nav-dropdown-btn svg{transform:rotate(180deg)}
.nav-dropdown-menu{position:absolute;top:100%;left:0;margin-top:8px;background:var(--bg-card);border-radius:var(--r-mid);box-shadow:var(--shadow-float);min-width:140px;padding:6px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s var(--ease),visibility .18s var(--ease),transform .18s var(--ease);z-index:210}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.nav-dropdown-menu a{display:block;padding:.42rem .75rem;border-radius:10px;color:var(--t2);font-size:var(--fs-sub);text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
.nav-dropdown-menu a:hover{background:var(--bg-fill);color:var(--t1)}
.user-dropdown{position:relative}
.user-btn{display:inline-flex;align-items:center}
.user-login-link{color:inherit;text-decoration:none}
.user-menu{right:0;left:auto;min-width:128px}
.user-menu-settings{margin-top:4px;padding-top:.5rem !important;border-top:1px solid var(--divider);border-radius:0 0 10px 10px !important}
.nav-dropdown-menu a.active{color:var(--t1);font-weight:600;background:var(--bg-fill)}

/* ===== 页面主体 ===== */
.page{max-width:1080px;margin:0 auto;padding:var(--gap-page) var(--gap-page) 64px;width:100%;flex:1}

/* 页头（v3 .phead）：标题 20/700 + 一行 12px 灰说明，右侧动作区。
   面包屑、返回链接、长段解释均已移除，以简洁为主 */
.page-head{display:flex;align-items:flex-start;gap:16px;padding:2px 2px 18px;flex-wrap:wrap}
.phead-text{flex:1;min-width:0}
.page-head h2{font-family:var(--font);font-size:var(--fs-page);font-weight:700;color:var(--t1);margin:0 0 4px;letter-spacing:-.01em;line-height:1.35}
.page-head p{margin:0;font-size:var(--fs-sub);color:var(--t3);line-height:1.6}
.page-head p:empty{display:none}
.ph-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto;flex-wrap:wrap}

/* 细则查阅：页头吸顶（版本切换 / 章节树随时可点）。
   top 由 JS 按站点顶栏实际高度写入 --ph-sticky-top：网页版约 56px，桌面内嵌（无顶栏）为 0；
   z-index 90 低于站点顶栏 100、高于正文，浮出面板 220 不受影响 */
.page-head.is-sticky{position:sticky;top:var(--ph-sticky-top,0px);z-index:90;background:var(--bg-page);padding-top:10px;padding-bottom:14px;transition:box-shadow .18s var(--ease)}
.page-head.is-sticky.is-stuck{box-shadow:0 10px 20px -16px rgba(0,0,0,.35)}
[data-theme="dark"] .page-head.is-sticky.is-stuck{box-shadow:0 10px 20px -16px rgba(0,0,0,.9)}
/* 工作手册：说明放在标题右侧同一行 */
.page-head.is-inline-desc .phead-text{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

/* ===== 浮出式章节树（与 v3 原型 .float-host / .tool-btn / .float-panel 同款） ===== */
.float-host{position:relative;display:inline-block}
.float-host.align-r .float-panel{left:auto;right:0}
.float-panel{position:absolute;top:calc(100% + 8px);left:0;z-index:220;min-width:264px;width:342px;max-height:400px;overflow:auto;background:var(--bg-card);border-radius:var(--r-mid);box-shadow:var(--shadow-float);padding:8px;scrollbar-width:thin}
.float-panel[hidden]{display:none}
.float-panel .fp-row{display:flex;align-items:flex-start;gap:8px;width:100%;border:0;background:none;font-family:var(--font);font-size:13px;color:var(--t2);padding:8px 12px;border-radius:10px;cursor:pointer;text-align:left;line-height:1.45;transition:background var(--transition-fast),color var(--transition-fast)}
.float-panel .fp-row:hover{background:var(--bg-fill);color:var(--t1)}
.float-panel .fp-row.on{background:var(--bg-fill);color:var(--t1);font-weight:600}
.float-panel .fp-row.lv0{color:var(--t1);font-weight:600}
.float-panel .fp-row.lv2{font-size:var(--fs-sub);color:var(--t3)}
.float-panel .fp-row.lv2:hover{color:var(--t1)}
.tool-btn{height:36px;padding:0 14px;border:0;border-radius:var(--r-pill);background:var(--bg-badge);color:var(--t1);font-family:var(--font);font-size:var(--fs-body);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background var(--transition-fast),box-shadow var(--transition-fast)}
.tool-btn:hover{background:#E2E4E8}
[data-theme="dark"] .tool-btn:hover{background:#33363C}
.tool-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.tool-btn svg.chev{width:12px;height:12px;margin-left:2px;transition:transform var(--transition-fast)}
.float-host.open .tool-btn{box-shadow:inset 0 0 0 1px var(--t4)}
.float-host.open .tool-btn svg.chev{transform:rotate(180deg)}

/* ===== 分段控件（版本切换；页内三段切换条已移除） ===== */
/* 「细则查阅 / 分类表查询 / 工作手册」由桌面侧栏三项入口驱动；
   页面内不再渲染切换条，仅保留隐藏的 .tab-btn 供外壳 activateCatalogTab 与 ?tab= 深链调用 */
#tabSeg{display:none !important}
.seg{display:inline-flex;background:var(--bg-badge);border-radius:var(--r-pill);padding:3px;flex-wrap:wrap}
.seg button{height:30px;padding:0 14px;border:0;background:none;border-radius:var(--r-pill);font-family:var(--font);font-size:var(--fs-sub);font-weight:500;color:var(--t2);cursor:pointer;white-space:nowrap;transition:background var(--transition-fast),color var(--transition-fast),box-shadow var(--transition-fast)}
.seg button:hover{color:var(--t1)}
.seg button.active{background:var(--bg-card);color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme="dark"] .seg button.active{background:#33363C;color:var(--t1)}

/* ===== 细则查阅 ===== */
.rule-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg-card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:12px 16px;margin-bottom:var(--gap-card)}
.doc-search{display:flex;align-items:center;gap:8px;flex:1;min-width:280px}
.field{display:flex;align-items:center;gap:8px;height:40px;background:var(--bg-fill);border-radius:var(--r-mid);padding:0 6px 0 14px;flex:1;min-width:0;transition:box-shadow var(--transition-fast)}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--t2)}
.field>svg{width:15px;height:15px;fill:none;stroke:var(--t3);stroke-width:2;flex:0 0 15px}
.field input{border:0;background:none;outline:none;font-family:var(--font);font-size:var(--fs-body);color:var(--t1);width:100%;min-width:0}
.field input::placeholder{color:var(--t3)}
.mini-btn{height:28px;padding:0 12px;border:0;border-radius:var(--r-pill);background:var(--brand);color:#fff;font-family:var(--font);font-size:var(--fs-caption);font-weight:600;cursor:pointer;flex:0 0 auto;transition:background var(--transition-fast)}
.mini-btn:hover{background:var(--brand-2)}
[data-theme="dark"] .mini-btn{background:var(--t1);color:#0A0A0A}
[data-theme="dark"] .mini-btn:hover{background:#E5E5E5}
.nav-mini{width:30px;height:30px;flex:0 0 30px;border:0;border-radius:var(--r-pill);background:var(--bg-badge);color:var(--t2);cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:background var(--transition-fast),color var(--transition-fast)}
.nav-mini:hover:not(:disabled){background:var(--bg-hover);color:var(--t1)}
.nav-mini:disabled{opacity:.35;cursor:default}
.search-count{font-size:var(--fs-caption);color:var(--t3);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto}

/* 正文卡片与排版 */
.doc-card{background:var(--bg-card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:34px 44px 42px}
.doc-art{max-width:840px;margin:0 auto;font-size:var(--fs-body);line-height:1.95;color:var(--t1)}
.doc-title{font-family:var(--font-serif);font-size:var(--fs-page);font-weight:700;text-align:center;line-height:1.55;margin:2px 0 8px;letter-spacing:.01em}
.doc-subtitle{font-size:var(--fs-tbl);color:var(--t3);text-align:center;margin:0 0 26px;letter-spacing:.02em}
.doc-art .stitle{font-size:var(--fs-sec);font-weight:600;color:var(--t1);margin:34px 0 12px;line-height:1.5;letter-spacing:-.005em;scroll-margin-top:88px}
.doc-art .stitle.lv0{padding-bottom:8px;border-bottom:1px solid var(--divider)}
.doc-art .stitle:first-of-type{margin-top:0}
.doc-art .stitle.lv1{font-size:var(--fs-body);font-weight:600;margin:24px 0 8px}
.doc-art .stitle.lv2{font-size:var(--fs-body);font-weight:600;margin:18px 0 6px;color:var(--t2)}
.doc-art p{font-size:var(--fs-body);line-height:1.95;margin:0 0 10px;color:var(--t1)}
.doc-art p:last-child{margin-bottom:0}
.doc-art b{font-weight:600;color:var(--t1)}
.doc-art .doc-item{margin-bottom:7px}
.doc-art .doc-item:last-child{margin-bottom:10px}
.doc-ex{background:var(--bg-fill);border-radius:var(--r-mid);padding:13px 16px;margin:10px 0 16px}
.doc-ex p{font-size:var(--fs-tbl);line-height:1.85;color:var(--t2);font-family:var(--font-serif);margin:0 0 4px}
.doc-ex p:last-child{margin:0}
.doc-code{background:var(--bg-fill);border-radius:var(--r-mid);padding:14px 16px;margin:10px 0 16px;font-family:var(--font-mono);font-size:var(--fs-sub);line-height:1.85;white-space:pre-wrap;overflow-x:auto;color:var(--t2)}
.doc-art mark.doc-hl{background:#E1E4E8;color:var(--t1);padding:0 2px;border-radius:4px;font-weight:600}
[data-theme="dark"] .doc-art mark.doc-hl{background:#3A3E45;color:var(--t1)}
.doc-art mark.doc-hl-cur{box-shadow:0 0 0 2px var(--t2)}

/* ===== 分类表查询 ===== */
.cat-toolbar{display:flex;align-items:center;gap:12px;background:var(--bg-card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:12px 16px;margin-bottom:12px;flex-wrap:wrap}
.cat-toolbar .field{flex:1;min-width:240px}
.cat-meta{font-size:var(--fs-caption);color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--gap-card)}
.cat-chip{height:32px;padding:0 14px;border:0;border-radius:var(--r-pill);background:var(--bg-card);color:var(--t2);font-family:var(--font);font-size:var(--fs-sub);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:all var(--transition-fast)}
.cat-chip:hover{background:var(--bg-hover);color:var(--t1)}
.cat-chip.active{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}
[data-theme="dark"] .cat-chip.active{background:var(--t1);color:#0A0A0A}
.cat-chip .n{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.cat-group{background:var(--bg-card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:22px 26px 6px;margin-bottom:var(--gap-card)}
.cat-group-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.cat-group-head h3{font-size:var(--fs-sec);font-weight:600;color:var(--t1);letter-spacing:-.005em}
.cat-count{font-size:var(--fs-caption);color:var(--t3)}
.cat-group-intro{font-size:var(--fs-body);line-height:1.85;color:var(--t2);margin:6px 0 2px;max-width:920px}
.cat-row{border-top:1px solid var(--divider);padding:16px 0 14px}
.cat-row:first-of-type{border-top:0;padding-top:12px}
.cat-row-head{display:flex;align-items:baseline;gap:10px}
.cat-idx{font-size:var(--fs-caption);color:var(--t4);font-variant-numeric:tabular-nums;min-width:22px;flex:0 0 22px}
.cat-row-head h4{font-size:var(--fs-body);font-weight:600;color:var(--t1);letter-spacing:-.005em}
.cat-shu-n{font-size:var(--fs-caption);color:var(--t3);margin-left:auto;white-space:nowrap}
.cat-intro{font-size:var(--fs-body);line-height:1.85;color:var(--t2);margin:6px 0 8px;padding-left:32px}
.cat-books{display:flex;flex-wrap:wrap;gap:6px;padding-left:32px;margin-bottom:2px}
.cat-books .bk{font-size:var(--fs-caption);color:var(--t2);background:var(--bg-fill);border-radius:var(--r-pill);padding:4px 10px;line-height:1.5}
.shu-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:5px 26px;margin:12px 0 2px;padding-left:32px}
.shu-item{display:flex;gap:7px;align-items:baseline;font-size:var(--fs-caption);line-height:1.7;color:var(--t3);min-width:0}
.shu-item b{color:var(--t2);font-weight:600;flex:0 0 auto;white-space:nowrap}
.shu-item .shu-desc{min-width:0}
.shu-item .shu-ex{color:var(--t4);font-family:var(--font-serif);flex:0 0 auto}
.shu-empty{font-size:var(--fs-caption);color:var(--t4);padding-left:32px;margin:2px 0 6px}
.cat-empty{padding:56px 16px;text-align:center;color:var(--t3);font-size:var(--fs-body);background:var(--bg-card);border-radius:var(--r-card);box-shadow:var(--shadow-card)}

/* ===== 工作手册（v3：页头「下载 / 在外部打开」+ 内嵌 PDF 全宽） ===== */
.pdf-card{background:var(--bg-card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:12px}
.btn-pill{height:32px;padding:0 14px;border:0;border-radius:var(--r-pill);background:var(--bg-badge);color:var(--t1);font-family:var(--font);font-size:var(--fs-caption);font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background var(--transition-fast)}
.btn-pill:hover{background:#E2E4E8}
[data-theme="dark"] .btn-pill:hover{background:#33363C}
.btn-pill.primary{background:var(--brand);color:var(--bg-page);font-weight:600}
.btn-pill.primary:hover{background:var(--brand-2)}
[data-theme="dark"] .btn-pill.primary{background:var(--t1);color:#0A0A0A}
[data-theme="dark"] .btn-pill.primary:hover{background:#E5E5E5}
.ph-actions .btn-pill{height:36px;font-size:var(--fs-body)}

.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{display:none;position:fixed;top:0;right:0;bottom:0;z-index:950;width:min(78vw,320px);background:var(--bg-card);box-shadow:var(--shadow-float);transform:translateX(105%);transition:transform 250ms var(--ease);overflow-y:auto;padding:1rem .9rem 2rem;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-brand{display:flex;align-items:center;gap:.6rem;padding:.5rem .4rem 1rem;border-bottom:1px solid var(--divider);margin-bottom:.8rem}

<script>
(function(){
'use strict';

/* ============================================================
 * 状态
 * ============================================================ */
var tab = 0;                    // 0 细则 / 1 分类表 / 2 工作手册
var curDoc = '2025';            // '2025' | '2023'（默认新版，与 v3 原型一致）
var catGroup = 'all';           // 分类表：当前部筛选
var qDoc = '';                  // 细则检索词
var qCat = '';                  // 分类表检索词
var marks = [];                 // 细则检索命中 <mark>
var markIdx = -1;
var treeHost = null, treeBtn = null, treePanel = null;
var spyRaf = null;

var ICON_SEARCH = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>';
var ICON_TREE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M4 12h9M4 18h6"/><path d="M16.5 5.5v5.2l3-1.6"/></svg>';
var ICON_CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
var ICON_PDF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8.5 17v-4h1.6a1.5 1.5 0 0 1 0 3H8.5"/></svg>';

/* 页头说明：每 tab 只留一行 12px 灰字；细则/分类表按 V2c 要求不再显示说明 */
var TAB_META = [
  {
    title: '细则查阅',
    desc: ''
  },
  {
    title: '分类表查询',
    desc: ''
  },
  {
    title: '工作手册',
    desc: '全球汉籍合璧工程精华编整理工作手册（2023修订版）'
  }
];

var LV_NAMES = ['经部', '史部', '子部', '集部', '类丛部'];

function sc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ============================================================
 * 数据层：catalog_data.js 的顶层 const + overlay.js 覆盖层
 * ============================================================ */
(function applyCatalogOverlay(){
  try {
    var ov = (typeof window.loadCatalogOverlay === 'function') ? window.loadCatalogOverlay() : null;
    if (!ov || typeof ov !== 'object') return;
    if (Array.isArray(ov.doc2023) && ov.doc2023.length) window.__DOC2023 = ov.doc2023;
    if (Array.isArray(ov.doc2025) && ov.doc2025.length) window.__DOC2025 = ov.doc2025;
    if (ov.catalogTree && typeof ov.catalogTree === 'object' && Object.keys(ov.catalogTree).length) window.__CATALOG_TREE = ov.catalogTree;
  } catch (e) { /* 覆盖失败不影响基线 */ }
})();

function docData(ver){
  var ov = (ver === '2025') ? window.__DOC2025 : window.__DOC2023;
  if (Array.isArray(ov) && ov.length) return ov;
  try { return (ver === '2025' ? DOC2025 : DOC2023) || []; } catch (e) { return []; }
}
function catalogTree(){
  if (window.__CATALOG_TREE && typeof window.__CATALOG_TREE === 'object') return window.__CATALOG_TREE;
  try { return (typeof CATALOG_TREE !== 'undefined' && CATALOG_TREE) ? CATALOG_TREE : {}; } catch (e) { return {}; }
}
function standardGroups(){
  try { return (window.STANDARD_CLASSIFY && window.STANDARD_CLASSIFY.groups) || []; } catch (e) { return []; }
}

/* ============================================================
 * 细则查阅：章节层级 / 章节树
 * ============================================================ */
function sectionLevel(title){
  var t = String(title || '');
  if (/^[一二三四五六七八九十百]+、/.test(t)) return 0;         // 一、二、
  if (/^[（(][一二三四五六七八九十]+[）)]/.test(t)) return 1;    // （一）(一)
  if (/^[（(]\d+[）)]/.test(t)) return 1;                        // （1）
  if (/^\d+[.．、]/.test(t)) return 2;                           // 1. 2.
  if (t === '文稿参考著录格式' || t === '编目实例') return 0;
  if (LV_NAMES.indexOf(t) >= 0) return 1;                        // 三、目录分类 下的五部
  if (t === '例一' || t === '例二') return 2;
  return 1;
}
function treeOf(doc){
  var out = [];
  for (var i = 2; i < doc.length; i++) {
    var sec = doc[i] || {};
    out.push({ id: sec.id, title: sec.title || '', level: sectionLevel(sec.title) });
  }
  return out;
}
/* 副标题规范化（V2c）：2025 →（2025.10修订）；2023 →（2023.09修订）
   数据文件不动，只在渲染时去掉「，征求意见稿」「修订稿」等字样 */
function cleanDocSubtitle(t){
  var s = String(t == null ? '' : t);
  s = s.replace(/[，,、]\s*征求意见稿/g, '').replace(/\s*征求意见稿/g, '');
  s = s.replace(/修订稿/g, '修订');
  return s;
}
function docHtml(doc){
  var h = '';
  if (doc[0] && doc[0].title) h += '<div class="doc-title" id="docTitle">' + sc(doc[0].title) + '</div>';
  if (doc[1] && doc[1].title) h += '<div class="doc-subtitle" id="docSubtitle">' + sc(cleanDocSubtitle(doc[1].title)) + '</div>';
  for (var i = 2; i < doc.length; i++) {
    var sec = doc[i] || {};
    var lv = sectionLevel(sec.title);
    h += '<h3 class="stitle lv' + lv + '" id="sec-' + sc(sec.id) + '">' + sc(sec.title) + '</h3>';
    h += sec.html || '';
  }
  return h;
}

/* ============================================================
 * 通用：滚动定位 / 章节高亮 / 吸顶页头
 * ============================================================ */
/* 吸顶页头（含站点顶栏偏移）让出的实际高度；非细则 tab 返回 0 */
function stickyHeadClearance(){
  var head = document.querySelector('.page-head.is-sticky');
  if (!head) return 0;
  var cs = window.getComputedStyle(head);
  if (cs.position !== 'sticky' && cs.position !== '-webkit-sticky') return 0;
  var top = parseFloat(cs.top) || 0;
  return Math.round(head.getBoundingClientRect().height + top);
}
function scrollToSection(id){
  var el = document.getElementById('sec-' + id);
  if (!el) return;
  var clearance = stickyHeadClearance();
  var offset = clearance ? clearance + 12 : 84;
  var top = el.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0) - offset;
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}
function setActiveChapter(id){
  document.querySelectorAll('.float-panel .fp-row[data-sid]').forEach(function(r){
    r.classList.toggle('on', r.getAttribute('data-sid') === id);
  });
  var box = document.getElementById('sideAnchors');
  if (box) box.querySelectorAll('.anchor-item').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-sid') === id);
  });
}
function syncSpy(){
  var db = document.getElementById('db');
  if (!db) return;
  var secs = db.querySelectorAll('.stitle[id^="sec-"]');
  if (!secs.length) return;
  var line = 130;
  var head = document.querySelector('.page-head.is-sticky');
  if (head) line = Math.max(90, head.getBoundingClientRect().bottom + 40);
  var current = secs[0];
  for (var i = 0; i < secs.length; i++) {
    if (secs[i].getBoundingClientRect().top <= line) current = secs[i]; else break;
  }
  setActiveChapter(current.id.slice(4));
}
window.addEventListener('scroll', function(){
  if (spyRaf) return;
  spyRaf = window.requestAnimationFrame(function(){ spyRaf = null; syncSpy(); updateStuckState(); });
}, { passive: true });

/* ============================================================
 * 浮出式章节树
 * ============================================================ */
function setTreeOpen(open){
  if (!treePanel || !treeBtn || !treeHost) return;
  treePanel.hidden = !open;
  treeBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  treeHost.classList.toggle('open', open);
}
document.addEventListener('click', function(e){
  if (treeHost && !treeHost.contains(e.target)) setTreeOpen(false);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && treePanel && !treePanel.hidden) { setTreeOpen(false); treeBtn.focus(); }
});

/* 页头动作区（v3 .phead .pa）：按当前 tab 渲染，右对齐
   tab 0：版本切换 pill + 章节树浮出按钮 + 导出 PDF
   tab 1：无额外动作（分类表的检索与部筛选在正文工具条内）
   tab 2：下载 + 在外部打开 */
function renderHeadActions(tree){
  var host = document.getElementById('pageHeadActions');
  if (!host) return;
  treeHost = null; treeBtn = null; treePanel = null;

  if (tab === 0) {
    host.innerHTML =
      '<div class="seg ver-seg" role="group" aria-label="细则版本">'
      +   '<button class="ver-btn' + (curDoc === '2023' ? ' active' : '') + '" data-d="2023" type="button">2023.09</button>'
      +   '<button class="ver-btn' + (curDoc === '2025' ? ' active' : '') + '" data-d="2025" type="button">2025.10</button>'
      + '</div>'
      + '<div class="float-host align-r">'
      +   '<button class="tool-btn" id="ruleTreeBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="ruleTree">'
      +   ICON_TREE + '章节树 · ' + tree.length + ' 节' + ICON_CHEV + '</button>'

      btn.addEventListener('click', function(){
        var d = btn.getAttribute('data-d');
        if (!d || d === curDoc) return;
        curDoc = d;
        qDoc = ''; marks = []; markIdx = -1;
        renderDoc();
      });
    });

    treeHost = host.querySelector('.float-host');
    treeBtn = document.getElementById('ruleTreeBtn');
    treePanel = document.getElementById('ruleTree');
    if (treeHost && treeBtn && treePanel) {
      treeBtn.addEventListener('click', function(e){
        e.stopPropagation();
        setTreeOpen(treePanel.hidden);
      });
      treePanel.addEventListener('click', function(e){ e.stopPropagation(); });
      treePanel.querySelectorAll('.fp-row').forEach(function(row){
        row.addEventListener('click', function(){
          var sid = row.getAttribute('data-sid');
          scrollToSection(sid);
          setActiveChapter(sid);
          setTreeOpen(false);
        });
      });
    }

    var ex = document.getElementById('exportPdfBtn');
    if (ex) ex.addEventListener('click', function(){ try { window.print(); } catch (e) {} });
  } else if (tab === 2) {
    host.innerHTML = '<a class="btn-pill" href="docs/manual.pdf" download>下载 PDF</a>'
      + '<a class="btn-pill primary" href="docs/manual.pdf" target="_blank" rel="noopener">在外部打开 ↗</a>';
  }
}

    + '</div></div>';

  document.getElementById('m').innerHTML = '<div class="tab-content active">'
    + toolbar
    + '<div class="doc-card"><div class="doc-art" id="db">' + docHtml(doc) + '</div></div>'
    + '</div>';

  renderHeadActions(tree);
  fillSideDoc(tree);
  bindDocControls();
  /* 重建正文后旧的 <mark> 引用已失效：清空后按当前检索词重新高亮（切 tab 回来也不丢检索） */
  marks = []; markIdx = -1;
  if (qDoc) doSearch(); else supdateCount();
  window.requestAnimationFrame(syncSpy);
}

    btn.addEventListener('click', function(){

function bindDocControls(){
  var dsi = document.getElementById('dsi');
  var dsb = document.getElementById('dsb');
  var dsp = document.getElementById('dsp');
  var dsn = document.getElementById('dsn');
  if (dsb) dsb.addEventListener('click', doSearch);
  if (dsi) dsi.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
  if (dsp) dsp.addEventListener('click', function(){ gotoMark(markIdx - 1); });
  if (dsn) dsn.addEventListener('click', function(){ gotoMark(markIdx + 1); });
}

/* ---------- 全文检索（含繁→简回退） ---------- */
function clearMarks(){
  var db = document.getElementById('db');
  marks = []; markIdx = -1;
  if (!db) return;
  db.querySelectorAll('mark.doc-hl').forEach(function(m){
    var t = document.createTextNode(m.textContent);
    m.parentNode.replaceChild(t, m);
  });
  if (db.normalize) db.normalize();
}
function collectMatches(root, q){
  var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  var nodes = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
  while ((n = walker.nextNode())) {
    if (n.nodeValue && n.nodeValue.indexOf(q) >= 0) nodes.push(n);
    else { re.lastIndex = 0; if (re.test(n.nodeValue || '')) nodes.push(n); re.lastIndex = 0; }
  }
  var out = [];
  nodes.forEach(function(node){
    var text = node.nodeValue; re.lastIndex = 0;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    var frag = document.createDocumentFragment(), last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var mk = document.createElement('mark');
      mk.className = 'doc-hl';
      mk.textContent = m[0];
      frag.appendChild(mk);
      out.push(mk);
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    if (node.parentNode) node.parentNode.replaceChild(frag, node);
  });
  return out;
}
function findMatches(q){
  var db = document.getElementById('db');
  if (!db || !q) return [];
  clearMarks();
  var res = collectMatches(db, q);
  if (!res.length) {
    var q2 = normCJK(q);
    if (q2 && q2 !== q) res = collectMatches(db, q2);
  }
  return res;
}
function doSearch(){
  var dsi = document.getElementById('dsi');
  var q = ((dsi && dsi.value) || '').trim();
  qDoc = q;
  marks = findMatches(q);
  markIdx = marks.length ? 0 : -1;
  supdateCount();
  if (markIdx >= 0) gotoMark(0);
}
function gotoMark(idx){
  if (!marks.length) { markIdx = -1; supdateCount(); return; }
  if (idx < 0) idx = 0;
  if (idx > marks.length - 1) idx = marks.length - 1;
  markIdx = idx;
  marks.forEach(function(m, i){ m.classList.toggle('doc-hl-cur', i === markIdx); });
  var el = marks[markIdx];
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  supdateCount();
}
function supdateCount(){
  var dsc = document.getElementById('dsc'), dsp = document.getElementById('dsp'), dsn = document.getElementById('dsn');
  if (dsc) dsc.textContent = marks.length ? (markIdx + 1) + '/' + marks.length : '0/0';
  if (dsp) dsp.disabled = markIdx <= 0;
  if (dsn) dsn.disabled = markIdx >= marks.length - 1;
}

function shuDesc(name){
  if (SHU_DESC && SHU_DESC[name]) return SHU_DESC[name];
  var base = String(name || '').replace(/(之属|之部)$/, '');
  for (var i = 0; i < SHU_RULES.length; i++) {
    if (base.indexOf(SHU_RULES[i][0]) >= 0) return SHU_RULES[i][1];
  }
  if (base) return base + '类著作。';
  return '';
}
function shuEx(name){ return (SHU_EX && SHU_EX[name]) ? SHU_EX[name] : ''; }

function shuOf(groupName, className){
  var key = groupName + '|' + className;
  if (SHU_SUPPLEMENT[key]) return SHU_SUPPLEMENT[key];
  var T = catalogTree();
  var g = T[groupName];
  if (!g) return [];
  var arr = g[className];
  return Array.isArray(arr) ? arr : [];
}

/* 繁→简归一（检索用）：优先 kanseki_conv.js 的 KANSEKI_T2S，回退 conv_tables.js 的 T2S_MAP */
function normCJK(s){
  s = String(s == null ? '' : s);
  var P = (typeof KANSEKI_T2S_PHRASE !== 'undefined') ? KANSEKI_T2S_PHRASE : null;
  if (P) { for (var k in P) { if (s.indexOf(k) >= 0) s = s.split(k).join(P[k]); } }
  var M = (typeof KANSEKI_T2S !== 'undefined') ? KANSEKI_T2S : ((typeof T2S_MAP !== 'undefined') ? T2S_MAP : null);
  if (!M) return s;
  var out = '';
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    out += (M[c] !== undefined ? M[c] : c);
  }
  return out;
}

/* ---------- 分类表：渲染 ---------- */
function catRowHtml(c, idx, shu){
  var books = (c.books || []).map(function(b){ return '<span class="bk">' + sc(b) + '</span>'; }).join('');
  var shuHtml = '';
  if (shu.length) {
    shuHtml = '<div class="shu-list">' + shu.map(function(name){
      var d = shuDesc(name), ex = shuEx(name);
      return '<div class="shu-item"><b>' + sc(name) + '</b><span class="shu-desc">' + sc(d) + '</span>'
        + (ex ? '<span class="shu-ex">' + sc(ex) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  } else {
    shuHtml = '<div class="shu-empty">该类无下位属。</div>';
  }
  return '<article class="cat-row">'
    + '<div class="cat-row-head"><span class="cat-idx">' + String(idx + 1).padStart(2, '0') + '</span>'
    +   '<h4>' + sc(c.name) + '</h4>'
    +   '<span class="cat-shu-n">' + (shu.length ? shu.length + ' 属' : '') + '</span></div>'
    + '<p class="cat-intro">' + sc(c.intro || '') + '</p>'
    + '<div class="cat-books">' + books + '</div>'
    + shuHtml
    + '</article>';
}

function paintCatBody(){
  var box = document.getElementById('catScroll');
  if (!box) return;
  var groups = standardGroups();
  var q = normCJK((qCat || '').trim());
  var hitText = function(s){ return !q || normCJK(s).indexOf(q) >= 0; };
  var totalClasses = 0, totalShu = 0, shownClasses = 0, shownShu = 0;
  var html = '';

  groups.forEach(function(g){
    var classes = g.classes || [];
    totalClasses += classes.length;
    if (catGroup !== 'all' && g.name !== catGroup) return;
    var groupHit = hitText(g.name) || hitText(g.intro || '');
    var rows = '', clsShown = 0;
    classes.forEach(function(c, idx){
      var shu = shuOf(g.name, c.name);
      totalShu += shu.length;
      if (catGroup === 'all') { /* 计数在 total 阶段已完成 */ }
      var shuHit = false;
      if (q) {
        for (var i = 0; i < shu.length; i++) {
          if (hitText(shu[i]) || hitText(shuDesc(shu[i])) || hitText(shuEx(shu[i]))) { shuHit = true; break; }
        }
      }
      var hit = groupHit || !q || hitText(c.name) || hitText(c.intro || '')
        || (c.books || []).some(function(b){ return hitText(b); }) || shuHit;
      if (!hit) return;
      clsShown++; shownClasses++; shownShu += shu.length;
      rows += catRowHtml(c, idx, shu);
    });
    if (!clsShown && q) return;
    html += '<section class="cat-group" id="cg-' + sc(g.id || g.name) + '">'
      + '<div class="cat-group-head"><h3>' + sc(g.name) + '</h3><span class="cat-count">' + clsShown + ' 类</span></div>'
      + '<p class="cat-group-intro">' + sc(g.intro || '') + '</p>'
      + rows + '</section>';
  });

  if (!html) {
    html = '<div class="cat-empty">没有匹配的类目，换个关键词试试（可检索类名、收录说明或书名）。</div>';
  }
  box.innerHTML = html;

  var cnt = document.getElementById('catCount');
  if (cnt) {
    cnt.textContent = (q || catGroup !== 'all')
      ? ('显示 ' + shownClasses + ' / ' + totalClasses + ' 类 · ' + shownShu + ' 属')
      : (totalClasses + ' 类 · ' + totalShu + ' 属');
  }
}

function setCatGroup(name){
  catGroup = name || 'all';
  document.querySelectorAll('[data-g]').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-g') === catGroup);
  });
  paintCatBody();
}

function fillSideCat(groups){
  var box = document.getElementById('sideAnchors');
  if (!box) return;
  var total = groups.reduce(function(n, g){ return n + (g.classes || []).length; }, 0);
  var totalShu = 0;
  groups.forEach(function(g){ (g.classes || []).forEach(function(c){ totalShu += shuOf(g.name, c.name).length; }); });
  var updated = '';
  try { updated = (window.STANDARD_CLASSIFY && window.STANDARD_CLASSIFY.updated) || ''; } catch (e) {}
  box.setAttribute('data-tab', '1');
  box.innerHTML = '<div class="side-label">标准分类</div>'
    + '<div class="anchor-list">'
    + '<button class="cfb cfb-side' + (catGroup === 'all' ? ' active' : '') + '" data-g="all">全部类目<span class="gcnt">' + total + '</span></button>'
    + groups.map(function(g){
        return '<button class="cfb cfb-side' + (catGroup === g.name ? ' active' : '') + '" data-g="' + sc(g.name) + '">' + sc(g.name) + '<span class="gcnt">' + (g.classes || []).length + '</span></button>';
      }).join('')
    + '</div>'
    + '<div class="side-card" style="margin-top:.7rem">'
    +   '<div class="cr"><span>类目数</span><b>' + total + ' 类</b></div>'
    +   '<div class="cr"><span>下位属</span><b>' + totalShu + ' 属</b></div>'
    +   '<div class="cr"><span>更新</span><b>' + sc(updated || '—') + '</b></div>'
    + '</div>';
  box.querySelectorAll('.cfb-side').forEach(function(btn){
    btn.addEventListener('click', function(){ setCatGroup(btn.getAttribute('data-g')); });
  });
}

function renderCat(){
  var groups = standardGroups();
  var totalClasses = groups.reduce(function(n, g){ return n + (g.classes || []).length; }, 0);
  document.getElementById('m').innerHTML = '<div class="tab-content active">'
    + '<div class="cat-toolbar">'

    +     '<input id="csi" type="text" placeholder="检索类目 / 收录说明 / 书名……" value="' + sc(qCat) + '" autocomplete="off" aria-label="检索分类表">'
    +   '</div>'
    +   '<div class="cat-meta" id="catCount"></div>'
    + '</div>'
    + '<div class="cat-chips" id="catChips">'
    +   '<button class="cat-chip' + (catGroup === 'all' ? ' active' : '') + '" data-g="all" type="button">全部<span class="n">' + totalClasses + '</span></button>'
    +   groups.map(function(g){
          return '<button class="cat-chip' + (catGroup === g.name ? ' active' : '') + '" data-g="' + sc(g.name) + '" type="button">' + sc(g.name) + '<span class="n">' + (g.classes || []).length + '</span></button>';
        }).join('')
    + '</div>'
    + '<div id="catScroll"></div>'
    + '</div>';

  fillSideCat(groups);
  paintCatBody();
  renderHeadActions(null);

  var chips = document.getElementById('catChips');
  if (chips) chips.addEventListener('click', function(e){
    var b = e.target.closest('.cat-chip');
    if (!b) return;
    setCatGroup(b.getAttribute('data-g'));
  });
  var csi = document.getElementById('csi');
  if (csi) csi.addEventListener('input', function(){
    qCat = this.value.trim();
    // 检索时自动回到「全部」，否则会受上一次部筛选限制而查不到
    if (qCat && catGroup !== 'all') {
      catGroup = 'all';
      document.querySelectorAll('[data-g]').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-g') === 'all'); });
    }
    paintCatBody();
  });
}

/* ============================================================

 * ============================================================ */
/* 站点顶栏实际高度（网页版 sticky 顶栏；桌面内嵌由构建隐藏 → 0） */
function stickyTopOffset(){
  var hdr = document.querySelector('.app-header');
  if (!hdr) return 0;
  var cs = window.getComputedStyle(hdr);
  if (cs.display === 'none' || cs.visibility === 'hidden') return 0;
  var h = hdr.getBoundingClientRect().height;
  return h > 0 ? Math.round(h) : 0;
}
/* 细则查阅吸顶：tab 0 时 .page-head 固定在顶栏下方；tab 2 说明与标题同一行 */
function refreshPageHeadSticky(){
  var head = document.querySelector('.page-head');
  if (!head) return;
  document.documentElement.style.setProperty('--ph-sticky-top', stickyTopOffset() + 'px');
  head.classList.toggle('is-sticky', tab === 0);
  head.classList.toggle('is-inline-desc', tab === 2);
  updateStuckState();
}
function updateStuckState(){
  var head = document.querySelector('.page-head');
  if (!head || !head.classList.contains('is-sticky')) { if (head) head.classList.remove('is-stuck'); return; }
  var top = stickyTopOffset();
  head.classList.toggle('is-stuck', head.getBoundingClientRect().top <= top + 0.5);
}
window.addEventListener('resize', function(){
  if (refreshPageHeadSticky._t) clearTimeout(refreshPageHeadSticky._t);
  refreshPageHeadSticky._t = setTimeout(function(){ refreshPageHeadSticky._t = null; refreshPageHeadSticky(); }, 120);
});

function updatePageHead(){
  var meta = TAB_META[tab] || TAB_META[0];
  var title = document.getElementById('pageTitle');
  var desc = document.getElementById('pageDesc');
  if (title) title.textContent = meta.title;
  if (desc) desc.textContent = meta.desc;
  refreshPageHeadSticky();
}

function clearPageHeadActions(){
  var host = document.getElementById('pageHeadActions');
  if (host) host.innerHTML = '';
  treeHost = null; treeBtn = null; treePanel = null;
}

function render(){
  clearPageHeadActions();
  if (tab === 0) renderDoc();
  else if (tab === 1) renderCat();
  else renderPdf();
}

var lastTab = -1;
function setTab(n, skipUrl){
  var changed = (n !== lastTab);
  lastTab = n;
  tab = n;
  document.querySelectorAll('.tab-btn').forEach(function(b){
    var on = parseInt(b.getAttribute('data-tab'), 10) === n;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  updatePageHead();
  render();
  if (changed) {
    try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) { window.scrollTo(0, 0); }
  }
  if (!skipUrl) {
    try {
      var u = new URL(location.href);
      if (n === 0) u.searchParams.delete('tab'); else u.searchParams.set('tab', String(n));
      if (/#tab=\d/.test(u.hash)) u.hash = '';
      history.replaceState(null, '', u.href);
    } catch (e) {}
  }
}

function tabFromUrl(){
  var n = null;
  try {
    var sp = new URLSearchParams(location.search || '');
    if (sp.has('tab')) n = parseInt(sp.get('tab'), 10);
  } catch (e) {}
  if (n === null || isNaN(n)) {
    var m = /#tab=(\d)/.exec(location.hash || '');
    if (m) n = parseInt(m[1], 10);
  }
  if (n === null || isNaN(n) || n < 0 || n > 2) n = 0;
  return n;
}

/* 外壳/外部脚本切换 tab 的稳定入口（与 ?tab= 深链等价）。
   桌面外壳 app.js 仍按隐藏的 .tab-btn 点击切换；本 API 作为第二入口保留，
   页面内不再渲染可见切换条。 */
window.activateCatalogTab = function(n, skipUrl){
  var k = parseInt(n, 10);
  if (isNaN(k) || k < 0 || k > 2) return false;
  if (k !== tab) setTab(k, skipUrl !== false);
  return true;
};

 * 主题 / 初始化
 * ============================================================ */
function syncThemeBtn(){
  var b = document.getElementById('themeToggle');
  if (b) b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☾' : '☀';
}
function initTheme(){
  var t = 'light';
  try { t = localStorage.getItem('theme') || 'light'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  syncThemeBtn();
}
(function bindThemeToggle(){
  var b = document.getElementById('themeToggle');
  if (!b) return;
  b.addEventListener('click', function(){
    var c = document.documentElement.getAttribute('data-theme');
    var n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    try { localStorage.setItem('theme', n); } catch (e) {}
    syncThemeBtn();
  });
})();

function initTabs(){
  var seg = document.getElementById('tabSeg');
  if (!seg) return;
  seg.addEventListener('click', function(e){
    var b = e.target.closest('.tab-btn');
    if (!b) return;
    var n = parseInt(b.getAttribute('data-tab'), 10);
    if (isNaN(n) || n === tab) return;
    setTab(n);
  });
}

initTheme();
initTabs();
setTab(tabFromUrl(), true);

/* 细则深链：#sec-sNN 直接滚到对应章节 */
(function applySectionHash(){
  var m = /^#sec-(s\d+)$/.exec(location.hash || '');
  if (!m) return;
  if (tab !== 0) setTab(0, true);
  setTimeout(function(){ scrollToSection(m[1]); }, 120);
})();
})();
