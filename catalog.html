<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%232b3a67'/%3E%3Ctext%20x='16'%20y='22'%20font-size='17'%20text-anchor='middle'%20fill='%23fff'%20font-family='serif'%3E%E6%BC%A2%3C/text%3E%3C/svg%3E">
<title>日本漢籍編目工具 — 編目規範</title>
<style>
:root{--color-bg:#f7f4ee;--color-bg-alt:#ede8df;--color-surface:#fff;--color-surface-hover:#f0ece5;--color-primary:#1a2a4a;--color-primary-light:#2d4470;--color-accent:#8b6914;--color-accent-light:#b8942c;--color-text:#2d2a26;--color-text-secondary:#5c564d;--color-text-muted:#8a8278;--color-border:#d5cec2;--color-border-light:#e8e2d8;--color-divider:#ebe5da;--color-highlight:#fff3cd;--color-highlight-text:#8b6914;--color-table-header:#1a2a4a;--color-table-header-text:#e8e2d8;--color-shadow:rgba(26,42,74,.08);--color-shadow-lg:rgba(26,42,74,.12);--font-display:'Noto Serif SC','SimSun','STSong',serif;--font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--transition-fast:150ms ease;--radius-sm:4px;--radius-md:8px;--radius-lg:12px;--shadow-sm:0 1px 3px var(--color-shadow);--shadow-md:0 4px 12px var(--color-shadow);--shadow-lg:0 8px 24px var(--color-shadow-lg)}
[data-theme="dark"]{--color-bg:#1a1c1e;--color-bg-alt:#242629;--color-surface:#2a2d30;--color-surface-hover:#33363a;--color-primary:#8ba4d0;--color-primary-light:#a3b8db;--color-accent:#d4a843;--color-text:#e0dcd5;--color-text-secondary:#b0aaa0;--color-text-muted:#7a746c;--color-border:#4a4640;--color-border-light:#3a3632;--color-divider:#3a3632;--color-highlight:#3d3520}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);font-size:.9375rem;line-height:1.65;color:var(--color-text);background:var(--color-bg);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:var(--color-text-muted);border-radius:4px}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

.app-header{background:var(--color-primary);color:var(--color-table-header-text);padding:.8rem 0;position:sticky;top:0;z-index:100}
.header-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0}
.header-brand .bi{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1rem;color:#fff;font-weight:700}
.header-brand h1{font-family:var(--font-display);font-size:1.1rem;color:#e8e2d8;white-space:nowrap}
.header-nav{display:flex;gap:.25rem;flex-shrink:0}
.header-nav a{color:rgba(232,226,216,.65);text-decoration:none;font-size:.85rem;font-weight:500;padding:.35rem .75rem;border-radius:var(--radius-sm);transition:all var(--transition-fast);white-space:nowrap}
.header-nav a:hover{color:#e8e2d8;background:rgba(255,255,255,.08)}
.header-nav a.active{color:#e8e2d8;background:rgba(255,255,255,.12);font-weight:600}
.header-actions{margin-left:auto;display:flex;gap:.5rem}
.btn-icon{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:rgba(232,226,216,.85);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);font-size:1rem}
.btn-icon:hover{background:rgba(255,255,255,.18)}

.tab-bar{background:var(--color-surface);border-bottom:1px solid var(--color-border-light);position:sticky;top:60px;z-index:90;box-shadow:var(--shadow-sm)}
.tab-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;display:flex}
.tab-btn{padding:.7rem 1.5rem;border:none;background:none;font-family:var(--font-body);font-size:.9rem;color:var(--color-text-secondary);cursor:pointer;border-bottom:3px solid transparent;transition:all var(--transition-fast)}
.tab-btn:hover{color:var(--color-text)}
.tab-btn.active{color:var(--color-primary);border-bottom-color:var(--color-primary);font-weight:600}
[data-theme="dark"] .tab-btn.active{color:var(--color-primary-light);border-bottom-color:var(--color-primary-light)}
.tab-content{display:none;max-width:1400px;margin:0 auto;padding:1rem 1.5rem}
.tab-content.active{display:block}

/* Doc viewer */
.doc-toolbar{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.doc-toolbar .ver-btn{padding:.4rem 1.2rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);font-family:var(--font-body);font-size:.85rem;cursor:pointer;transition:all var(--transition-fast)}
.doc-toolbar .ver-btn.active{background:var(--color-primary);color:var(--color-table-header-text);border-color:var(--color-primary)}
.doc-search{display:flex;gap:.35rem;align-items:center;margin-left:auto}
.doc-search input{padding:.4rem .75rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.85rem;width:200px}
.doc-search input:focus{outline:none;border-color:var(--color-primary)}
.doc-search button,.doc-nav-btn{padding:.4rem .8rem;border:1px solid var(--color-primary);border-radius:var(--radius-sm);background:var(--color-primary);color:var(--color-table-header-text);font-family:var(--font-body);font-size:.82rem;cursor:pointer}
.doc-nav-btn{padding:.3rem .5rem;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-size:.78rem}
.doc-nav-btn:disabled{opacity:.35;cursor:default}
.doc-body{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:1.5rem 2rem;max-height:calc(100vh - 240px);overflow-y:auto;line-height:2;font-size:.9rem}
.doc-body p{margin-bottom:.6rem}
.doc-body .stitle{font-size:1.05rem;font-weight:700;color:var(--color-primary);margin:1.4rem 0 .4rem;padding-bottom:.3rem;border-bottom:1px solid var(--color-divider)}
.doc-body .stitle:first-child{margin-top:0}
.doc-body .stitle.center{text-align:center;border-bottom:none;margin:1.2rem 0 .6rem}
.doc-body .stitle.center:first-child{font-size:1.25rem;margin-top:0}
.doc-body .doc-ex{background:var(--color-bg-alt);border-left:3px solid var(--color-accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.6rem 1rem;margin:.5rem 0 .9rem;font-size:.88rem;line-height:1.9}
.doc-body .doc-ex p{margin-bottom:.3rem}
.doc-body .doc-ex p:last-child{margin-bottom:0}
.doc-body .doc-code{background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:.8rem 1rem;margin:.5rem 0 .9rem;font-family:var(--font-display);font-size:.85rem;line-height:1.9;white-space:pre-wrap;overflow-x:auto}
.doc-body .doc-item{margin-bottom:.35rem}
.doc-body .doc-item:last-child{margin-bottom:.6rem}
mark.doc-hl{background:var(--color-highlight);color:var(--color-highlight-text);padding:0 2px;border-radius:2px;font-weight:600}

/* PDF viewer */
.pdf-toolbar{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.pdf-name{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--color-primary)}
.pdf-sub{font-size:.8rem;color:var(--color-text-muted)}
.pdf-open{margin-left:auto;padding:.35rem .85rem;border:1px solid var(--color-primary);border-radius:var(--radius-sm);background:var(--color-primary);color:var(--color-table-header-text);font-size:.82rem;text-decoration:none;transition:all var(--transition-fast)}
.pdf-open:hover{background:var(--color-primary-light)}
.pdf-frame{width:100%;height:calc(100vh - 220px);min-height:480px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface)}

/* Cat table */
.cat-toolbar{display:flex;gap:.35rem;margin-bottom:.75rem;flex-wrap:wrap;align-items:center}
.cat-toolbar .cfb{padding:.35rem .8rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-surface);font-size:.8rem;font-family:var(--font-body);cursor:pointer;transition:all var(--transition-fast)}
.cat-toolbar .cfb:hover{border-color:var(--color-primary)}
.cat-toolbar .cfb.active{background:var(--color-primary);color:var(--color-table-header-text);border-color:var(--color-primary)}
.cs{padding:.35rem .6rem;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.82rem;width:180px;margin-left:auto}
.cs:focus{outline:none;border-color:var(--color-primary)}

.ctbl{width:100%;border-collapse:collapse;background:var(--color-surface);font-size:.84rem}
.ctbl th{background:var(--color-table-header);color:var(--color-table-header-text);padding:.45rem .6rem;text-align:left;font-weight:600;font-size:.76rem;position:sticky;top:0;z-index:5}
.ctbl td{padding:.35rem .6rem;border-bottom:1px solid var(--color-divider);vertical-align:top;line-height:1.55}
.ctbl tr:hover td{background:var(--color-surface-hover)}
.ctbl .r-l1 td{background:var(--color-bg-alt);font-weight:700;color:var(--color-primary);font-size:.88rem;padding-top:.55rem}
.ctbl .r-l2 td{font-weight:600}
.ctbl .r-l3 td .l3-name{padding-left:1.2rem;font-size:.82rem}
.ctbl .r-l3 td{font-size:.81rem;color:var(--color-text-secondary)}
.ctbl td .desc{font-size:.78rem;color:var(--color-text-secondary)}

@media(max-width:768px){
  .header-inner{padding:0 1rem}.header-brand h1{font-size:.85rem}.header-nav a{font-size:.75rem;padding:.3rem .5rem}
  .tab-btn{font-size:.8rem;padding:.5rem .8rem}.tab-content{padding:.75rem}
  .doc-body{padding:1rem;font-size:.82rem}.doc-search{width:100%}.doc-search input{flex:1;width:auto}
  .ctbl{font-size:.76rem}.cs{width:100%}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <a href="index.html" class="header-brand"><div class="bi">漢</div><h1>日本漢籍編目工具</h1></a>
    <nav class="header-nav">
      <a href="guide.html">使用介紹</a><a href="index.html">紀年查詢</a><a href="catalog.html" class="active">編目規範</a><a href="changelog.html">更新日誌</a>
    </nav>
    <div class="header-actions"><button class="btn-icon" id="themeToggle" title="暗色/亮色">☀</button></div>
  </div>
</header>

<div class="tab-bar"><div class="tab-inner">
  <button class="tab-btn active" data-tab="0">細則查閱</button>
  <button class="tab-btn" data-tab="1">分類表查詢</button>
  <button class="tab-btn" data-tab="2">工作手冊</button>
</div></div>
<main id="m"></main>

<script src="catalog_data.js"></script>
<script>
(function(){
initTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n)});
let tab=0,curDoc='2023',sri=-1,sr=[],cS='';

document.querySelector('.tab-inner').addEventListener('click',function(e){const b=e.target.closest('.tab-btn');if(!b)return;tab=parseInt(b.dataset.tab);document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
render();

function initTheme(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}
function sc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(){if(tab===0)renderDoc();else if(tab===1)renderCat();else renderPdf()}

// ==================== TAB 2: PDF Manual Viewer ====================
function renderPdf(){
  document.getElementById('m').innerHTML=`
    <div class="tab-content active">
      <div class="pdf-toolbar">
        <span class="pdf-name">《全球汉籍合璧工程精华编》整理工作手册（修订）</span>
        <span class="pdf-sub">PDF 原版 · 可直接翻阅、缩放、打印</span>
        <a class="pdf-open" href="docs/manual.pdf" target="_blank">新窗口打开 ↗</a>
      </div>
      <iframe class="pdf-frame" src="docs/manual.pdf" title="《全球汉籍合璧工程精华编》整理工作手册"></iframe>
    </div>`;
}

// ==================== TAB 0: Document Viewer ====================
function renderDoc(){
  const d=curDoc==='2025'?DOC2025:DOC2023;
  let h='';
  d.forEach((s,i)=>{h+='<div class="stitle'+(i<2?' center':'')+'">'+sc(s.title)+'</div>'+s.html;});
  document.getElementById('m').innerHTML=`
    <div class="tab-content active">
      <div class="doc-toolbar">
        <button class="ver-btn${curDoc==='2023'?' active':''}" data-d="2023">2023 舊版細則</button>
        <button class="ver-btn${curDoc==='2025'?' active':''}" data-d="2025">2025 新版細則</button>
        <div class="doc-search">
          <input type="text" id="dsi" placeholder="檢索全文……" value="${sc(cS)}" autocomplete="off">
          <button id="dsb">檢索</button>
          <button class="doc-nav-btn" id="dsp" disabled>‹</button>
          <span style="font-size:.8rem;color:var(--color-text-muted);min-width:40px;text-align:center" id="dsc"></span>
          <button class="doc-nav-btn" id="dsn" disabled>›</button>
        </div>
      </div>
      <div class="doc-body" id="db">${h}</div>
    </div>`;
  document.querySelectorAll('.ver-btn').forEach(b=>b.addEventListener('click',function(){curDoc=this.dataset.d;sri=-1;sr=[];cS='';renderDoc()}));
  document.getElementById('dsb').addEventListener('click',srch);
  document.getElementById('dsi').addEventListener('keydown',function(e){if(e.key==='Enter')srch()});
  document.getElementById('dsp').addEventListener('click',()=>{if(sri>0){sri--;scrS()}});
  document.getElementById('dsn').addEventListener('click',()=>{if(sri<sr.length-1){sri++;scrS()}});
  function srch(){
    const db=document.getElementById('db'),q=document.getElementById('dsi').value.trim();cS=q;
    db.querySelectorAll('mark.doc-hl').forEach(m=>m.outerHTML=m.textContent);sr=[];
    if(!q){updateN();return}
    const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    db.querySelectorAll('*').forEach(el=>{if(el.childNodes.length===1&&el.childNodes[0].nodeType===3&&re.test(el.textContent))sr.push(el)});
    if(sr.length===0){updateN();return}
    sri=0;sr.forEach(el=>el.innerHTML=el.textContent.replace(re,'<mark class="doc-hl">$1</mark>'));scrS();updateN()
  }
  function scrS(){if(sri<0||sri>=sr.length)return;sr[sri].scrollIntoView({behavior:'smooth',block:'center'});updateN()}
  function updateN(){document.getElementById('dsc').textContent=sr.length?(sri+1)+'/'+sr.length:'0/0';document.getElementById('dsp').disabled=sri<=0;document.getElementById('dsn').disabled=sri>=sr.length-1}
}

// ==================== TAB 1: Catalog Table ====================
const L3D={/* L3 descriptions */
  '正文之屬':'經文白文及校勘本，不含注釋。',
  '傳説之屬':'歷代注疏、傳注、集解等闡釋經義的著作。',
  '圖説之屬':'以圖譜、圖表輔助解說經義的著作。',
  '分篇之屬':'對經書中某一篇單獨進行注解的著作。',
  '專著之屬':'就某一專題進行深入研究的專門著作。',
  '易例之屬':'研究《周易》體例、卦序、義例的著作。',
  '易占之屬':'《周易》占筮方法及其應用的著作。',
  '文字音義之屬':'經書文字的音讀、訓詁、校勘著作。',
  '古易之屬':'研究漢代以前古易學（如帛書《周易》）的著作。',
  '書序之屬':'《尚書》各篇序文的研究著作。',
  '逸書之屬':'輯錄已失傳《尚書》篇章的著作。',
  '詩序之屬':'《詩經》序文（大序、小序）的研究著作。',
  '三家詩之屬':'齊、魯、韓三家詩的輯佚與研究著作。',
  '詩譜之屬':'《詩經》篇目年代譜系的著作。',
  '通禮':'通論禮制的綜合性禮學著作，不限於某一禮經。',
  '雜禮書':'私家禮儀、鄉約、家禮等雜禮著作。',
  '律呂之屬':'研究樂律、音律理論的著作。',
  '樂理之屬':'音樂理論、樂制研究的著作。',
  '凡例之屬':'研究經書注釋體例、書法的著作。',
  '緯書之屬':'讖緯類著作，附會經義言災異吉凶。',
  '沿革之屬':'研究某學術領域歷史演變的著作。',
  '叢編之屬':'該類目之下的叢書、彙編著作。',
  '石經之屬':'石刻經文的拓本、釋文、考證著作。',

  '經濟':'經世濟民的政論、時務著作。',
  '性理':'宋明理學家關於心性、天理的著作。',
  '禮教':'儒家禮儀教化、修身養性類著作。',
  '譜録類':'器物、草木、飲饌、蟲魚等譜錄著作（2025版新增）。',
  '附錄之屬':'附錄性質的補充資料彙編。',
  '名物制度之屬':'考證禮儀名物、典章制度的著作。',
  '三禮圖之屬':'以圖譜解說三禮儀節、器物的著作。',
  '目録之屬':'目錄、索引類工具性著作。',
  '論説之屬':'論述、評說性質的著作。',
  '通紀':'通代記載的史書或典制。',
  '專志':'專門記載某一領域制度沿革的著作。',
  '官制':'官職設置、沿革的著作。',
  '官箴':'為官之道的箴言、規誡著作。',
  '邦計之屬':'國家財政、經濟管理類著作。',
  '軍政之屬':'軍事制度、邊防海防類著作。',
  '刑法之屬':'刑法制度、律例判牘類著作。',
  '考工之屬':'工程營造、器物製作類著作。',
  '掌故瑣記之屬':'掌故軼事、筆記雜錄。',
  '詔令之屬':'帝王頒佈的詔書、敕令。',
  '奏議之屬':'朝臣上奏的章表、奏議。',
  '公牘之屬':'官府往來公文、移牒。',
  '總志之屬':'全國性或區域性總志。',
  '方志之屬':'地方志書。',
  '雜志之屬':'雜記地理、風土的著作。',
  '山水之屬':'山水志、名勝志、遊記等。',
  '專志之屬':'專門記載某類地理的著作（宮殿、園亭、寺觀、祠墓、書院等）。',
  '遊記之屬':'紀行、紀勝類遊記著作。',
  '中外雜紀之屬':'記述域外地理、風土的著作。',
  '通論之屬':'目錄學通論、義例、考訂著作。',
  '總錄之屬':'綜合性書目、史志目錄、公私藏書目。',

  '專錄之屬':'某一專題、專門的目錄著作。',

  '錢幣之屬':'歷代錢幣圖錄、考證著作。',
  '璽印之屬':'歷代印章、封泥的著錄與考證。',
  '甲骨之屬':'甲骨文拓片、釋文、考證著作。',
  '簡牘之屬':'簡牘帛書的圖版、釋文、研究著作。',

function descFor(name){
  if(L3D[name])return L3D[name];
  // Generate descriptions for 之屬 patterns
  if(name.endsWith('之屬')||name.endsWith('之部')){
    const base=name.replace(/[之屬之部]/g,'');
    if(base.includes('文字音義'))return '經書文字的音讀、訓詁、校勘著作。';
    if(base.includes('傳說')||base.includes('傳説'))return '歷代注解、闡釋經義的著作。';
    if(base.includes('正文'))return '經文白文及校勘本，不含注釋。';
    if(base.includes('圖說')||base.includes('圖説')||base.includes('圖譜'))return '以圖譜、圖表輔助解說的著作。';
    if(base.includes('分篇'))return '對經書中某一篇單獨注解的著作。';
    if(base.includes('專著'))return '就某一專題深入研究的專門著作。';
    if(base.includes('凡例'))return '研究注釋體例的著作。';
    if(base.includes('沿革'))return '研究歷史演變沿革的著作。';
    if(base.includes('叢編'))return '該類目之下的叢書、彙編著作。';
    if(base.includes('附錄')||base.includes('附录'))return '補充性附錄資料彙編。';
    return base+'相關的專門著作。';
  }
  return CAT_DESC[name]||'';
}

function exFor(name){return L3E[name]||''}

let catL1='all',catL2='all',$q='';

function renderCat(){
  let rows='';
  for(const[l1,l2map]of Object.entries(CATALOG_TREE)){
    if(catL1!=='all'&&l1!==catL1)continue;
    const l1m=!$q||l1.includes($q)||(CAT_DESC[l1]||'').includes($q);
    let l1shown=l1m;
    let l1rows='';
    for(const[l2,l3list]of Object.entries(l2map)){
      if(catL2!=='all'&&l2!==catL2)continue;
      const l2m=!$q||l2.includes($q)||(CAT_DESC[l2]||'').includes($q);
      const l2d=CAT_DESC[l2]||'';
      let l3m=false;
      if(Array.isArray(l3list))for(const l3 of l3list)if(!$q||l3.includes($q)||(descFor(l3)||'').includes($q)){l3m=true;break}
      if($q&&!l1m&&!l2m&&!l3m)continue;
      l1shown=true;
      const l3html=[];
      if(Array.isArray(l3list))for(const l3 of l3list){
        if($q&&!l3.includes($q)&&!(descFor(l3)||'').includes($q)&&!l2m&&!l1m)continue;
        l3html.push(`<tr class="r-l3"><td></td><td></td><td><div class="l3-name">${hl(l3)}</div></td><td><div class="desc">${sc(descFor(l3))}</div></td><td style="font-style:italic;font-size:.78rem;color:var(--color-accent)">${sc(exFor(l3))}</td></tr>`);
      }
      l1rows+=`<tr class="r-l2"><td style="font-weight:600">${hl(l2)}</td><td>${sc(l2d)}</td><td></td><td></td><td></td></tr>${l3html.join('')}`;
    }
    if(l1shown||!$q){
      rows+=`<tr class="r-l1"><td colspan="5">${hl(l1)}<span style="font-weight:400;font-size:.78rem;color:var(--color-text-secondary);margin-left:.5rem">${sc(CAT_DESC[l1]||'')}</span></td></tr>${l1rows}`;
    }
  }
  
  document.getElementById('m').innerHTML=`
    <div class="tab-content active">
      <div class="cat-toolbar">
        <button class="cfb${catL1==='all'?' active':''}" data-f="all" data-type="l1">全部</button>
        <button class="cfb${catL1==='經部'?' active':''}" data-f="經部" data-type="l1">經部</button>
        <button class="cfb${catL1==='史部'?' active':''}" data-f="史部" data-type="l1">史部</button>
        <button class="cfb${catL1==='子部'?' active':''}" data-f="子部" data-type="l1">子部</button>
        <button class="cfb${catL1==='集部'?' active':''}" data-f="集部" data-type="l1">集部</button>
        <button class="cfb${catL1==='類叢部'?' active':''}" data-f="類叢部" data-type="l1">類叢部</button>
        <button class="cfb${catL1==='附新學類'?' active':''}" data-f="附新學類" data-type="l1">新學類</button>
        <span style="color:var(--color-text-muted);font-size:.8rem;margin:0 .5rem">|</span>
        <span style="font-size:.78rem;color:var(--color-text-secondary)">二級：</span>
        <select class="cfb" id="l2sel" style="max-width:160px"><option value="all"${catL2==='all'?' selected':''}>全部二級</option></select>
        <input type="text" class="cs" id="csi" placeholder="檢索類目名稱……" value="${sc($q)}" autocomplete="off">
      </div>
      <div style="max-height:calc(100vh - 240px);overflow-y:auto">
      <table class="ctbl">
        <thead><tr><th style="width:10%">二級類目</th><th style="width:28%">二級收錄說明</th><th style="width:12%">三級類目</th><th style="width:38%">三級收錄說明</th><th style="width:12%">典型文獻</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>`;
  
  // Populate L2 dropdown based on current L1 filter
  const l2sel=document.getElementById('l2sel');
  const l2set=new Set();
  for(const[l1,l2map]of Object.entries(CATALOG_TREE)){
    if(catL1!=='all'&&l1!==catL1)continue;
    for(const l2 of Object.keys(l2map))l2set.add(l2);
  }
  [...l2set].sort((a,b)=>a.localeCompare(b,'zh')).forEach(l2=>{
    const opt=document.createElement('option');opt.value=l2;opt.textContent=l2;
    if(l2===catL2)opt.selected=true;l2sel.appendChild(opt);
  });
  
  document.querySelectorAll('.cfb[data-type="l1"]').forEach(b=>b.addEventListener('click',function(){
    catL1=this.dataset.f;catL2='all';$q='';renderCat();
  }));
  l2sel.addEventListener('change',function(){catL2=this.value;renderCat()});
  document.getElementById('csi').addEventListener('input',function(){$q=this.value.trim();renderCat()});
}

function hl(t){return $q?t.replace(new RegExp('('+$q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark class="doc-hl">$1</mark>'):t}
})();
