<!DOCTYPE html>
<html lang="zh-HK" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%232b3a67'/%3E%3Ctext%20x='16'%20y='22'%20font-size='17'%20text-anchor='middle'%20fill='%23fff'%20font-family='serif'%3E%E6%BC%A2%3C/text%3E%3C/svg%3E">
<title>日本漢籍編目工具 — 編目規範</title>
<style>
:root{--color-bg:#fafafa;--color-bg-alt:#f5f5f5;--color-surface:#fff;--color-surface-hover:#f5f5f5;--color-primary:#171717;--color-primary-light:#404040;--color-accent:#171717;--color-accent-light:#404040;--color-text:#0a0a0a;--color-text-secondary:#525252;--color-text-muted:#737373;--color-border:#e5e5e5;--color-border-light:#eee;--color-divider:#f0f0f0;--color-highlight:#f5f5f5;--color-highlight-text:#0a0a0a;--color-table-header:#171717;--color-table-header-text:#fafafa;--color-shadow:rgba(0,0,0,.05);--color-shadow-lg:rgba(0,0,0,.09);--font-display:'Noto Serif SC','SimSun','STSong',serif;--font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--transition-fast:150ms cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.16,1,.3,1);--radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:12px;--shadow-sm:0 1px 2px var(--color-shadow);--shadow-md:0 2px 8px -2px var(--color-shadow),0 1px 3px rgba(0,0,0,.04);--shadow-lg:0 8px 30px -6px var(--color-shadow-lg),0 2px 8px rgba(0,0,0,.04)}
[data-theme="dark"]{--color-bg:#0a0a0a;--color-bg-alt:#141414;--color-surface:#171717;--color-surface-hover:#262626;--color-primary:#e5e5e5;--color-primary-light:#fafafa;--color-accent:#fafafa;--color-text:#fafafa;--color-text-secondary:#d4d4d4;--color-text-muted:#a3a3a3;--color-border:rgba(255,255,255,.1);--color-border-light:rgba(255,255,255,.07);--color-divider:rgba(255,255,255,.07);--color-highlight:#262626;--color-highlight-text:#fafafa;--color-table-header:#0a0a0a;--color-table-header-text:#e5e5e5}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);font-size:.9375rem;line-height:1.65;color:var(--color-text);background:var(--color-bg);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:var(--color-text-muted);border-radius:4px}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

/* ===== Header (四页一致) ===== */
.app-header{background:color-mix(in srgb,var(--color-bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--color-text);padding:.8rem 0;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--color-border-light);animation:hdrIn .5s var(--ease-spring)}
@keyframes hdrIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.header-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0}
.header-brand .bi{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1rem;color:var(--color-bg);font-weight:700}
.header-brand h1{font-family:var(--font-display);font-size:1.1rem;color:var(--color-text);white-space:nowrap}
.header-nav{display:flex;gap:.25rem;flex-shrink:0}
.header-nav a{color:var(--color-text-muted);text-decoration:none;font-size:.85rem;font-weight:500;padding:.35rem .75rem;border-radius:var(--radius-sm);transition:all var(--transition-fast);white-space:nowrap}
.header-nav a:hover{color:var(--color-text);background:var(--color-surface-hover)}
.header-nav a.active{color:var(--color-text);background:var(--color-bg-alt);font-weight:600}
.header-actions{margin-left:auto;display:flex;gap:.5rem}
.btn-icon{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);font-size:1rem}
.btn-icon:hover{background:var(--color-surface-hover);color:var(--color-text)}

/* ===== 导航下拉菜单 (说明文档) ===== */
.nav-dropdown{position:relative;flex-shrink:0}
.nav-dropdown-btn{display:inline-flex;align-items:center;gap:.1rem;color:var(--color-text-muted);font-size:.85rem;font-weight:500;font-family:var(--font-body);padding:.35rem .75rem;border-radius:var(--radius-sm);transition:all var(--transition-fast);white-space:nowrap;border:none;background:none;cursor:pointer}
.nav-dropdown-btn:hover{color:var(--color-text);background:var(--color-surface-hover)}
.nav-dropdown-btn.active{color:var(--color-text);background:var(--color-bg-alt);font-weight:600}
.nav-dropdown-btn svg{transition:transform var(--transition-fast)}
.nav-dropdown:hover .nav-dropdown-btn svg,.nav-dropdown:focus-within .nav-dropdown-btn svg{transform:rotate(180deg)}
.nav-dropdown-menu{position:absolute;top:100%;left:0;margin-top:6px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);min-width:132px;padding:.3rem;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s var(--ease-spring),visibility .18s var(--ease-spring),transform .18s var(--ease-spring);z-index:210}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.nav-dropdown-menu a{display:block;padding:.45rem .75rem;border-radius:var(--radius-sm);color:var(--color-text-secondary);font-size:.85rem;text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
.nav-dropdown-menu a:hover{background:var(--color-surface-hover);color:var(--color-text)}
.nav-dropdown-menu a.active{color:var(--color-text);font-weight:600;background:var(--color-bg-alt)}

/* ============================================================
   V3.0 文档站三栏布局 (Animate UI 风格)
   左：深色侧栏导航（shadcn Create 风格圆角卡片）
   中：文档内容
   右：「在本页」目录（scroll-spy）
   ============================================================ */
.docs-layout{max-width:1400px;margin:0 auto;padding:1.25rem 1.5rem 2.5rem;width:100%;display:grid;grid-template-columns:252px minmax(0,1fr) 216px;gap:1.25rem;align-items:start;animation:pageIn .45s var(--ease-spring) .08s backwards;flex:1}
/* V3.1: 无「在本页」目录时（分类表/工作手册 tab）扩展为两列，内容区更宽 */
.docs-layout.wide{grid-template-columns:252px minmax(0,1fr)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ---------- 左：深色侧栏 ---------- */
.docs-sidebar{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:1rem;background:#101012;border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-xl);padding:1rem;max-height:calc(100vh - 96px);overflow-y:auto}
.docs-sidebar::-webkit-scrollbar{width:5px}.docs-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.side-title{display:flex;align-items:center;gap:.5rem;padding:.15rem .35rem .6rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:.25rem}
.side-title .st-ic{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3b3b40,#242428);display:flex;align-items:center;justify-content:center;color:#e4e4e7;flex-shrink:0}
.side-title .st-tx{font-family:var(--font-display);font-size:.92rem;font-weight:700;color:#f4f4f5;letter-spacing:.02em}
.side-title .st-sub{font-size:.7rem;color:#8b8b93;font-weight:400;display:block;margin-top:1px}
.side-sec{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.55rem}
.side-sec:empty{display:none}
.side-label{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8b8b93;padding:.1rem .3rem .45rem}
/* 主导航项（tab-btn 兼容类） */
.side-nav{display:flex;flex-direction:column;gap:.2rem}
.tab-btn.side-item{display:flex;align-items:center;gap:.55rem;width:100%;padding:.52rem .6rem;border:none;background:none;border-radius:8px;font-family:var(--font-body);font-size:.83rem;font-weight:500;color:#a1a1aa;cursor:pointer;text-align:left;transition:all var(--transition-fast)}
.tab-btn.side-item svg{flex-shrink:0;opacity:.75}
.tab-btn.side-item:hover{background:rgba(255,255,255,.07);color:#e4e4e7}
.tab-btn.side-item.active{background:linear-gradient(135deg,#e4e4e7,#c9c9cf);color:#161618;font-weight:600}
.tab-btn.side-item.active svg{opacity:1;color:#161618}
/* 章节锚点列表 */
.anchor-list{display:flex;flex-direction:column;gap:1px;max-height:300px;overflow-y:auto}
.anchor-list::-webkit-scrollbar{width:4px}.anchor-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.anchor-item{display:block;width:100%;text-align:left;border:none;background:none;font-family:var(--font-body);font-size:.76rem;line-height:1.4;color:#8b8b93;padding:.34rem .5rem;border-radius:7px;cursor:pointer;transition:all var(--transition-fast)}
.anchor-item:hover{background:rgba(255,255,255,.06);color:#d4d4d8}
.anchor-item.active{background:rgba(255,255,255,.09);color:#fafafa;font-weight:600}
/* 分类表快捷按钮（深色适配） */
.cfb-side{display:block;width:100%;text-align:left;border:none;background:none;font-family:var(--font-body);font-size:.76rem;color:#a1a1aa;padding:.4rem .5rem;border-radius:7px;cursor:pointer;transition:all var(--transition-fast)}
.cfb-side:hover{background:rgba(255,255,255,.06);color:#e4e4e7}
.cfb-side.active{background:linear-gradient(135deg,#e4e4e7,#c9c9cf);color:#161618;font-weight:600}
/* 底部按钮组（shadcn 风格） */
.side-footer{display:flex;flex-direction:column;gap:.45rem;margin-top:.15rem}
.side-btn{display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.5rem .6rem;border-radius:8px;font-family:var(--font-body);font-size:.78rem;font-weight:500;text-decoration:none;cursor:pointer;transition:all var(--transition-fast)}
.side-btn.sb-primary{background:#fafafa;color:#18181b;border:1px solid #fafafa}
.side-btn.sb-primary:hover{background:#e4e4e7}
.side-btn.sb-ghost{background:rgba(255,255,255,.05);color:#c9c9cf;border:1px solid rgba(255,255,255,.1)}
.side-btn.sb-ghost:hover{background:rgba(255,255,255,.1);color:#fafafa}
.side-card{display:flex;flex-direction:column;gap:.35rem}
.side-card .cr{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.74rem;padding:.3rem .2rem;border-bottom:1px dashed rgba(255,255,255,.09)}
.side-card .cr:last-child{border-bottom:none}
.side-card .cr span{color:#8b8b93}
.side-card .cr b{color:#e4e4e7;font-weight:600;font-family:ui-monospace,'SF Mono','Cascadia Mono',monospace;font-size:.7rem;word-break:break-all;text-align:right}

/* ---------- 中：文档内容 ---------- */
.docs-main{min-width:0;display:flex;flex-direction:column}
.docs-content{min-width:0}
.tab-content{display:none}
.tab-content.active{display:block;animation:pageIn .35s var(--ease-spring)}
/* 文档卡片 */
.doc-pane,.cat-pane,.pdf-pane{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm)}
/* 细则工具栏 */
.doc-toolbar{display:flex;gap:.5rem;align-items:center;padding:.85rem 1.1rem;border-bottom:1px solid var(--color-divider);flex-wrap:wrap;position:sticky;top:60px;z-index:20;background:var(--color-surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.doc-toolbar .ver-btn{padding:.38rem 1rem;border:1px solid var(--color-border);border-radius:999px;background:var(--color-surface);color:var(--color-text);font-family:var(--font-body);font-size:.8rem;cursor:pointer;transition:all var(--transition-fast)}
.doc-toolbar .ver-btn:hover{border-color:var(--color-primary)}
.doc-toolbar .ver-btn.active{background:var(--color-primary);color:var(--color-bg);border-color:var(--color-primary)}
.doc-search{display:flex;gap:.35rem;align-items:center;margin-left:auto}
.doc-search input{padding:.4rem .75rem;border:1px solid var(--color-border);border-radius:8px;font-family:var(--font-body);font-size:.8rem;width:190px;background:var(--color-bg-alt);color:var(--color-text)}
.doc-search input:focus{outline:none;border-color:var(--color-primary);background:var(--color-surface)}
.doc-search button,.doc-nav-btn{padding:.4rem .8rem;border:1px solid var(--color-primary);border-radius:8px;background:var(--color-primary);color:var(--color-bg);font-family:var(--font-body);font-size:.78rem;cursor:pointer}
.doc-nav-btn{padding:.3rem .5rem;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);font-size:.75rem}
.doc-nav-btn:disabled{opacity:.35;cursor:default}
/* 细则正文 */
.doc-body{background:var(--color-surface);padding:1.4rem 2rem 2.5rem;max-height:calc(100vh - 236px);overflow-y:auto;line-height:2;font-size:.9rem;scroll-behavior:smooth}
.doc-body p{margin-bottom:.6rem}
.doc-body .stitle{font-size:1.02rem;font-weight:700;color:var(--color-primary);margin:1.5rem 0 .4rem;padding-bottom:.35rem;border-bottom:1px solid var(--color-divider);scroll-margin-top:24px}
.doc-body .stitle:first-child{margin-top:0}
.doc-body .stitle.center{text-align:center;border-bottom:none;margin:1.2rem 0 .6rem}
.doc-body .stitle.center:first-child{font-size:1.22rem;margin-top:0}
.doc-body .stitle.center:nth-child(2){font-size:1rem;color:var(--color-text-secondary);font-weight:600}
.doc-body .doc-ex{background:var(--color-bg-alt);border-left:3px solid var(--color-accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.6rem 1rem;margin:.5rem 0 .9rem;font-size:.87rem;line-height:1.9}
.doc-body .doc-ex p{margin-bottom:.3rem}
.doc-body .doc-ex p:last-child{margin-bottom:0}
.doc-body .doc-code{background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:.8rem 1rem;margin:.5rem 0 .9rem;font-family:ui-monospace,'SF Mono','Cascadia Mono','Noto Serif SC',serif;font-size:.83rem;line-height:1.85;white-space:pre-wrap;overflow-x:auto}
.doc-body .doc-item{margin-bottom:.35rem}
.doc-body .doc-item:last-child{margin-bottom:.6rem}
mark.doc-hl{background:var(--color-highlight);color:var(--color-highlight-text);padding:0 2px;border-radius:2px;font-weight:600}

/* 分类表 */
.cat-toolbar{display:flex;gap:.35rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--color-divider);flex-wrap:wrap;align-items:center;position:sticky;top:60px;z-index:20;background:var(--color-surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.cat-toolbar .cfb{padding:.35rem .8rem;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface);font-size:.78rem;font-family:var(--font-body);cursor:pointer;transition:all var(--transition-fast)}
.cat-toolbar .cfb:hover{border-color:var(--color-primary)}
.cat-toolbar .cfb.active{background:var(--color-primary);color:var(--color-bg);border-color:var(--color-primary)}
.cat-toolbar select.cfb{max-width:160px}
.cs{padding:.35rem .6rem;border:1px solid var(--color-border);border-radius:8px;font-family:var(--font-body);font-size:.78rem;width:170px;margin-left:auto;background:var(--color-bg-alt);color:var(--color-text)}
.cs:focus{outline:none;border-color:var(--color-primary);background:var(--color-surface)}
.cat-scroll{max-height:calc(100vh - 236px);overflow-y:auto;padding:0 .5rem .5rem}
.ctbl{width:100%;border-collapse:collapse;background:var(--color-surface);font-size:.84rem}
.ctbl th{background:var(--color-surface);color:var(--color-text-secondary);padding:.5rem .7rem;text-align:left;font-weight:600;font-size:.75rem;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--color-border)}
.ctbl td{padding:.4rem .7rem;border-bottom:1px solid var(--color-divider);vertical-align:top;line-height:1.55}
.ctbl tr:hover td{background:var(--color-surface-hover)}
.ctbl .r-l1 td{background:var(--color-bg-alt);font-weight:700;color:var(--color-primary);font-size:.88rem;padding-top:.6rem}
.ctbl .r-l2 td{font-weight:600}
.ctbl .r-l3 td .l3-name{padding-left:1.2rem;font-size:.82rem}
.ctbl .r-l3 td{font-size:.81rem;color:var(--color-text-secondary)}
.ctbl td .desc{font-size:.78rem;color:var(--color-text-secondary)}

/* PDF 工作手册 */
.pdf-toolbar{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.1rem;flex-wrap:wrap;border-bottom:1px solid var(--color-divider)}
.pdf-name{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--color-primary)}
.pdf-sub{font-size:.8rem;color:var(--color-text-muted)}
.pdf-open{margin-left:auto;padding:.38rem .9rem;border:1px solid var(--color-primary);border-radius:8px;background:var(--color-primary);color:var(--color-bg);font-size:.8rem;text-decoration:none;transition:all var(--transition-fast)}
.pdf-open:hover{background:var(--color-primary-light)}
.pdf-frame{width:100%;height:calc(100vh - 220px);min-height:520px;border:none;display:block;border-radius:0 0 var(--radius-xl) var(--radius-xl);background:var(--color-surface)}

/* ---------- 右：「在本页」目录 ---------- */
.docs-toc{position:sticky;top:78px;align-self:start;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:.8rem .6rem;box-shadow:var(--shadow-sm);max-height:calc(100vh - 96px);overflow-y:auto;min-width:0}
.docs-toc:empty,.docs-toc.hide{display:none}
.toc-title{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);padding:.1rem .45rem .5rem}
.toc-nav{display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--color-border-light);margin-left:.45rem;padding-left:0}
.toc-item{display:block;padding:.26rem .5rem;font-size:.76rem;line-height:1.45;color:var(--color-text-muted);text-decoration:none;border-radius:6px;transition:all var(--transition-fast);border-left:2px solid transparent;margin-left:-1px}
.toc-item:hover{color:var(--color-text);background:var(--color-surface-hover)}
.toc-item.active{color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary);background:var(--color-bg-alt)}

/* ---------- 响应式 ---------- */
@media(max-width:1150px){.docs-layout{grid-template-columns:236px minmax(0,1fr)}.docs-toc{display:none}}
@media(max-width:820px){
  .docs-layout{grid-template-columns:1fr;padding:1rem .9rem 2rem;gap:.75rem}
  .docs-sidebar{position:static;max-height:none;flex-direction:column}
  .side-sec .anchor-list{max-height:180px}
  .doc-toolbar,.cat-toolbar{position:static}
  .doc-body{padding:1rem 1.1rem 1.6rem;font-size:.84rem;max-height:none;overflow:visible}
  .cat-scroll{max-height:none;overflow:visible}
  .pdf-frame{min-height:420px}
  .doc-search{width:100%}.doc-search input{flex:1;width:auto}
  .header-inner{padding:0 1rem}.header-brand h1{font-size:.85rem}.header-nav a{font-size:.75rem;padding:.3rem .5rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>

<header class="app-header">
  <div class="header-inner">
    <a href="index.html" class="header-brand"><div class="bi">漢</div><h1>日本漢籍編目工具</h1></a>
    <nav class="header-nav">
      <div class="nav-dropdown"><button class="nav-dropdown-btn" type="button" aria-haspopup="true">說明文檔<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left:2px;vertical-align:-1px;"><path d="M6 9l6 6 6-6"/></svg></button><div class="nav-dropdown-menu" role="menu"><a href="guide.html" role="menuitem">使用介紹</a><a href="changelog.html" role="menuitem">更新日誌</a></div></div><a href="index.html">紀年查詢</a><a href="catalog.html" class="active">編目規範</a><a href="embed.html">快速跳轉</a>

  </div>
</header>

<div class="docs-layout">
  <!-- 左：深色侧栏导航 -->

<script src="catalog_data.js"></script>
<script>
(function(){
let tab=0,curDoc='2023',sri=-1,sr=[],cS='';

/* ---------- 主题 ---------- */
function initTheme(){const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);syncThemeIcons(t)}
function syncThemeIcons(t){['themeToggle','themeToggleSide'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=t==='dark'?'☾':'☀'})}
function setTheme(){const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);syncThemeIcons(n)}
initTheme();document.getElementById('themeToggle').addEventListener('click',setTheme);
document.getElementById('themeToggleSide').addEventListener('click',setTheme);

document.querySelector('.side-nav').addEventListener('click',function(e){const b=e.target.closest('.tab-btn');if(!b)return;tab=parseInt(b.dataset.tab);document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
render();

function sc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){if(tab===0){document.querySelector('.docs-layout').classList.remove('wide');renderDoc()}else if(tab===1){document.querySelector('.docs-layout').classList.add('wide');renderCat()}else{document.querySelector('.docs-layout').classList.add('wide');renderPdf()}}

/* ---------- 侧栏章节锚点 / 右侧目录（共用） ---------- */
function fillSideAnchors(list,label){
  const box=document.getElementById('sideAnchors');
  if(!list||!list.length){box.innerHTML='';return}
  box.innerHTML='<div class="side-label">章節導航 · '+sc(label)+'</div><div class="anchor-list">'+list.map(a=>'<button class="anchor-item" data-sid="'+a.id+'">'+sc(a.title)+'</button>').join('')+'</div>';
  box.querySelectorAll('.anchor-item').forEach(b=>b.addEventListener('click',function(){
    const el=document.getElementById('sec-'+this.dataset.sid);
    if(el){const db=document.getElementById('db');if(db&&db.scrollHeight>db.clientHeight){const y=el.offsetTop-db.offsetTop-12;db.scrollTo({top:Math.max(0,y),behavior:'smooth'})}else el.scrollIntoView({behavior:'smooth',block:'start'})}
  }));
}
function fillToc(list){
  const box=document.getElementById('tocCol');
  if(!list||!list.length){box.innerHTML='';box.classList.add('hide');return}
  box.classList.remove('hide');
  box.innerHTML='<div class="toc-title">在本頁</div><nav class="toc-nav">'+list.map(a=>'<a class="toc-item" data-sid="'+a.id+'" href="#sec-'+a.id+'">'+sc(a.title)+'</a>').join('')+'</nav>';
  box.querySelectorAll('.toc-item').forEach(a=>a.addEventListener('click',function(e){
    e.preventDefault();
    const el=document.getElementById('sec-'+this.dataset.sid);
    if(el){const db=document.getElementById('db');if(db&&db.scrollHeight>db.clientHeight){const y=el.offsetTop-db.offsetTop-12;db.scrollTo({top:Math.max(0,y),behavior:'smooth'})}else el.scrollIntoView({behavior:'smooth',block:'start'})}
  }));
}
/* scroll-spy：高亮当前章节 */
function bindSpy(){
  const db=document.getElementById('db');if(!db)return;
  const secs=[...db.querySelectorAll('.stitle[id^="sec-"]')].filter(e=>!e.classList.contains('center'));
  if(!secs.length)return;
  db.addEventListener('scroll',function(){
    const top=db.getBoundingClientRect().top+14;
    let cur=null;
    for(const el of secs){if(el.getBoundingClientRect().top<=top)cur=el}
    const id=cur?cur.id.slice(4):secs[0].id.slice(4);
    document.querySelectorAll('.toc-item').forEach(a=>a.classList.toggle('active',a.dataset.sid===id));
    document.querySelectorAll('.anchor-item').forEach(a=>a.classList.toggle('active',a.dataset.sid===id));
  },{passive:true});
}

/* ==================== TAB 0: 细则查阅 ==================== */
function renderDoc(){
  const d=curDoc==='2025'?DOC2025:DOC2023;
  const anchors=d.map((s,i)=>({id:s.id,title:s.title,center:i<2})).filter(s=>!s.center);
  let h='';
  d.forEach((s,i)=>{h+='<div class="stitle'+(i<2?' center':'')+'" id="sec-'+s.id+'">'+sc(s.title)+'</div>'+s.html;});
  document.getElementById('m').innerHTML=`
    <div class="tab-content active doc-pane">
      <div class="doc-toolbar">
        <button class="ver-btn${curDoc==='2023'?' active':''}" data-d="2023">2023 舊版細則</button>
        <button class="ver-btn${curDoc==='2025'?' active':''}" data-d="2025">2025 新版細則</button>
        <div class="doc-search">
          <input type="text" id="dsi" placeholder="檢索全文……" value="${sc(cS)}" autocomplete="off">
          <button id="dsb">檢索</button>
          <button class="doc-nav-btn" id="dsp" disabled>‹</button>
          <span style="font-size:.8rem;color:var(--color-text-muted);min-width:40px;text-align:center" id="dsc"></span>
          <button class="doc-nav-btn" id="dsn" disabled>›</button>
        </div>
      </div>
      <div class="doc-body" id="db">${h}</div>
    </div>`;
  fillSideAnchors(anchors,curDoc==='2025'?'2025 新版':'2023 舊版');
  fillToc(anchors);
  document.querySelectorAll('.ver-btn').forEach(b=>b.addEventListener('click',function(){curDoc=this.dataset.d;sri=-1;sr=[];cS='';renderDoc()}));
  document.getElementById('dsb').addEventListener('click',srch);
  document.getElementById('dsi').addEventListener('keydown',function(e){if(e.key==='Enter')srch()});
  document.getElementById('dsp').addEventListener('click',()=>{if(sri>0){sri--;scrS()}});
  document.getElementById('dsn').addEventListener('click',()=>{if(sri<sr.length-1){sri++;scrS()}});
  bindSpy();
  function srch(){
    const db=document.getElementById('db'),q=document.getElementById('dsi').value.trim();cS=q;
    db.querySelectorAll('mark.doc-hl').forEach(m=>m.outerHTML=m.textContent);sr=[];
    if(!q){updateN();return}
    const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    db.querySelectorAll('*').forEach(el=>{if(el.childNodes.length===1&&el.childNodes[0].nodeType===3&&re.test(el.textContent))sr.push(el)});
    if(sr.length===0){updateN();return}
    sri=0;sr.forEach(el=>el.innerHTML=el.textContent.replace(re,'<mark class="doc-hl">$1</mark>'));scrS();updateN()
  }
  function scrS(){if(sri<0||sri>=sr.length)return;sr[sri].scrollIntoView({behavior:'smooth',block:'center'});updateN()}
  function updateN(){document.getElementById('dsc').textContent=sr.length?(sri+1)+'/'+sr.length:'0/0';document.getElementById('dsp').disabled=sri<=0;document.getElementById('dsn').disabled=sri>=sr.length-1}
}

function descFor(name){
  if(L3D[name])return L3D[name];
  // Generate descriptions for 之屬 patterns
  if(name.endsWith('之屬')||name.endsWith('之部')){
    const base=name.replace(/[之屬之部]/g,'');
    if(base.includes('文字音義'))return '經書文字的音讀、訓詁、校勘著作。';
    if(base.includes('傳說')||base.includes('傳説'))return '歷代注解、闡釋經義的著作。';
    if(base.includes('正文'))return '經文白文及校勘本，不含注釋。';
    if(base.includes('圖說')||base.includes('圖説')||base.includes('圖譜'))return '以圖譜、圖表輔助解說的著作。';
    if(base.includes('分篇'))return '對經書中某一篇單獨注解的著作。';
    if(base.includes('專著'))return '就某一專題深入研究的專門著作。';
    if(base.includes('凡例'))return '研究注釋體例的著作。';
    if(base.includes('沿革'))return '研究歷史演變沿革的著作。';
    if(base.includes('叢編'))return '該類目之下的叢書、彙編著作。';
    if(base.includes('附錄')||base.includes('附录'))return '補充性附錄資料彙編。';
    return base+'相關的專門著作。';
  }
  return CAT_DESC[name]||'';
}

function exFor(name){return L3E[name]||''}

let catL1='all',catL2='all',$q='';

function renderCat(){
  let rows='';
  for(const[l1,l2map]of Object.entries(CATALOG_TREE)){
    if(catL1!=='all'&&l1!==catL1)continue;
    const l1m=!$q||l1.includes($q)||(CAT_DESC[l1]||'').includes($q);
    let l1shown=l1m;
    let l1rows='';
    for(const[l2,l3list]of Object.entries(l2map)){
      if(catL2!=='all'&&l2!==catL2)continue;
      const l2m=!$q||l2.includes($q)||(CAT_DESC[l2]||'').includes($q);
      const l2d=CAT_DESC[l2]||'';
      let l3m=false;
      if(Array.isArray(l3list))for(const l3 of l3list)if(!$q||l3.includes($q)||(descFor(l3)||'').includes($q)){l3m=true;break}
      if($q&&!l1m&&!l2m&&!l3m)continue;
      l1shown=true;
      const l3html=[];
      if(Array.isArray(l3list))for(const l3 of l3list){
        if($q&&!l3.includes($q)&&!(descFor(l3)||'').includes($q)&&!l2m&&!l1m)continue;
        l3html.push(`<tr class="r-l3"><td></td><td></td><td><div class="l3-name">${hl(l3)}</div></td><td><div class="desc">${sc(descFor(l3))}</div></td><td style="font-style:italic;font-size:.78rem;color:var(--color-accent)">${sc(exFor(l3))}</td></tr>`);
      }
      l1rows+=`<tr class="r-l2"><td style="font-weight:600">${hl(l2)}</td><td>${sc(l2d)}</td><td></td><td></td><td></td></tr>${l3html.join('')}`;
    }
    if(l1shown||!$q){
      rows+=`<tr class="r-l1"><td colspan="5">${hl(l1)}<span style="font-weight:400;font-size:.78rem;color:var(--color-text-secondary);margin-left:.5rem">${sc(CAT_DESC[l1]||'')}</span></td></tr>${l1rows}`;
    }
  }
  
  document.getElementById('m').innerHTML=`
    <div class="tab-content active cat-pane">
      <div class="cat-toolbar">
        <button class="cfb${catL1==='all'?' active':''}" data-f="all" data-type="l1">全部</button>
        <button class="cfb${catL1==='經部'?' active':''}" data-f="經部" data-type="l1">經部</button>
        <button class="cfb${catL1==='史部'?' active':''}" data-f="史部" data-type="l1">史部</button>
        <button class="cfb${catL1==='子部'?' active':''}" data-f="子部" data-type="l1">子部</button>
        <button class="cfb${catL1==='集部'?' active':''}" data-f="集部" data-type="l1">集部</button>
        <button class="cfb${catL1==='類叢部'?' active':''}" data-f="類叢部" data-type="l1">類叢部</button>
        <button class="cfb${catL1==='附新學類'?' active':''}" data-f="附新學類" data-type="l1">新學類</button>
        <span style="color:var(--color-text-muted);font-size:.8rem;margin:0 .5rem">|</span>
        <span style="font-size:.78rem;color:var(--color-text-secondary)">二級：</span>
        <select class="cfb" id="l2sel"><option value="all"${catL2==='all'?' selected':''}>全部二級</option></select>
        <input type="text" class="cs" id="csi" placeholder="檢索類目名稱……" value="${sc($q)}" autocomplete="off">
      </div>
      <div class="cat-scroll">
      <table class="ctbl">
        <thead><tr><th style="width:10%">二級類目</th><th style="width:28%">二級收錄說明</th><th style="width:12%">三級類目</th><th style="width:38%">三級收錄說明</th><th style="width:12%">典型文獻</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>`;

  /* 侧栏：分类快捷导航 */
  const sideBox=document.getElementById('sideAnchors');
  const defs=[['all','全部類目'],['經部','經部'],['史部','史部'],['子部','子部'],['集部','集部'],['類叢部','類叢部'],['附新學類','新學類']];
  sideBox.innerHTML='<div class="side-label">分類導航</div><div class="anchor-list">'+defs.map(d=>'<button class="cfb cfb-side'+(catL1===d[0]?' active':'')+'" data-type="l1" data-f="'+d[0]+'">'+d[1]+'</button>').join('')+'</div>';
  /* 右侧目录隐藏 */
  fillToc(null);
  
  // Populate L2 dropdown based on current L1 filter
  const l2sel=document.getElementById('l2sel');
  const l2set=new Set();
  for(const[l1,l2map]of Object.entries(CATALOG_TREE)){
    if(catL1!=='all'&&l1!==catL1)continue;
    for(const l2 of Object.keys(l2map))l2set.add(l2);
  }
  [...l2set].sort((a,b)=>a.localeCompare(b,'zh')).forEach(l2=>{
    const opt=document.createElement('option');opt.value=l2;opt.textContent=l2;
    if(l2===catL2)opt.selected=true;l2sel.appendChild(opt);
  });
  
  document.querySelectorAll('.cfb[data-type="l1"]').forEach(b=>b.addEventListener('click',function(){
    catL1=this.dataset.f;catL2='all';$q='';renderCat();
  }));
  l2sel.addEventListener('change',function(){catL2=this.value;renderCat()});
  document.getElementById('csi').addEventListener('input',function(){$q=this.value.trim();renderCat()});
}
