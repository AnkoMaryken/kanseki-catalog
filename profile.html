<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · Juvenile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23171717'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fafafa' font-family='serif'>J</text></svg>">
<style>
:root {
  --color-bg: #fafafa;
  --color-surface: #ffffff;
  --color-surface-hover: #f5f5f5;
  --color-accent: #171717;
  --color-text: #0a0a0a;
  --color-text-secondary: #525252;
  --color-text-muted: #737373;
  --color-border: #e5e5e5;
  --color-input-bg: #fafafa;
  --color-input-border: #d4d4d4;
  --color-input-focus: #171717;
  --color-placeholder: #a3a3a3;
  --color-shadow: rgba(0, 0, 0, 0.05);
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 16px;
}
[data-theme="dark"] {
  --color-bg: #0a0a0a;
  --color-surface: #171717;
  --color-surface-hover: #262626;
  --color-accent: #fafafa;
  --color-text: #fafafa;
  --color-text-secondary: #d4d4d4;
  --color-text-muted: #a3a3a3;
  --color-border: rgba(255,255,255,0.1);
  --color-input-bg: #1f1f1f;
  --color-input-border: rgba(255,255,255,0.14);
  --color-input-focus: #fafafa;
  --color-placeholder: #6b6b6b;
  --color-shadow: rgba(0, 0, 0, 0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 2.5rem 1rem 3rem;
  -webkit-font-smoothing: antialiased;
}
/* 顶部 logo + 品牌名 */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.75rem;
  text-decoration: none;
}
.brand .brand-mark {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--color-accent);
  color: var(--color-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 0.85rem;
  font-weight: 600;
  flex-shrink: 0;
}
.brand span {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--color-text);
}
/* 卡片 */
.card {
  width: 100%;
  max-width: 420px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: 1.75rem 1.5rem;
  box-shadow: 0 1px 2px var(--color-shadow);
}
.card-title {
  text-align: center;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 0.35rem;
}
.card-sub {
  text-align: center;
  font-size: 0.82rem;
  color: var(--color-text-muted);
  margin-bottom: 1.5rem;
  font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
  letter-spacing: 0.02em;
}
/* 头像区 */
.avatar-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 1.25rem;
}
#avatarPreview {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
  margin-bottom: 0.85rem;
  box-shadow: 0 2px 8px var(--color-shadow);
  user-select: none;
  -webkit-user-select: none;
}
#avatarPreview img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.avatar-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
/* 按钮 */
.btn {
  padding: 0.45rem 0.9rem;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--color-text);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.btn:hover { background: var(--color-surface-hover); }
.btn-primary {
  color: var(--color-bg);
  background: var(--color-accent);
  border-color: var(--color-accent);
}
.btn-primary:hover { opacity: 0.88; background: var(--color-accent); }
.btn-danger {
  color: #dc2626;
  background: transparent;
  border-color: rgba(220,38,38,0.35);
}
.btn-danger:hover { background: rgba(220,38,38,0.08); }
.btn-sm { padding: 0.3rem 0.7rem; font-size: 0.75rem; }
/* 颜色预设 */
.color-presets {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 0.6rem 0 1.1rem;
}
.color-dot {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.12s, border-color 0.12s;
}
.color-dot:hover { transform: scale(1.12); }
.color-dot.selected { border-color: var(--color-text); transform: scale(1.08); }
/* 表单 */
.field { margin-bottom: 1rem; }
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 0.4rem;
}
.field input {
  width: 100%;
  padding: 0.7rem 0.85rem;
  font-size: 0.88rem;
  color: var(--color-text);
  background: var(--color-input-bg);
  border: 1px solid var(--color-input-border);
  border-radius: var(--radius-lg);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  border-color: var(--color-input-focus);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-input-focus) 12%, transparent);
}
.field input:disabled { opacity: 0.55; cursor: not-allowed; }
.field-hint { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 0.3rem; }
/* 分割线 */
.divider {
  border: none;
  border-top: 1px solid var(--color-border);
  margin: 1.25rem 0;
}
/* 按钮行 */
.btn-row { display: flex; gap: 0.6rem; margin-top: 0.25rem; }
.btn-row .btn { flex: 1; justify-content: center; }
/* 错误/提示 */
.form-error {
  display: none;
  font-size: 0.78rem;
  color: #dc2626;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: var(--radius-md);
  padding: 0.6rem 0.85rem;
  margin-bottom: 1rem;
}
[data-theme="dark"] .form-error { color: #fca5a5; background: rgba(220,38,38,0.12); border-color: rgba(220,38,38,0.3); }
.form-error.show { display: block; }
.form-success {
  display: none;
  font-size: 0.78rem;
  color: #16a34a;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: var(--radius-md);
  padding: 0.6rem 0.85rem;
  margin-bottom: 1rem;
}
[data-theme="dark"] .form-success { color: #86efac; background: rgba(22,163,74,0.12); border-color: rgba(22,163,74,0.3); }
.form-success.show { display: block; }
/* 底部操作 */
.logout-wrap { margin-top: 1.5rem; }
/* 顶部右上角 */
.top-actions {
  position: fixed;
  top: 1rem;
  right: 1rem;
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
.guest-btn, .theme-toggle {
  padding: 0.4rem 0.75rem;
  font-size: 0.75rem;
  color: var(--color-text-muted);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.guest-btn:hover, .theme-toggle:hover { color: var(--color-text); background: var(--color-surface-hover); }
.guest-btn { color: var(--color-text); font-weight: 600; }
/* 隐藏的文件输入 */
.hidden-input { display: none; }
</style>
</head>
<body>
<div class="top-actions">
  <a class="guest-btn" href="index.html">返回首页</a>
  <button class="theme-toggle" id="themeToggle">深色</button>
</div>

<a class="brand" href="index.html">
  <div class="brand-mark">J</div>
  <span>Juvenile</span>
</a>

<div class="card">
  <div class="card-title">个人中心</div>
  <div class="card-sub" id="profileMotto">笃学慎思，明辨尚行</div>

  <div class="form-error" id="formError"></div>
  <div class="form-success" id="formSuccess"></div>

  <!-- 头像 -->
  <div class="avatar-section">
    <div id="avatarPreview"></div>
    <div class="avatar-actions">
      <button class="btn btn-sm" id="uploadAvatarBtn" type="button">上传图片</button>
      <button class="btn btn-sm" id="pickColorBtn" type="button">颜色+文字</button>
      <button class="btn btn-sm" id="resetAvatarBtn" type="button">恢复默认</button>
    </div>
    <input type="file" id="avatarFileInput" class="hidden-input" accept="image/*">
    <!-- 颜色+文字预设区 (默认隐藏) -->
    <div id="colorPickerWrap" style="display:none;width:100%;text-align:center;margin-top:0.4rem;">
      <div class="color-presets" id="colorPresets">
        <button type="button" class="color-dot" data-bg="#6366f1" title="靛蓝" aria-label="靛蓝"></button>
        <button type="button" class="color-dot" data-bg="#8b5cf6" title="紫罗兰" aria-label="紫罗兰"></button>
        <button type="button" class="color-dot" data-bg="#ec4899" title="粉红" aria-label="粉红"></button>
        <button type="button" class="color-dot" data-bg="#f59e0b" title="琥珀" aria-label="琥珀"></button>
        <button type="button" class="color-dot" data-bg="#10b981" title="翡翠" aria-label="翡翠"></button>
        <button type="button" class="color-dot" data-bg="#0ea5e9" title="天蓝" aria-label="天蓝"></button>
        <button type="button" class="color-dot" data-bg="#f43f5e" title="玫红" aria-label="玫红"></button>
        <button type="button" class="color-dot" data-bg="#171717" title="墨黑" aria-label="墨黑"></button>
      </div>
      <div class="field" style="max-width:220px;margin:0 auto;">
        <input type="text" id="avatarCharInput" maxlength="2" placeholder="输入文字（如：逐）" style="text-align:center;">
      </div>
      <button class="btn btn-sm btn-primary" id="applyColorBtn" type="button">应用</button>
    </div>
  </div>

  <hr class="divider">

  <!-- 昵称 -->
  <div class="field">
    <label for="nickname">昵称</label>
    <input type="text" id="nickname" placeholder="设置你的昵称" maxlength="20">
    <div class="field-hint">昵称将显示在站点右上角。</div>
  </div>

  <!-- 邮箱 -->
  <div class="field">
    <label for="email">邮箱</label>
    <input type="email" id="email" disabled>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="saveBtn" type="button">保存资料</button>
    <button class="btn" id="toIndexBtn" type="button">返回首页</button>
  </div>

  <div class="logout-wrap">
    <button class="btn btn-danger" id="logoutBtn" type="button" style="width:100%;justify-content:center;">退出登录</button>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="user-state.js"></script>
<script>
// 深浅主题 (与全站 localStorage 键一致)
(function() {
  const KEY = 'theme';
  const btn = document.getElementById('themeToggle');
  function apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '浅色' : '深色';
  }
  apply(localStorage.getItem(KEY) || 'light');
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem(KEY, cur);
    apply(cur);
  });
})();

// 登录门禁: 未登录跳转登录页
(function() {
  if (!window.UserState || !UserState.isLoggedIn()) {
    location.href = 'login.html';
    return;
  }
})();

// ===== 头像与资料 =====
(function() {
  if (!window.UserState) return;
  const us = UserState;
  const preview = document.getElementById('avatarPreview');
  const avatarCharInput = document.getElementById('avatarCharInput');
  const colorPickerWrap = document.getElementById('colorPickerWrap');
  const formError = document.getElementById('formError');
  const formSuccess = document.getElementById('formSuccess');
  let selectedColor = '#6366f1';

  function showError(msg) { formError.textContent = msg; formError.classList.add('show'); formSuccess.classList.remove('show'); }
  function showSuccess(msg) { formSuccess.textContent = msg; formSuccess.classList.add('show'); formError.classList.remove('show'); }
  function clearMsg() { formError.classList.remove('show'); formSuccess.classList.remove('show'); }

  function renderPreview() {
    const av = us.getAvatarData();
    const name = us.getDisplayName() || '?';
    const ch = (av && av.type === 'color' && av.char) ? av.char : (name.trim()[0] || '?');
    if (av && av.type === 'img' && av.data) {
      preview.innerHTML = '<img src="' + av.data + '" alt="avatar">';
    } else if (av && av.type === 'color' && av.bg) {
      preview.style.background = av.bg;
      preview.style.color = av.fg || '#fff';
      preview.style.fontSize = '2.2rem';
      preview.textContent = ch;
    } else {
      // 默认: 邮箱哈希取色
      const colors = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#0ea5e9','#f43f5e'];
      let idx = 0; const em = us.getEmail() || name;
      for (let i = 0; i < em.length; i++) idx = (idx + em.charCodeAt(i)) % colors.length;
      preview.style.background = colors[idx];
      preview.style.color = '#fff';
      preview.style.fontSize = '2.2rem';
      preview.textContent = ch;
    }
  }

  // 文件上传 → base64
  document.getElementById('uploadAvatarBtn').addEventListener('click', () => {
    document.getElementById('avatarFileInput').click();
  });
  document.getElementById('avatarFileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { showError('请选择图片文件'); return; }
    if (file.size > 2 * 1024 * 1024) { showError('图片不能超过 2MB'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      us.setAvatarData({ type: 'img', data: ev.target.result });
      renderPreview();
      showSuccess('头像已更新');
    };
    reader.onerror = () => showError('读取图片失败');
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // 颜色+文字
  document.getElementById('pickColorBtn').addEventListener('click', () => {
    colorPickerWrap.style.display = colorPickerWrap.style.display === 'none' ? 'block' : 'none';
  });
  const dots = document.querySelectorAll('.color-dot');
  dots.forEach(d => {
    d.addEventListener('click', () => {
      dots.forEach(x => x.classList.remove('selected'));
      d.classList.add('selected');
      selectedColor = d.dataset.bg;
    });
  });
  document.getElementById('applyColorBtn').addEventListener('click', () => {
    const ch = (avatarCharInput.value || '').trim();
    if (!ch) { showError('请输入文字（如：逐）'); return; }
    us.setAvatarData({ type: 'color', bg: selectedColor, char: ch[0], fg: '#ffffff' });
    renderPreview();
    colorPickerWrap.style.display = 'none';
    showSuccess('头像已更新');
  });
  document.getElementById('resetAvatarBtn').addEventListener('click', () => {
    us.setAvatarData(null);
    renderPreview();
    showSuccess('已恢复默认头像');
  });

  // 昵称
  const nicknameInput = document.getElementById('nickname');
  const emailInput = document.getElementById('email');
  nicknameInput.value = us.getDisplayName() === us.getEmail().split('@')[0] ? '' : us.getDisplayName();
  emailInput.value = us.getEmail();

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name = nicknameInput.value.trim();
    if (name) {
      us.setProfile({ name: name });
    } else {
      // 清空昵称: 存空串让 getDisplayName 回退邮箱前缀
      us.setProfile({ name: '' });
    }
    renderPreview();
    showSuccess('资料已保存');
  });

  document.getElementById('toIndexBtn').addEventListener('click', () => { location.href = 'index.html'; });
  document.getElementById('logoutBtn').addEventListener('click', () => { us.logout(); });

  renderPreview();
})();
</script>
</body>
</html>
