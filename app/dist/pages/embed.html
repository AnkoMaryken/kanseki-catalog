<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%232b3a67'/%3E%3Ctext%20x='16'%20y='22'%20font-size='17'%20text-anchor='middle'%20fill='%23fff'%20font-family='serif'%3E%E6%BC%A2%3C/text%3E%3C/svg%3E">
<title>快速跳转 — 日本汉籍编目工具</title>
<style>
:root{--color-bg:#fafafa;--color-bg-alt:#f5f5f5;--color-surface:#fff;--color-surface-hover:#f5f5f5;--color-primary:#171717;--color-primary-light:#404040;--color-accent:#171717;--color-accent-light:#404040;--color-text:#0a0a0a;--color-text-secondary:#525252;--color-text-muted:#737373;--color-border:#e5e5e5;--color-border-light:#eee;--color-divider:#f0f0f0;--color-highlight:#f5f5f5;--color-highlight-text:#0a0a0a;--color-shadow:rgba(0,0,0,.05);--color-shadow-lg:rgba(0,0,0,.09);--font-display:'Noto Serif SC','SimSun','STSong',serif;--font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--transition-fast:150ms cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.16,1,.3,1);--radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:12px;--shadow-sm:0 1px 2px var(--color-shadow);--shadow-md:0 2px 8px -2px var(--color-shadow),0 1px 3px rgba(0,0,0,.04);--shadow-lg:0 8px 30px -6px var(--color-shadow-lg),0 2px 8px rgba(0,0,0,.04)}
[data-theme="dark"]{--color-bg:#0a0a0a;--color-bg-alt:#141414;--color-surface:#171717;--color-surface-hover:#262626;--color-primary:#e5e5e5;--color-primary-light:#fafafa;--color-accent:#fafafa;--color-accent-light:#fff;--color-text:#fafafa;--color-text-secondary:#d4d4d4;--color-text-muted:#a3a3a3;--color-border:rgba(255,255,255,.1);--color-border-light:rgba(255,255,255,.07);--color-divider:rgba(255,255,255,.07);--color-highlight:#262626;--color-highlight-text:#fafafa}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);font-size:.9375rem;line-height:1.65;color:var(--color-text);background:var(--color-bg);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:var(--color-text-muted);border-radius:4px}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

/* Header (四页一致) */
.app-header{background:color-mix(in srgb,var(--color-bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--color-text);padding:.8rem 0;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--color-border-light);animation:hdrIn .5s var(--ease-spring)}
@keyframes hdrIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.header-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0}
.header-brand .bi{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1rem;color:var(--color-bg);font-weight:700}
.header-brand h1{font-family:var(--font-display);font-size:1.1rem;color:var(--color-text);white-space:nowrap}
.header-nav{display:flex;gap:.25rem;flex-shrink:0}
.header-nav a{color:var(--color-text-muted);text-decoration:none;font-size:.85rem;font-weight:500;padding:.35rem .75rem;border-radius:var(--radius-sm);transition:all var(--transition-fast);white-space:nowrap}
.header-nav a:hover{color:var(--color-text);background:var(--color-surface-hover)}
.header-nav a.active{color:var(--color-text);background:var(--color-bg-alt);font-weight:600}
.header-actions{margin-left:auto;display:flex;gap:.5rem}
.btn-icon{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);font-size:1rem}
.btn-icon:hover{background:var(--color-surface-hover);color:var(--color-text)}

/* 导航下拉 (说明文档) */
.nav-dropdown{position:relative;flex-shrink:0}
.nav-dropdown-btn{display:inline-flex;align-items:center;gap:.1rem;color:var(--color-text-muted);font-size:.85rem;font-weight:500;font-family:var(--font-body);padding:.35rem .75rem;border-radius:var(--radius-sm);transition:all var(--transition-fast);white-space:nowrap;border:none;background:none;cursor:pointer}
.nav-dropdown-btn:hover{color:var(--color-text);background:var(--color-surface-hover)}
.nav-dropdown-btn.active{color:var(--color-text);background:var(--color-bg-alt);font-weight:600}
.nav-dropdown-btn svg{transition:transform var(--transition-fast)}
.nav-dropdown:hover .nav-dropdown-btn svg,.nav-dropdown:focus-within .nav-dropdown-btn svg{transform:rotate(180deg)}
.nav-dropdown-menu{position:absolute;top:100%;left:0;margin-top:6px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);min-width:132px;padding:.3rem;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s var(--ease-spring),visibility .18s var(--ease-spring),transform .18s var(--ease-spring);z-index:210}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.nav-dropdown-menu a{display:block;padding:.45rem .75rem;border-radius:var(--radius-sm);color:var(--color-text-secondary);font-size:.85rem;text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
.nav-dropdown-menu a:hover{background:var(--color-surface-hover);color:var(--color-text)}
.nav-dropdown-menu a.active{color:var(--color-text);font-weight:600;background:var(--color-bg-alt)}

/* ===== 快速跳转页 ===== */
.page{max-width:1400px;margin:0 auto;padding:1.5rem 1.5rem 2.5rem;width:100%;flex:1;animation:pageIn .45s var(--ease-spring) .08s backwards}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-head{display:flex;align-items:center;margin-bottom:1.2rem}
.page-head h2{font-family:var(--font-display);font-size:1.3rem;color:var(--color-primary)}

/* ---- 右上角浮动搜索栏 (自定义页面跳转, ButtonGroup 一体化样式) ---- */
.jump-bar{position:fixed;top:76px;right:24px;z-index:95;animation:barIn .5s var(--ease-spring) .2s backwards}
@keyframes barIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.jump-bar .button-group{display:inline-flex;align-items:stretch;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-lg);border:1px solid var(--color-border);background:color-mix(in srgb,var(--color-surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:box-shadow var(--transition-fast)}
.jump-bar .button-group:focus-within{box-shadow:var(--shadow-lg),0 0 0 3px color-mix(in srgb,var(--color-primary) 12%,transparent);border-color:var(--color-primary)}
.jump-input{width:260px;padding:.55rem .9rem;border:none;background:transparent;color:var(--color-text);font-family:var(--font-body);font-size:.86rem;outline:none}
.jump-go{padding:.55rem 1.2rem;border:none;border-left:1px solid var(--color-border);background:var(--color-primary);color:var(--color-bg);font-family:var(--font-body);font-size:.86rem;font-weight:600;cursor:pointer;transition:background var(--transition-fast);white-space:nowrap}
.jump-go:hover{background:var(--color-primary-light)}
.jump-hint{position:fixed;top:122px;right:24px;z-index:95;font-size:.78rem;color:var(--color-text-secondary);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:.4rem .75rem;box-shadow:var(--shadow-md);opacity:0;transform:translateY(-4px);transition:all .2s var(--ease-spring);pointer-events:none}
.jump-hint.show{opacity:1;transform:translateY(0)}
.jump-hint.err{color:#b91c1c;border-color:color-mix(in srgb,#dc2626 35%,transparent)}
[data-theme="dark"] .jump-hint.err{color:#fca5a5}

/* ---- 快捷网站标签网格 (等宽等高) ---- */
.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.85rem;max-width:900px}
.jump-card{position:relative;aspect-ratio:1;border-radius:var(--radius-lg);border:1px solid var(--color-border);background:var(--color-surface);transition:all .2s var(--ease-spring);animation:cardIn .4s var(--ease-spring) backwards;overflow:hidden}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.jump-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--color-primary)}
.jump-card:hover .jc-del{opacity:1}
.jc-link{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;color:var(--color-text);padding:.6rem;z-index:1}
.jc-icon{width:44px;height:44px;border-radius:var(--radius-md);background:var(--color-primary);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1rem;font-weight:700}
.jc-name{font-size:.84rem;font-weight:600;text-align:center;line-height:1.4;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.jc-url{font-size:.68rem;color:var(--color-text-muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-del{position:absolute;top:6px;right:6px;z-index:2;width:22px;height:22px;border-radius:var(--radius-sm);border:none;background:color-mix(in srgb,var(--color-text-muted) 15%,transparent);color:var(--color-text-secondary);font-size:.8rem;line-height:1;cursor:pointer;opacity:0;transition:all var(--transition-fast);display:flex;align-items:center;justify-content:center;padding:0}
.jc-del:hover{background:color-mix(in srgb,#dc2626 18%,transparent);color:#b91c1c}
[data-theme="dark"] .jc-del:hover{color:#fca5a5}

/* 添加标签卡片 */
.jump-card.add-card{border-style:dashed;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.5rem;color:var(--color-text-muted);border-color:var(--color-border);transition:all .2s var(--ease-spring);text-decoration:none}
.jump-card.add-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--color-primary);color:var(--color-text)}
.add-card .ac-plus{width:44px;height:44px;border-radius:var(--radius-md);border:1.5px dashed var(--color-text-muted);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:300;transition:all var(--transition-fast)}
.add-card:hover .ac-plus{border-color:var(--color-primary);color:var(--color-primary)}
.add-card .ac-label{font-size:.84rem;font-weight:500}

/* ---- 添加标签弹窗 ---- */
.add-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:400;display:none;align-items:center;justify-content:center;padding:1rem}
.add-overlay.show{display:flex}
.add-panel{width:380px;max-width:92vw;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:1.2rem 1.3rem;animation:panelIn .25s var(--ease-spring)}
@keyframes panelIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.add-panel h3{font-family:var(--font-display);font-size:1.05rem;color:var(--color-primary);margin-bottom:1rem}
.add-field{margin-bottom:.85rem}
.add-field label{display:block;font-size:.78rem;color:var(--color-text-secondary);margin-bottom:.3rem}
.add-field input{width:100%;padding:.5rem .75rem;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:.86rem;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.add-field input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary) 12%,transparent)}
.add-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.1rem}
.btn{border:none;border-radius:var(--radius-md);padding:.5rem 1.1rem;font-family:var(--font-body);font-size:.84rem;font-weight:500;cursor:pointer;transition:all var(--transition-fast)}
.btn-cancel{background:var(--color-bg-alt);color:var(--color-text-secondary)}
.btn-cancel:hover{background:var(--color-surface-hover);color:var(--color-text)}
.btn-save{background:var(--color-primary);color:var(--color-bg)}
.btn-save:hover{background:var(--color-primary-light)}

/* ---- 跳转成功提示 (toast 简化版) ---- */
.jump-toast{position:fixed;bottom:24px;right:24px;z-index:120;display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-border);box-shadow:var(--shadow-lg);font-size:.84rem;color:var(--color-text);opacity:0;transform:translateY(8px);transition:all .25s var(--ease-spring);pointer-events:none}
.jump-toast.show{opacity:1;transform:translateY(0)}
.jump-toast .jt-dot{width:7px;height:7px;border-radius:50%;background:#16a34a;flex:0 0 7px}

.app-footer{background:var(--color-bg-alt);border-top:1px solid var(--color-border-light);padding:1rem 0;margin-top:auto}
.footer-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;text-align:center;font-size:.78rem;color:var(--color-text-muted)}

@media(max-width:900px){
  .jump-bar{right:12px}
  .jump-grid{max-width:none}
}
@media(max-width:768px){
  .header-inner{padding:0 1rem}.header-brand h1{font-size:.85rem}.header-nav a{font-size:.75rem;padding:.3rem .5rem}
  .page{padding:1rem .9rem 2rem}
  .jump-bar{position:fixed;top:auto;bottom:14px;left:12px;right:12px;z-index:95}
  .jump-bar .button-group{display:flex;width:100%}
  .jump-input{flex:1;width:auto;min-width:0}
  .jump-hint{top:auto;bottom:60px;right:12px}
  .jump-toast{bottom:70px}
  .jump-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<body>

<header class="app-header">
  <div class="header-inner">
    <a href="index.html" class="header-brand"><div class="bi">汉</div><h1>日本汉籍编目工具</h1></a>
    <nav class="header-nav">
      <div class="nav-dropdown"><button class="nav-dropdown-btn" type="button" aria-haspopup="true">说明文档<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left:2px;vertical-align:-1px;"><path d="M6 9l6 6 6-6"/></svg></button><div class="nav-dropdown-menu" role="menu"><a href="guide.html" role="menuitem">使用介绍</a><a href="changelog.html" role="menuitem">更新日志</a></div></div><a href="index.html">纪年查询</a><a href="catalog.html">编目规范</a><a href="embed.html" class="active">快速跳转</a>

</header>

<!-- 右上角浮动搜索栏: 自定义页面跳转 -->
<div class="jump-bar" id="jumpBar">
  <div class="button-group" role="group">
    <input type="text" id="jumpInput" class="jump-input" autocomplete="off" spellcheck="false" aria-label="自定义页面跳转">

<!-- 添加标签弹窗 -->

<script>
(function(){
  // ===== 主题 =====
  function initTheme(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}
  initTheme();
  document.getElementById('themeToggle').addEventListener('click',()=>{
    const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);
  });

  // ===== 预置快捷网站 =====
  const QUICK_LINKS=[
    {name:'典津全球汉籍影像开放集成系统',url:'https://guji.cckb.cn/',icon:'典'},
    {name:'国学大全',url:'https://www.gxdq.com/',icon:'国'},
    {name:'日本所藏中文古籍数据库',url:'https://www.kanji.zinbun.kyoto-u.ac.jp/kanseki?detail=',icon:'漢'},
    {name:'日本国立公文书馆检索页面',url:'https://www.digital.archives.go.jp/',icon:'文'},
    {name:'古籍觅宝',url:'https://guji99.com/',icon:'觅'},
    {name:'PaddleOCR',url:'https://aistudio.baidu.com/paddleocr',icon:'OCR'},
    {name:'GitHub',url:'https://github.com/',icon:'Gh'}
  ];

  // ===== 用户自定义标签 (localStorage 持久化) =====
  const CUSTOM_KEY='quickLinksCustom';
  let customLinks=[];
  try{customLinks=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]')}catch(e){customLinks=[]}
  function saveCustom(){localStorage.setItem(CUSTOM_KEY,JSON.stringify(customLinks))}

  // ===== 跳转核心 =====
  function normalizeUrl(raw){
    let u=(raw||'').trim();
    if(!u)return null;
    // 相对路径 (本站文件, 含子目录如 docs/manual.pdf)
    if(/^\.?\//.test(u)||/^[^/]+(\.html?|\.pdf|\.txt)$/i.test(u)||/^[\w-]+\/[\w.\/-]+\.(html?|pdf|txt)$/i.test(u))return u;
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    return u;
  }
  function hostOf(url){
    try{const h=new URL(url).hostname;return h.replace(/^www\./,'')}catch(e){return url.replace(/^https?:\/\//,'').split(/[/?#]/)[0]}
  }
  function iconOf(name,url){
    const n=(name||'').trim();
    if(n)return n.slice(0,2);
    const h=hostOf(url);
    return h?h.charAt(0).toUpperCase():'网';
  }
  function showHint(msg,isErr){
    const h=document.getElementById('jumpHint');
    h.textContent=msg;h.className='jump-hint show'+(isErr?' err':'');
    clearTimeout(showHint._t);
    showHint._t=setTimeout(()=>{h.className='jump-hint'},2600);
  }
  function showToast(msg){
    const t=document.getElementById('jumpToast');
    document.getElementById('jumpToastText').textContent=msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t=setTimeout(()=>{t.classList.remove('show')},2400);
  }
  function openUrl(url){
    if(!url)return;
    // 用 <a target="_blank"> 编程点击: 与真实点击链接行为一致, 弹窗拦截规则统一
    const a=document.createElement('a');
    a.href=url;a.target='_blank';a.rel='noopener noreferrer';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast('已打开：'+url);
  }

  // ===== 渲染标签网格 (预置 + 自定义 + 添加按钮, 全部等宽等高) =====
  const jumpGrid=document.getElementById('jumpGrid');
  function renderGrid(){
    jumpGrid.innerHTML='';
    const links=QUICK_LINKS.concat(customLinks.map((l,i)=>({...l,_custom:i})));
    links.forEach((link,i)=>{
      const card=document.createElement('div');
      card.className='jump-card'+(link._custom!==undefined?' custom':'');
      card.style.animationDelay=(i*0.04)+'s';
      card.innerHTML='<a class="jc-link" href="'+link.url+'" target="_blank" rel="noopener noreferrer" title="'+link.name+'">'+
        '<span class="jc-icon" aria-hidden="true">'+link.icon+'</span>'+
        '<span class="jc-name">'+link.name+'</span>'+
        '<span class="jc-url">'+hostOf(link.url)+'</span></a>';
      if(link._custom!==undefined){
        const del=document.createElement('button');
        del.className='jc-del';del.type='button';del.setAttribute('aria-label','删除标签');
        del.textContent='×';
        del.addEventListener('click',(e)=>{e.stopPropagation();removeCustom(link._custom)});
        card.appendChild(del);
      }
      jumpGrid.appendChild(card);
    });
    // 添加按钮卡片
    const add=document.createElement('a');
    add.className='jump-card add-card';
    add.href='javascript:void(0)';
    add.style.animationDelay=(links.length*0.04)+'s';
    add.innerHTML='<span class="ac-plus" aria-hidden="true">+</span><span class="ac-label">添加标签</span>';
    add.addEventListener('click',(e)=>{e.preventDefault();openAddModal()});
    jumpGrid.appendChild(add);
  }
  function removeCustom(idx){
    customLinks.splice(idx,1);
    saveCustom();
    renderGrid();
    showToast('已删除标签');
  }

  // ===== 添加标签弹窗 =====
  const addOverlay=document.getElementById('addOverlay');
  const addName=document.getElementById('addName');
  const addUrl=document.getElementById('addUrl');
  function openAddModal(){
    addName.value='';addUrl.value='';
    addOverlay.classList.add('show');
    addUrl.focus();
  }
  function closeAddModal(){addOverlay.classList.remove('show')}
  function saveAdd(){
    const url=normalizeUrl(addUrl.value);
    if(!url){showHint('请输入有效网址',true);return}
    let name=(addName.value||'').trim();
    if(!name)name=hostOf(url);
    customLinks.push({name:name,url:url,icon:iconOf(name,url)});
    saveCustom();
    closeAddModal();
    renderGrid();
    showToast('已添加标签：'+name);
  }
  document.getElementById('addSave').addEventListener('click',saveAdd);
  document.getElementById('addCancel').addEventListener('click',closeAddModal);
  addOverlay.addEventListener('click',e=>{if(e.target===addOverlay)closeAddModal()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&addOverlay.classList.contains('show'))closeAddModal();
  });
  addUrl.addEventListener('keydown',e=>{if(e.key==='Enter')saveAdd()});

  // ===== 搜索栏跳转 =====
  const input=document.getElementById('jumpInput');
  document.getElementById('jumpGo').addEventListener('click',()=>{
    const u=normalizeUrl(input.value);
    if(!u){showHint('请输入有效网址',true);return}
    openUrl(u);
  });
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const u=normalizeUrl(input.value);
      if(!u){showHint('请输入有效网址',true);return}
      openUrl(u);
    }
  });

  renderGrid();
})();
</script>
</body>
</html>
