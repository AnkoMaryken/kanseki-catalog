<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/logo.png">
<title>快速跳转 — 古代史及汉籍研究工具</title>
<script>
/* 主题：桌面外壳会把 data-theme 直接写到本页 documentElement；网页版读 localStorage 'theme' */
(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}
window.addEventListener('storage',function(e){if(e.key==='theme'&&(e.newValue==='dark'||e.newValue==='light'))document.documentElement.setAttribute('data-theme',e.newValue);});})();
</script>
<style>
:root{
  --brand:#171A1F; --brand-fg:#FFFFFF;
  --bg-page:#F2F3F5; --bg-card:#FFFFFF; --bg-fill:#F2F3F5; --bg-hover:#F7F8F9; --bg-badge:#EDEEF0; --bg-badge-hover:#E2E4E8;
  --t1:#171A1F; --t2:#5F6672; --t3:#8F959E; --t4:#C2C6CC; --divider:#F0F1F3;
  --r-card:24px; --r-mid:18px; --r-pill:999px;
  --pad-card:20px; --gap-page:28px; --gap-card:16px;
  --shadow-card:0 6px 20px rgba(0,0,0,.06); --shadow-float:0 8px 28px rgba(0,0,0,.08); --shadow-brand:0 6px 16px rgba(23,26,31,.18);
  --font:-apple-system,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",Roboto,sans-serif;
  --font-serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --ease:cubic-bezier(.2,0,0,1);
}
html[data-theme="dark"]{
  --brand:#F2F3F5; --brand-fg:#171A1F;
  --bg-page:#0E1013; --bg-card:#171A1F; --bg-fill:#22262C; --bg-hover:#1D2126; --bg-badge:#2A2E36; --bg-badge-hover:#343941;
  --t1:#F2F3F5; --t2:#B4BAC3; --t3:#8A919B; --t4:#5C636D; --divider:#262A31;
  --shadow-card:0 6px 20px rgba(0,0,0,.35); --shadow-float:0 10px 30px rgba(0,0,0,.45); --shadow-brand:0 6px 16px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{margin:0;min-height:100vh;background:var(--bg-page);color:var(--t1);font-family:var(--font);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease}
.page{max-width:1080px;margin:0 auto;padding:26px var(--gap-page) 44px}
.page-head{display:flex;align-items:center;gap:16px;padding:2px 2px 18px;flex-wrap:wrap}
.page-head .phead-text{flex:1;min-width:0}
.page-head h2{font-size:20px;font-weight:700;line-height:1.35;margin:0;letter-spacing:-.01em}
.page-head .ph-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;padding-top:2px;margin-left:auto}
.btn{height:36px;padding:0 16px;border:0;border-radius:var(--r-pill);background:var(--brand);color:var(--brand-fg);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.btn:hover{box-shadow:var(--shadow-brand)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bg-badge);color:var(--t1);font-weight:500}
.btn.ghost:hover{background:var(--bg-badge-hover);box-shadow:none}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* 工具条：筛选 + 计数 */
.toolbar{display:flex;align-items:center;gap:12px;background:var(--bg-card);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:12px 14px;margin-bottom:var(--gap-card)}
.field{display:flex;align-items:center;gap:9px;height:36px;background:var(--bg-fill);border-radius:var(--r-pill);padding:0 14px;flex:1;min-width:0;transition:box-shadow .18s var(--ease)}
.field:focus-within{box-shadow:0 0 0 3px rgba(127,127,127,.16)}
.field svg{width:15px;height:15px;fill:none;stroke:var(--t3);stroke-width:2;flex:0 0 15px}
.field input{border:0;background:none;outline:none;font-family:inherit;font-size:13px;color:var(--t1);width:100%;min-width:0;height:100%}
.field input::placeholder{color:var(--t3)}
.tb-count{font-size:11.5px;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:2px}

/* 快捷链接网格 */
.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.jump-grid[hidden]{display:none}
.jump-card{position:relative;display:flex;align-items:center;background:var(--bg-card);border-radius:var(--r-mid);box-shadow:var(--shadow-card);padding:13px 30px 13px 14px;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.jump-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.jc-link{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:inherit;text-decoration:none;border-radius:12px;outline-offset:4px}
.jump-ic{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:var(--bg-fill);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--t2);font-family:var(--font-serif);letter-spacing:-.02em}
.jump-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.jump-tx b{font-size:12.5px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.jump-tx .jc-url{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.jump-tx .jc-note{font-size:10.5px;color:var(--t3);line-height:1.35;margin-top:1px;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%}
.jump-card .ra{color:var(--t4);font-size:12px;flex:0 0 auto;margin-left:6px;transition:color .18s var(--ease),transform .18s var(--ease)}
.jump-card:hover .ra{color:var(--t2);transform:translate(1px,-1px)}

/* 自定义卡片的编辑 / 删除（悬停或键盘聚焦时出现） */
.jc-acts{position:absolute;top:7px;right:7px;display:flex;gap:2px;opacity:0;transition:opacity .16s var(--ease)}
.jump-card:hover .jc-acts,.jump-card:focus-within .jc-acts{opacity:1}
.ic-act{width:23px;height:23px;border:0;border-radius:8px;background:var(--bg-badge);color:var(--t2);font-family:inherit;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .16s var(--ease),color .16s var(--ease)}
.ic-act:hover{background:var(--bg-badge-hover);color:var(--t1)}
.ic-act.del{font-size:15px}
.ic-act.del:hover{background:rgba(229,72,77,.14);color:#D93A3F}
html[data-theme="dark"] .ic-act.del:hover{color:#FF8A8E}
@media (hover:none){.jc-acts{opacity:1}}

/* 添加卡片 */
.jump-add{justify-content:center;border:1.5px dashed var(--bg-badge);background:none;box-shadow:none;color:var(--t3);font-family:inherit;font-size:12.5px;font-weight:500;padding:14px 16px;cursor:pointer;gap:8px;min-height:74px}
.jump-add:hover{transform:none;box-shadow:none;background:var(--bg-card);color:var(--t1);border-color:var(--t4)}
.jump-add svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;gap:7px;padding:44px 0 36px;color:var(--t3)}
.empty svg{width:34px;height:34px;fill:none;stroke:var(--t4);stroke-width:1.5}
.empty b{font-size:12.5px;font-weight:500;color:var(--t2)}
.empty span{font-size:11.5px;color:var(--t3)}
.empty[hidden]{display:none}

/* 弹窗 */
.mask{position:fixed;inset:0;z-index:120;background:rgba(20,22,26,.32);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.mask[hidden]{display:none}
.panel{width:400px;max-width:100%;background:var(--bg-card);border-radius:var(--r-card);box-shadow:0 30px 70px -18px rgba(0,0,0,.42);padding:22px;animation:panelIn .22s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.panel-h h3{margin:0;font-size:15px;font-weight:700;flex:1}
.panel-x{width:28px;height:28px;border:0;border-radius:8px;background:none;color:var(--t3);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel-x:hover{background:var(--bg-fill);color:var(--t1)}
.form-row{margin-bottom:13px}
.form-row label{display:block;font-size:11.5px;color:var(--t3);margin-bottom:5px}
.form-row input{width:100%;height:38px;border:0;border-radius:12px;background:var(--bg-fill);color:var(--t1);font-family:inherit;font-size:13px;padding:0 13px;outline:none;transition:box-shadow .18s var(--ease)}
.form-row input:focus{box-shadow:0 0 0 3px rgba(127,127,127,.18)}
.form-row input::placeholder{color:var(--t3)}
.panel-err{font-size:11.5px;color:#D93A3F;margin:0 0 10px}
html[data-theme="dark"] .panel-err{color:#FF8A8E}
.panel-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* 轻提示 */
.toast{position:fixed;right:24px;bottom:24px;z-index:130;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--r-pill);background:var(--bg-card);box-shadow:var(--shadow-float);font-size:12px;color:var(--t1);opacity:0;transform:translateY(8px);transition:opacity .22s var(--ease),transform .22s var(--ease);pointer-events:none;max-width:calc(100vw - 48px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:#16A34A;flex:0 0 6px}

@media (max-width:720px){
  .page{padding:18px 14px 32px}
  .page-head{flex-wrap:wrap;gap:10px}
  .page-head .ph-actions{padding-top:0;width:100%}
  .toolbar{flex-wrap:wrap;padding:10px 12px}
  .field{flex:1 1 100%;order:1}
  .tb-count{order:2}
  .jump-grid{grid-template-columns:1fr;gap:10px}
  .jump-card{padding:13px 36px 13px 14px}
  .toast{right:14px;bottom:14px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}}

  /* V1.1：网页版站点导航条 */
  .web-nav-strip { display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    max-width: 1240px; margin: 12px auto 0; padding: 0 20px; }
  .web-nav-strip a { color: var(--text-sec, var(--t2, var(--color-text-muted))); text-decoration: none;
    font-size: 12.5px; padding: 5px 11px; border-radius: 999px; }
  .web-nav-strip a:hover { background: var(--bg-badge, var(--color-surface-hover)); color: var(--text, var(--t1, var(--color-text))); }
  html.is-embed .web-nav-strip { display: none !important; }
</style>

<script>
(function () {
  'use strict';

  // ===== 预置快捷网站（原 7 条 + 新增 4 条；note 为可选备注，仅用于卡片显示） =====
  var PRESET_LINKS = [
    { name: '典津全球汉籍影像开放集成系统', url: 'https://guji.cckb.cn/', icon: '典' },
    { name: '识典古籍', url: 'https://www.shidianguji.com/', icon: '识', note: '古籍在线阅读平台' },
    { name: '国学大全', url: 'https://www.gxdq.com/', icon: '国' },
    { name: '日本所藏中文古籍数据库', url: 'https://www.kanji.zinbun.kyoto-u.ac.jp/kanseki?detail=', icon: '漢' },
    { name: '日本国立公文书馆检索页面', url: 'https://www.digital.archives.go.jp/', icon: '文' },
    { name: '古籍觅宝', url: 'https://guji99.com/', icon: '觅' },
    { name: '读秀学术搜索', url: 'https://new.duxiu.com/login.jsp', icon: '读', note: '可使用 CARSI 烟台大学账号登录' },
    { name: 'PaddleOCR', url: 'https://aistudio.baidu.com/paddleocr', icon: 'OCR' },
    { name: 'GitHub', url: 'https://github.com/', icon: 'Gh' },
    { name: 'DeepSeek 网页版', url: 'https://chat.deepseek.com/', icon: 'DS' },
    { name: 'DeepSeek 桌面版下载', url: 'https://www.deepseek.com/harness/', icon: 'DS' }
  ];

  // ===== 用户自定义标签：沿用 localStorage 'quickLinksCustom'（数组，元素 {name,url,icon}） =====
  var CUSTOM_KEY = 'quickLinksCustom';
  var customLinks = [];
  try {
    var raw = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
    customLinks = Array.isArray(raw) ? raw.filter(function (x) { return x && typeof x === 'object' && typeof x.url === 'string' && x.url; }) : [];
  } catch (e) { customLinks = []; }
  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customLinks)); } catch (e) { /* 忽略配额错误 */ }
  }

  // ===== 工具函数 =====
  function normalizeUrl(raw) {
    var u = (raw || '').trim();
    if (!u) return null;
    // 相对路径（本站文件，含子目录如 docs/manual.pdf）
    if (/^\.?\//.test(u) || /^[^/]+(\.html?|\.pdf|\.txt)$/i.test(u) || /^[\w-]+\/[\w.\/-]+\.(html?|pdf|txt)$/i.test(u)) return u;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }
  function hostOf(url) {
    try { var h = new URL(url).hostname; return h.replace(/^www\./, ''); } catch (e) { return String(url).replace(/^https?:\/\//i, '').split(/[/?#]/)[0]; }
  }
  function iconOf(name, url) {
    var n = (name || '').trim();
    if (n) return n.slice(0, 2);
    var h = hostOf(url);
    return h ? h.charAt(0).toUpperCase() : '网';
  }
  function displayUrl(url) {
    return String(url).replace(/^https?:\/\//i, '').replace(/\/$/, '');
  }

  // ===== DOM =====
  var grid = document.getElementById('jumpGrid');
  var emptyState = document.getElementById('emptyState');
  var countText = document.getElementById('countText');
  var filterInput = document.getElementById('filterInput');

  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastTimer = null;
  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  // ===== 渲染（预置 + 自定义 + 添加卡片） =====
  function buildLinkItem(l, kind, idx) {
    var item = document.createElement('div');
    item.className = 'jump-card';
    if (kind === 'custom') item.setAttribute('data-custom-index', String(idx));

    var a = document.createElement('a');
    a.className = 'jc-link';
    a.href = l.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = (l.name || '') + '\n' + l.url;

    var ic = document.createElement('span');
    ic.className = 'jump-ic';
    ic.setAttribute('aria-hidden', 'true');
    ic.textContent = l.icon || iconOf(l.name, l.url);

    var tx = document.createElement('span');
    tx.className = 'jump-tx';
    var b = document.createElement('b');
    b.textContent = l.name || hostOf(l.url);
    var sp = document.createElement('span');
    sp.className = 'jc-url';
    sp.textContent = displayUrl(l.url);
    tx.appendChild(b);
    tx.appendChild(sp);
    if (l.note) {
      var nt = document.createElement('span');
      nt.className = 'jc-note';
      nt.textContent = l.note;
      tx.appendChild(nt);
    }

    var ra = document.createElement('span');
    ra.className = 'ra';
    ra.setAttribute('aria-hidden', 'true');
    ra.textContent = '↗';

    a.appendChild(ic);
    a.appendChild(tx);
    a.appendChild(ra);
    item.appendChild(a);

    if (kind === 'custom') {
      var acts = document.createElement('span');
      acts.className = 'jc-acts';
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'ic-act';
      edit.setAttribute('data-act', 'edit');
      edit.setAttribute('aria-label', '编辑 ' + (l.name || l.url));
      edit.title = '编辑';
      edit.textContent = '✎';
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'ic-act del';
      del.setAttribute('data-act', 'del');
      del.setAttribute('aria-label', '删除 ' + (l.name || l.url));
      del.title = '删除';
      del.textContent = '×';
      acts.appendChild(edit);
      acts.appendChild(del);
      item.appendChild(acts);
    }
    return item;
  }

  function render() {
    var q = (filterInput.value || '').trim().toLowerCase();
    var all = [];
    PRESET_LINKS.forEach(function (l) { all.push({ link: l, kind: 'preset', idx: -1 }); });
    customLinks.forEach(function (l, i) {
      all.push({ link: { name: l.name || hostOf(l.url), url: l.url, icon: l.icon || iconOf(l.name, l.url), note: l.note || '' }, kind: 'custom', idx: i });
    });
    var shown = all.filter(function (x) {
      if (!q) return true;
      return String(x.link.name || '').toLowerCase().indexOf(q) >= 0 || String(x.link.url).toLowerCase().indexOf(q) >= 0;
    });

    grid.innerHTML = '';
    shown.forEach(function (x) { grid.appendChild(buildLinkItem(x.link, x.kind, x.idx)); });

    // 末尾虚线「添加标签」卡片
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'jump-card jump-add';
    add.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>添加标签</span>';
    add.addEventListener('click', openAdd);
    grid.appendChild(add);

    var total = all.length;
    countText.textContent = q ? ('筛选 ' + shown.length + ' / 共 ' + total + ' 个') : ('共 ' + total + ' 个链接');
    var noResult = shown.length === 0;
    grid.hidden = noResult;
    emptyState.hidden = !noResult;
  }

  grid.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.ic-act') : null;
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var card = btn.closest('.jump-card');
    var idx = parseInt(card.getAttribute('data-custom-index'), 10);
    if (isNaN(idx) || !customLinks[idx]) return;
    if (btn.getAttribute('data-act') === 'del') removeCustom(idx);
    else openEdit(idx);
  });

  // ===== 增 / 删 / 改 =====
  function removeCustom(idx) {
    var name = customLinks[idx] && (customLinks[idx].name || customLinks[idx].url) || '';
    customLinks.splice(idx, 1);
    saveCustom();
    render();
    showToast('已删除：' + name);
  }

  var modalMask = document.getElementById('modalMask');
  var modalTitle = document.getElementById('modalTitle');
  var fName = document.getElementById('fName');
  var fUrl = document.getElementById('fUrl');
  var modalErr = document.getElementById('modalErr');
  var editingIndex = -1;

  function openModal(title, name, url, idx) {
    editingIndex = typeof idx === 'number' ? idx : -1;
    modalTitle.textContent = title;
    fName.value = name || '';
    fUrl.value = url || '';
    modalErr.hidden = true;
    modalMask.hidden = false;
    setTimeout(function () { (url ? fName : fUrl).focus(); }, 30);
  }
  function openAdd() { openModal('添加标签', '', '', -1); }
  function openEdit(idx) {
    var l = customLinks[idx];
    if (!l) return;
    openModal('编辑标签', l.name || '', l.url || '', idx);
  }
  function closeModal() {
    modalMask.hidden = true;
    editingIndex = -1;
  }
  function showModalError(msg) {
    modalErr.textContent = msg;
    modalErr.hidden = false;
  }

  function saveModal() {
    var url = normalizeUrl(fUrl.value);
    if (!url) { showModalError('请输入有效网址'); fUrl.focus(); return; }
    var name = (fName.value || '').trim() || hostOf(url);
    if (editingIndex >= 0) {
      var l = customLinks[editingIndex];
      if (!l) { closeModal(); return; }
      l.name = name;
      l.url = url;
      l.icon = iconOf(name, url);
      saveCustom();
      closeModal();
      render();
      showToast('已保存：' + name);
    } else {
      customLinks.push({ name: name, url: url, icon: iconOf(name, url) });
      saveCustom();
      closeModal();
      render();
      showToast('已添加：' + name);
    }
  }

  document.getElementById('btnAdd').addEventListener('click', openAdd);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  modalMask.addEventListener('click', function (e) { if (e.target === modalMask) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modalMask.hidden) closeModal();
  });
  fUrl.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveModal(); });
  fName.addEventListener('keydown', function (e) { if (e.key === 'Enter') fUrl.focus(); });

  filterInput.addEventListener('input', render);

  render();
})();
</script>
</body>
</html>
