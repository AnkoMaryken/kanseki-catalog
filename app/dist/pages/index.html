let searchDebounceTimer = null;

// ===== v2.1 搜索历史 (localStorage) =====
const SEARCH_HISTORY_KEY = 'kanseki_search_history';
const SEARCH_HISTORY_MAX = 10;

function getSearchHistory() {
  try {
    const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(x => typeof x === 'string' && x.trim()) : [];
  } catch (e) { return []; }
}

function saveSearchHistory(arr) {
  try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(arr.slice(0, SEARCH_HISTORY_MAX))); }
  catch (e) { /* localStorage 不可用时静默 */ }
}

// 记录一次搜索 (去重后置顶, 上限 10 条)
function pushSearchHistory(q) {
  const term = (q || '').trim();
  if (!term || term.length > 60) return;
  const arr = getSearchHistory().filter(x => x !== term);
  arr.unshift(term);
  saveSearchHistory(arr);
}

function clearSearchHistory() {
  saveSearchHistory([]);
  renderSearchHistory();
}

// 渲染搜索历史浮层 (空值聚焦时显示)
function renderSearchHistory() {
  const input = document.getElementById('globalSearch');
  const container = document.getElementById('searchSuggestions');
  if (!input || !container) return;
  if (input.value.trim()) { // 有输入时显示建议, 不显示历史
    container.classList.remove('active');
    return;
  }
  const arr = getSearchHistory();
  if (arr.length === 0) {
    container.classList.remove('active');
    return;
  }
  const historyLabel = toDisplay('搜索历史');
  const clearLabel = toDisplay('清空');
  container.innerHTML =
    '<div class="search-history-head"><span>' + historyLabel + '</span>' +
    '<button type="button" class="search-history-clear" id="searchHistoryClear">' + clearLabel + '</button></div>' +
    arr.map((term, i) =>
      '<div class="search-suggestion-item search-history-item" role="option" data-term="' +
      term.replace(/"/g, '&quot;') + '" data-idx="' + i + '">' +
      '<svg class="search-history-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
      '<span>' + toDisplay(term) + '</span></div>'
    ).join('');
  container.classList.add('active');
  // 历史条目点击: 回填 + 搜索
  container.querySelectorAll('.search-history-item').forEach(el => {
    el.addEventListener('click', function() {
      const term = this.dataset.term;
      input.value = term;
      // 回填后按当前字形显示 (繁体模式下输入框保持用户键入原文)
      input.dispatchEvent(new Event('input', { bubbles: true }));
      performSearchAndJump();
    });
  });
  const clearBtn = document.getElementById('searchHistoryClear');
  if (clearBtn) clearBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    clearSearchHistory();
  });
}

function handleSearch(value) {
  searchQuery = value.trim();
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    applyFilters();
    updateSuggestions(value);
  }, 200);
}

// Execute search AND jump to first matching result
function performSearchAndJump() {
  const input = document.getElementById('globalSearch');
  searchQuery = input.value.trim();
  // v2.1: 记录搜索历史
  if (searchQuery) pushSearchHistory(searchQuery);
  applyFilters();
  updateSuggestions(input.value);
  // V4.3: 搜索提交后关闭建议浮层 (updateSuggestions 会重新打开, 需再次移除, 避免遮挡精准行)
  document.getElementById('searchSuggestions').classList.remove('active');
  
  // If there's a search query and results exist, jump to the first match
  if (searchQuery && filteredData.length > 0) {
    // 跳转目标优先级:
    // 1. 精准命中行 (如 道光三年 → 1823)  — 该行已在 applyFilters 中置顶标记
    // 2. 查询含年号 → 该年号在该归属范围的第一年 (如 道光 → 1821)
    // 3. 兜底: 结果集第一行
    const real = realFilteredRows();
    const precise = real.find(r => preciseHitMark.get(r) && preciseHitMark.get(r).precise);
    if (precise) {
      jumpToYear(precise.year);
    } else {
      const q = toSimplified(searchQuery.trim()).toLowerCase();
      const eraN = findEraNameInQuery(q);
      if (eraN) {
        // 该年号出现的最早年份 (真实行, 排除临近块)
        const firstYear = real.find(r =>
          (r.cnEraNames || []).some(e => e === eraN) ||
          (r.jpEraNames || []).some(e => e === eraN));
        if (firstYear) { jumpToYear(firstYear.year); return; }
      }
      jumpToYear(real[0] ? real[0].year : filteredData[0].year);
    }
  } else if (searchQuery && filteredData.length === 0) {
    showToast('未找到匹配"' + searchQuery + '"的记录');
  }
}

// 模糊补全: 从查询中拆出"年号前缀 + 片段", 对候选做 contains 匹配
// 例: "同治一" -> 同治十一年/同治二十一年... ; "同治戊" -> 同治戊戌/同治戊寅...
// 返回: [{type:'field', value, year, yearStr}]
function suggestEraPrefixMatches(q, maxResults) {
  const results = [];
  if (!q || q.length < 3) return results;
  
  // 年号前缀集合 (从数据中收集, 简体), 按长度降序 (先试长年号)
  const eraNames = new Set();
  for (const row of FULL_DATA) {
    if (results.length >= maxResults) break;
    for (const e of row.cnEraNames) {
      if (e && e !== '—' && e.length >= 2) eraNames.add(e);
    }
    for (const j of (row.jpEraNames || [])) {
      if (j && j !== '—' && j.length >= 2) eraNames.add(j);
    }
    for (const p of row.jpPeriods) {
      if (p && p !== '—' && p.length >= 2) eraNames.add(p);
    }
  }
  
  // 找出作为 q 前缀的年号 (如"同治"), 越长越优先
  const prefixes = Array.from(eraNames)
    .filter(name => q.startsWith(name) && q.length > name.length)
    .sort((a, b) => b.length - a.length);
  
  for (const prefix of prefixes) {
    const rest = q.slice(prefix.length);
    const seen = new Set();
    // 在全部数据中搜索 "prefix + 片段" 候选
    for (const row of FULL_DATA) {
      if (results.length >= maxResults) break;
      const candSet = new Set();
      // 年号全名候选: "同治十一年" 等
      if (row.eraFullCandidates) row.eraFullCandidates.forEach(c => {
        if (c.startsWith(prefix) && c.includes(rest)) candSet.add(c);
      });
      // 年号+干支候选: "同治戊戌" 等
      if (row.eraGzCandidates) row.eraGzCandidates.forEach(c => {
        if (c.startsWith(prefix) && c.includes(rest)) candSet.add(c);
      });
      for (const c of candSet) {
        if (seen.has(c)) continue;
        seen.add(c);
        if (results.length >= maxResults) break;
        // v2.0: 定位该行的朝代/时代前缀 (如"同治十一年" -> "清·同治十一年")
        let pre = '';
        const isCn = (row.cnEraNames || []).some(e => e === prefix);
        const isJp = (row.jpEraNames || []).some(e => e === prefix);
        if (isCn) pre = ((row.cnDynasties || []).find(d => d && d !== '—') || '') + '·';
        else if (isJp) pre = ((row.jpPeriods || []).find(p => p && p !== '—') || '') + '·';
        results.push({ type:'field', value: pre + c, year: row.year, yearStr: row.yearStr });
      }
    }
    if (results.length > 0) break; // 最长年号前缀已命中则不再尝试更短前缀
  }
  
  return results;
}

function updateSuggestions(query) {
  const container = document.getElementById('searchSuggestions');
  if (!query.trim() || query.trim().length < 1) {
    // v2.1: 空查询时显示搜索历史 (如有)
    renderSearchHistory();
    return;
  }
  
  // 繁简归一化: 查询词与数据均转简体匹配
  const rawQ = query.trim();
  const q = toSimplified(rawQ).toLowerCase();
  const suggestions = new Set();
  const maxResults = 15;
  
  // ========== v2.0/v2.1 拼音/首字母检索 (纯字母查询) ==========
  if (/^[a-z]+$/.test(q)) {
    const cands = matchPinyinCandidates(q, maxResults);
    cands.forEach(c => {
      // v2.1: 干支/年份候选 era 已是完整显示文本 (如"戊辰年""公元2026年"), 年号候选需拼朝代前缀
      let value = c.era;
      if (c.type !== 'gz' && c.type !== 'year' && c.prefix) value = c.prefix + '·' + c.era;
      suggestions.add(JSON.stringify({
        type: c.type === 'gz' ? 'ganzhi' : (c.type === 'year' ? 'field' : 'pinyin'),
        value: value, year: c.year, yearStr: c.yearStr
      }));
    });
    if (suggestions.size > 0) {
      return renderSuggestions(container, suggestions, maxResults, query);
    }
    // 拼音无命中时继续走汉字逻辑 (兜底)
  }
  
  // 干支语义建议: 若查询为纯干支, 只提示干支年 (避免与常规建议重复)
  const gzMatch = extractGanzhi(q);
  if (gzMatch) {
    const gz = gzMatch.ganzhi;
    // 只有纯干支查询时 (无其他关键词) 才走干支建议
    const before = q.slice(0, q.indexOf(gz[0]));
    const after = q.slice(q.indexOf(gz[1]) + 1);
    const isPureGanzhi = !(before + after).trim();
    if (isPureGanzhi) {
      for (const row of FULL_DATA) {
        if (suggestions.size >= maxResults) break;
        if (row.ganzhi === gz) {
          suggestions.add(JSON.stringify({type:'ganzhi', value:gz + '年（' + row.yearStr + '）', year:row.year, yearStr:row.yearStr}));
        }
      }
      // 纯干支时直接输出建议, 不走常规匹配
      if (suggestions.size > 0) {
        return renderSuggestions(container, suggestions, maxResults, query);
      }
    }
  }
  
  // ========== v2.0 汉字候选: 按年号聚合 + 朝代前缀 ==========
  // 单字/双字: 按年号顺序列出候选 (如"景" -> 景王/汉景帝/景初...)
  if (q.length >= 1 && q.length <= 2 && /^[\u4e00-\u9fff]+$/.test(q)) {
    const matched = [];
    for (const c of ERA_CANDIDATES) {
      if (matched.length >= maxResults) break;
      // 年号本身前缀匹配 (如"景"匹配"景王""景初"), 君主名/帝王名包含匹配
      if (c.era.startsWith(q) || c.era.includes(q)) {
        const prefix = c.prefix ? c.prefix + '·' : '';
        matched.push({ value: prefix + c.era, year: c.year, yearStr: c.yearStr });
      }
    }
    // 去重 (同年号同前缀只留最早年份)
    const seenVal = new Set();
    for (const m of matched) {
      const k = m.value + '|' + m.year;
      if (seenVal.has(k)) continue;
      seenVal.add(k);
      suggestions.add(JSON.stringify({ type:'field', value:m.value, year:m.year, yearStr:m.yearStr }));
    }
    // 单字/双字查询: 命中即返回 (避免逐年重复的常规匹配干扰)
    if (suggestions.size > 0) {
      return renderSuggestions(container, suggestions, maxResults, query);
    }
  }
  
  // --- 模糊补全: "年号 + 片段" (如"同治一"→同治十一年/二十一年, "同治戊"→同治戊戌/戊寅) ---
  const eraCand = suggestEraPrefixMatches(q, maxResults);
  if (eraCand.length > 0) {
    eraCand.forEach(item => suggestions.add(JSON.stringify(item)));
  }
  
  // V8.3: 混合查询建议 (汉字+拼音/数字) — "光绪wushen" → "清·光绪 戊申 1908"
  const mixedQ = parseMixedQuery(q);
  if (mixedQ && mixedQ.eraPart && (mixedQ.gzPart || mixedQ.numPart !== undefined)) {
    for (const row of FULL_DATA) {
      if (suggestions.size >= maxResults) break;
      if (!mixedQueryHit(row, mixedQ)) continue;
      // 找到该行匹配的年号 (用于显示)
      const eraHit = (row.cnEraNames || []).find(e => e && e.includes(mixedQ.eraPart)) ||
                     (row.jpEraNames || []).find(j => j && j.includes(mixedQ.eraPart));
      let value = '';
      if (eraHit) {
        const pre = (row.cnDynasties || []).find(d => d && d !== '—') || (row.jpPeriods || []).find(p => p && p !== '—') || '';
        value = (pre ? pre + '·' : '') + eraHit;
        if (mixedQ.gzPart) value += ' ' + mixedQ.gzPart;
        else if (mixedQ.numPart !== undefined) {
          // 数字: 若在 1-60 显示为年号第N年, 否则公历年份
          if (mixedQ.numPart >= 1 && mixedQ.numPart <= 60) value += ' 第' + mixedQ.numPart + '年';
          else value += ' ' + mixedQ.numPart + '年';
        }
      } else {
        value = row.ganzhi + ' ' + row.yearStr;
      }
      suggestions.add(JSON.stringify({ type:'field', value, year: row.year, yearStr: row.yearStr }));
    }
  }
  // V8.3: 干支错写建议 — "巳巳" → 提示"己巳" 及对应年份
  if (suggestions.size === 0 && /^[\u4e00-\u9fff]+$/.test(q)) {
    const typo = detectGanzhiTypo(q);
    if (typo) {
      for (const row of FULL_DATA) {
        if (suggestions.size >= maxResults) break;
        if (row.ganzhi === typo.corrected) {
          suggestions.add(JSON.stringify({ type:'field', value: typo.corrected + '（' + toDisplay(row.yearStr) + '）', year: row.year, yearStr: row.yearStr }));
        }
      }
    }
  }
  
  // 常规字段匹配 (基于 searchKey), 带匹配质量分
  const suggestionItems = []; // {score, data}
  if (suggestions.size < maxResults) {
    for (const row of FULL_DATA) {
      if (suggestionItems.length >= maxResults * 3) break;
      if (!row.searchKey) continue;
      const idx = row.searchKey.indexOf(q);
      if (idx >= 0) {
        // 提取命中的可读字段 (优先年号/干支)
        let value = row.ganzhi + ' ' + row.yearStr;
        let score = 5; // 基础分
        let matchLen = 99; // 年号名长度 (短者优先)
        const eraHit = row.cnEraNames.find(e => e && e !== '—' && e.includes(q)) ||
                       row.jpPeriods.find(p => p && p !== '—' && p.includes(q));
        if (eraHit) {
          value = eraHit;
          matchLen = eraHit.length;
          // 年号名: 前缀匹配最高分, 包含次之
          if (eraHit.startsWith(q)) score = 100;
          else score = 60;
        } else if (row.ganzhi === q) {
          score = 90; // 干支精确匹配
          matchLen = 2;
        } else if (row.yearStr === q) {
          score = 85; // 年份精确匹配
          matchLen = 4;
        }
        suggestionItems.push({ score, matchLen, value, year: row.year, yearStr: row.yearStr });
      }
    }
    // 按质量分降序, 同分按年号名长度升序 (短名优先), 再按年份
    suggestionItems.sort((a, b) => b.score - a.score || a.matchLen - b.matchLen || a.year - b.year);
    suggestionItems.slice(0, maxResults).forEach(item => {
      suggestions.add(JSON.stringify({type:'field', value:item.value, year:item.year, yearStr:item.yearStr}));
    });
  }
  
  if (suggestions.size === 0) {
    container.innerHTML = '<div class="search-suggestion-item" style="color:var(--color-text-muted);cursor:default;">无匹配建议</div>';
    container.classList.add('active');
    return;
  }
  
  renderSuggestions(container, suggestions, maxResults, query);
}

// 渲染搜索建议 (显示跟随当前字形)
function renderSuggestions(container, suggestions, maxResults, query) {
  container.innerHTML = Array.from(suggestions).slice(0, maxResults).map(s => {
    const item = JSON.parse(s);
    // 建议显示跟随当前字形 (繁体模式下显示繁体)
    const displayYear = toDisplay(item.yearStr);
    const dispQuery = queryForDisplay(query.trim());
    // v2.0: 带朝代前缀的候选 (如"明·景泰") 前缀弱化显示, 年号部分高亮
    let mainHtml = '';
    if (item.value && item.value.includes('·')) {
      const sep = item.value.indexOf('·');
      const prefix = toDisplay(item.value.slice(0, sep + 1));
      const body = toDisplay(item.value.slice(sep + 1));
      mainHtml = `<span style="color:var(--color-text-muted);font-size:0.8rem;">${prefix}</span><span>${highlightText(body, dispQuery)}</span>`;
    } else {
      mainHtml = `<span>${highlightText(toDisplay(item.value), dispQuery)}</span>`;
    }
    return `<div class="search-suggestion-item" role="option" data-year="${item.year}">
      <span style="font-family:var(--font-mono);font-size:0.8rem;color:var(--color-text-muted);min-width:50px;">${displayYear}</span>
      ${mainHtml}
    </div>`;
  }).join('');
  
  container.classList.add('active');
  
  // Click event
  container.querySelectorAll('.search-suggestion-item[data-year]').forEach(el => {
    el.addEventListener('click', function() {
      const year = parseInt(this.dataset.year);
      jumpToYear(year);
      container.classList.remove('active');
    });
  });
}

function jumpToYear(year) {
  // Each year has exactly one row now — V4.2: 用真实行定位 (排除临近行/分隔行)
  const real = filteredData.filter(r => !isNearbyRow(r) && !isNearbySep(r));
  const idx = real.findIndex(r => r.year === year);
  if (idx >= 0) {
    currentPage = Math.floor(idx / perPage) + 1;
    renderByViewMode();
    renderPagination();
    // V4.3: 滚到结果区顶部并补偿 sticky 顶栏高度, 避免精准行被遮挡
    var _hdr = document.querySelector('.app-header');
    var _fbar = document.querySelector('.filter-bar.filter-desktop');
    var _stickyH = (_hdr && getComputedStyle(_hdr).display !== 'none' ? _hdr.offsetHeight : 0) + (_fbar ? _fbar.offsetHeight : 0);
    // v3：单年区域表时滚到结果白卡（年份表格已隐藏）
    var _target = document.body.classList.contains('v3-year')
      ? document.getElementById('resultCard')
      : document.getElementById('tableWrapper');
    var _wrapTop = _target ? (_target.getBoundingClientRect().top + window.scrollY) : 0;
    window.scrollTo({ top: Math.max(0, _wrapTop - _stickyH), behavior: 'smooth' });
    
    // After render, highlight the row briefly
    setTimeout(() => {
      const rows = document.querySelectorAll('#tableBody tr');
      rows.forEach(r => {
        if (r.querySelector('.cell-year') && r.querySelector('.cell-year').textContent.trim() === (year < 0 ? '前'+Math.abs(year) : String(year))) {
          r.style.background = 'var(--color-highlight)';
          setTimeout(() => { r.style.background = ''; }, 2000);
        }
      });
    }, 100);
  }
}

// ========================================
// Toast// ========================================
// Toast
// ========================================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========================================
// Theme Toggle
// ========================================
function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}

// ========================================
// Mobile Filter Panel
// ========================================
function initMobileFilter() {
  const panel = document.getElementById('filterPanelMobile');
  const overlay = document.getElementById('filterPanelOverlay');
  const toggleBtn = document.getElementById('filterToggleMobile');
  const closeBtn = document.getElementById('filterPanelClose');
  const applyBtn = document.getElementById('filterApplyMobile');
  // 旧版移动端筛选面板已移除（移动端沿用 v3 快捷筛选浮层），无节点时直接跳过
  if (!panel) return;
  
  function open() {
    panel.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  
  function close() {
    panel.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }
  
  if (toggleBtn) toggleBtn.addEventListener('click', open);
  if (closeBtn) closeBtn.addEventListener('click', close);
  if (overlay) overlay.addEventListener('click', close);
  if (applyBtn) applyBtn.addEventListener('click', () => {
    applyFilters();
    close();
  });
}

// ========================================
// Check mobile and adjust layout
// ========================================
function adjustForMobile() {
  const isMobile = window.innerWidth <= 768;
  const filterDesktop = document.querySelector('.filter-bar.filter-desktop');
  const filterMobile = document.getElementById('mobileFilterBar');
  const hamburger = document.getElementById('mHamburger');
  
  if (isMobile) {
    if (filterDesktop) filterDesktop.style.display = 'none';
    if (filterMobile) filterMobile.style.display = '';
    // V8.2: 移动端显示汉堡按钮 (CSS 默认 display:none, 内联兜底)
    if (hamburger) hamburger.style.display = 'inline-flex';
  } else {
    if (filterDesktop) filterDesktop.style.display = '';
    if (filterMobile) filterMobile.style.display = 'none';
    if (hamburger) hamburger.style.display = 'none';
    // V8.2: 回到桌面时按用户选择恢复视图渲染
    if (viewMode !== getViewMode()) {
      viewMode = getViewMode();
      document.body.classList.toggle('view-card', viewMode === 'card');
      const tBtn = document.getElementById('viewModeTable');
      const cBtn = document.getElementById('viewModeCard');
      if (tBtn) tBtn.classList.toggle('active', viewMode !== 'card');
      if (cBtn) cBtn.classList.toggle('active', viewMode === 'card');
      renderByViewMode();
    }
  }
  // V8.3: 列数切换跟随视图/窗口宽度显隐 (仅桌面卡片视图)
  const colsSwitch = document.getElementById('cardColsSwitch');
  if (colsSwitch) {
    colsSwitch.style.display = (!isMobile && viewMode === 'card') ? '' : 'none';
  }

  // V10.0: 视口跨过 768 断点（表格 ↔ 卡片 / 全表 ↔ 分页）时补一次重渲染
  const mode = effectiveMode();
  if (lastEffectiveMode !== null && lastEffectiveMode !== mode) {
    lastEffectiveMode = mode;
    renderByViewMode();
    renderPagination();
    updateStats();
  } else {
    lastEffectiveMode = mode;
  }
}

// ========================================
// Scroll to Top Button
// ========================================
function initScrollToTop() {
  const btn = document.createElement('button');
  btn.id = 'scrollTopBtn';
  btn.className = 'btn-icon';
  btn.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;z-index:200;opacity:0;visibility:hidden;transition:opacity var(--transition-md),visibility var(--transition-md);transform:rotate(0deg);background:var(--color-primary);border-color:var(--color-primary);color:var(--color-bg);width:42px;height:42px;border-radius:50%;box-shadow:var(--shadow-lg);';
  btn.setAttribute('aria-label', '回到顶部');
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>';
  document.body.appendChild(btn);

  btn.addEventListener('click', () => {
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // v2.2 滚动进度条
  const progressBar = document.getElementById('scrollProgress');
  let scrollTimer;
  window.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      if (window.scrollY > 400) {
        btn.style.opacity = '1';
        btn.style.visibility = 'visible';
      } else {
        btn.style.opacity = '0';
        btn.style.visibility = 'hidden';
      }
      if (progressBar) {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        progressBar.style.width = max > 0 ? (Math.min(window.scrollY / max, 1) * 100) + '%' : '0';
      }
    }, 50);
  }, {passive:true});
}

// ========================================
// Initialization
// ========================================
function init() {
  // Theme
  initTheme();
  
  // 默认繁体显示 (v1.1 起): 初始化表头/筛选标签/placeholder/统计栏等全部 UI
  // V8.9: 改为读记忆 —— 用户上次切到简体则保持简体, 无记录时为繁体
  initDisplayLang();
  
  // V8.2: 初始化视图模式 (桌面持久化; 移动端强制卡片不落盘)
  viewMode = getViewMode();
  document.body.classList.toggle('view-card', viewMode === 'card' && window.innerWidth > 768);
  const vT = document.getElementById('viewModeTable');
  const vC = document.getElementById('viewModeCard');
  if (vT) vT.classList.toggle('active', viewMode !== 'card');
  if (vC) vC.classList.toggle('active', viewMode === 'card');
  if (vT) vT.addEventListener('click', function() { setViewMode('table'); });
  if (vC) vC.addEventListener('click', function() { setViewMode('card'); });
  // V8.3: 卡片列数初始化 + 切换
  setCardColumns(getCardColumns());
  initCardColsSwitch();
  // V10.0: 全表「加载全部年份」—— 用户主动请求时才插入全部 2,800+ 行
  const ftLoadAllBtn = document.getElementById('ftLoadAllBtn');
  if (ftLoadAllBtn) {
    ftLoadAllBtn.addEventListener('click', function() {
      if (fullTableRange === 'all') return;
      fullTableRange = 'all';
      renderByViewMode();
      renderPagination();
      updateStats();
    });
  }
  const colsSwitch = document.getElementById('cardColsSwitch');
  if (colsSwitch) colsSwitch.style.display = (viewMode === 'card' && window.innerWidth > 768) ? '' : 'none';
  
  // V8.2: 抽屉内简繁切换 (与顶部一致)
  const mLangS = document.getElementById('mLangBtnS');
  const mLangT = document.getElementById('mLangBtnT');
  if (mLangS) mLangS.addEventListener('click', function() { setDisplayLang('s'); });
  if (mLangT) mLangT.addEventListener('click', function() { setDisplayLang('t'); });
  
  // V8.2: 同源 storage 同步 (admin 写入 → 自动刷新)
  if (typeof window.registerStorageSync === 'function') {
    window.registerStorageSync();
  }
  
  // Render filter tags
  renderFilterTags();
  
  // Initial filter
  sortData();
  filteredData = [...FULL_DATA];
  applyFilters();
  
  // Adjust for mobile
  adjustForMobile();
  
  // Event listeners
  // Search
  document.getElementById('globalSearch').addEventListener('input', function(e) {
    handleSearch(this.value);
  });
  document.getElementById('globalSearch').addEventListener('focus', function() {
    // v2.1: 聚焦且为空时显示搜索历史
    if (!this.value.trim()) renderSearchHistory();
  });
  document.getElementById('globalSearch').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      performSearchAndJump();
    }
  });
  
  // Search button click
  document.getElementById('searchBtn').addEventListener('click', function() {
    performSearchAndJump();
  });
  document.getElementById('globalSearch').addEventListener('blur', function() {
    setTimeout(() => document.getElementById('searchSuggestions').classList.remove('active'), 200);
  });
  
  // Close suggestions on click outside（建议浮层现在挂在 v3 搜索行内）
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.searchrow')) {
      document.getElementById('searchSuggestions').classList.remove('active');
    }
  });
  
  // Per page
  document.getElementById('perPageSelect').addEventListener('change', function() {
    perPage = parseInt(this.value);
    currentPage = 1;
    renderByViewMode();
    renderPagination();
  });
  
  
  // 主题切换已移到桌面外壳；页内不再保留按钮（initTheme 仍读外壳同步的 theme）
  // 简繁切换（网页版顶栏保留；桌面版由外壳标题栏按钮经 KansekiLang 驱动）
  const langBtnS = document.getElementById('langBtnS');
  const langBtnT = document.getElementById('langBtnT');
  if (langBtnS) langBtnS.addEventListener('click', function() { setDisplayLang('s'); });
  if (langBtnT) langBtnT.addEventListener('click', function() { setDisplayLang('t'); });
  // 将搜索框的简体 placeholder 存到 data 属性 (供切换用)
  document.getElementById('globalSearch').dataset.placeholderCn = '输入公历年、年号、干支或君主名，如 1600';

  // v3 搜索行「清除」：清空搜索框与快捷筛选，回到默认全部年份列表（第 1 页）
  const clearSearchBtn = document.getElementById('clearSearchBtn');
  if (clearSearchBtn) {
    clearSearchBtn.addEventListener('click', function() {
      const inp = document.getElementById('globalSearch');
      if (inp) inp.value = '';
      searchQuery = '';
      selectedChinaFilters.clear();
      selectedChinaEras.clear();
      selectedJapanFilters.clear();
      renderFilterTags();
      qfRenderChips();
      const sug = document.getElementById('searchSuggestions');
      if (sug) sug.classList.remove('active');
      currentPage = 1;
      applyFilters();
      if (inp) inp.focus();
    });
  }
  
  // Filter clear — 桌面 filter-bar 已移除 (V5.1), 改用快捷筛选浮窗的垃圾桶
  qfInitPanel();

  // 用户菜单（登录下拉）点击展开/收起
  const userDropdown = document.querySelector('.user-dropdown');
  if (userDropdown) {
    const userBtn = userDropdown.querySelector('.user-btn');
    if (userBtn) {
      userBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const open = userDropdown.classList.toggle('open');
        userBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
    document.addEventListener('click', function(e) {
      if (!userDropdown.contains(e.target)) {
        userDropdown.classList.remove('open');
        const b = userDropdown.querySelector('.user-btn');
        if (b) b.setAttribute('aria-expanded', 'false');
      }
    });
  }

  const filterClearMobile = document.getElementById('filterClearBtnMobile');
  if (filterClearMobile) {
    filterClearMobile.addEventListener('click', function() {
      selectedChinaFilters.clear();
      selectedJapanFilters.clear();
      renderFilterTags();
      applyFilters();
    });
  }
  
  // Sort
  document.querySelector('#tableHead th.sortable').addEventListener('click', function() {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    const arrow = this.querySelector('.sort-arrow');
    if (arrow) {
      arrow.textContent = sortDir === 'asc' ? '▲' : '▼';
      arrow.classList.add('active');
    }
    sortData();
    currentPage = 1;
    applyFilters();
  });
  
  // Mobile filter
  initMobileFilter();
  
  // Window resize
  window.addEventListener('resize', adjustForMobile);
  
  // Keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('globalSearch').focus();
    }
    if (e.key === 'Escape') {
      const sug = document.getElementById('searchSuggestions');
      if (sug) sug.classList.remove('active');
      const fp = document.getElementById('filterPanelMobile');
      const fo = document.getElementById('filterPanelOverlay');
      if (fp) fp.classList.remove('open');
      if (fo) fo.classList.remove('open');
      document.body.style.overflow = '';
    }
  });
  
  // Scroll to top
  initScrollToTop();
  // Knowledge panel
  initKnowledgePanel();
  
  // Initial stats
  updateStats();
  
  // Era copy button — event delegation
  // 复制按钮统一处理 (表格 .era-copy-btn 与卡片 .yc-copy 共用)
  function handleCopyClick(e) {
    const btn = e.target.closest('.era-copy-btn, .yc-copy, .v3-year-copy, .c-span[data-copy]');
    if (!btn) return;
    e.stopPropagation();
    
    // 按当前字形输出 (简体/繁体)
    const copyText = toDisplay(btn.dataset.copy);
    if (!copyText) return;
    
    navigator.clipboard.writeText(copyText).then(() => {
      btn.classList.add('copied');
      showToast('已复制：' + copyText);
      setTimeout(() => btn.classList.remove('copied'), 1500);
    }).catch(() => {
      // Fallback for older browsers
      const ta = document.createElement('textarea');
      ta.value = copyText;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.classList.add('copied');
      showToast('已复制：' + copyText);
      setTimeout(() => btn.classList.remove('copied'), 1500);
    });
  }
  document.getElementById('tableBody').addEventListener('click', handleCopyClick);
  const v3Box = document.getElementById('v3Result');
  if (v3Box) v3Box.addEventListener('click', handleCopyClick);
  const cardViewEl = document.getElementById('cardView');
  if (cardViewEl) cardViewEl.addEventListener('click', handleCopyClick);
  
  console.log('%c古代史及汉籍研究工具 — 纪年查询系统已就绪%c\n共' + FULL_DATA.length.toLocaleString() + '条记录 | Ctrl+K 快速搜索 | 支持公元前年份查询',
    'font-weight:bold;color:#1a2a4a;font-size:14px;', 'color:#5c564d;');
}

// Boot
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
