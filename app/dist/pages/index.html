}
.table-wrapper th .sort-arrow.active { opacity: 1; }
.table-wrapper th.col-year { min-width: 80px; text-align: center; position: sticky; left: 0; z-index: 15; }
.table-wrapper th.col-ganzhi { min-width: 70px; text-align: center; }
.table-wrapper th.col-zodiac { min-width: 60px; text-align: center; }
.table-wrapper th.col-cn-dynasty { min-width: 100px; }
.table-wrapper th.col-cn-era { min-width: 140px; }
.table-wrapper th.col-cn-ruler { min-width: 80px; }
.table-wrapper th.col-jp-period { min-width: 80px; }
.table-wrapper th.col-jp-era { min-width: 140px; }
.table-wrapper th.col-jp-ruler { min-width: 90px; }
.table-wrapper th.col-notes { min-width: 180px; }

.table-wrapper td {
  padding: 0.55rem 0.75rem;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--color-divider);
  vertical-align: top;
  line-height: 1.55;
  transition: background var(--transition-fast);
}
.table-wrapper tbody tr { transition: background var(--transition-fast); }
.table-wrapper tbody tr:nth-child(even) td { background: var(--color-table-stripe); }
.table-wrapper tbody tr:hover td { background: var(--color-surface-hover); }
.table-wrapper tbody tr:last-child td { border-bottom: none; }

/* Column-specific */
td.cell-year {
  font-family: var(--font-mono);
  font-weight: 700;
  text-align: center;
  color: var(--color-text);
  position: sticky;
  left: 0;
  background: var(--color-surface);
  z-index: 5;
  box-shadow: 2px 0 6px var(--color-shadow);
}
tbody tr:nth-child(even) td.cell-year { background: var(--color-table-stripe); }
tbody tr:hover td.cell-year { background: var(--color-surface-hover); }
td.cell-ganzhi { text-align: center; font-weight: 500; }
td.cell-zodiac { text-align: center; }
td.cell-cn-dynasty { font-weight: 500; }
td.cell-cn-era { font-weight: 600; color: var(--color-china-accent); }
td.cell-jp-era { font-weight: 600; color: var(--color-japan-accent); }
td.cell-notes { font-size: 0.8rem; color: var(--color-text-secondary); }

/* Multi-era divider */
.era-divider {
  border-top: 1px dashed var(--color-border);
  margin: 3px 0;
}
.era-entry { padding: 2px 0; position: relative; display: inline-flex; align-items: center; gap: 3px; }
.era-copy-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px; height: 20px;
  border-radius: 3px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--color-text-muted);
  cursor: pointer;
  opacity: 0;
  transition: all var(--transition-fast);
  padding: 0;
  flex-shrink: 0;
}
tr:hover .era-copy-btn, .era-entry:focus-within .era-copy-btn { opacity: 1; }
.era-copy-btn:hover {
  background: var(--color-btn-hover);
  border-color: var(--color-border);
  color: var(--color-primary);
}
.era-copy-btn:active { transform: scale(0.85); }
.era-copy-btn.copied { color: var(--color-accent); border-color: var(--color-accent); background: var(--color-highlight); }

/* ============================================
   V4.2 精确查询增强
   1) 临近年份「猜你会需要」分组行
   2) 日本年号命中闪烁提醒
   3) 相同年号高亮提醒框
   ============================================ */
/* 临近行 (弱化, 与精准行区分) */
tr.nearby-row {
  opacity: 0.78;
}
/* V8.3: 干支错写修正命中行 (如 "巳巳" → 己巳年) 弱高亮 */
tr.typo-hit-row td {
  background: color-mix(in srgb, var(--color-accent) 6%, var(--color-surface)) !important;
}
tr.typo-hit-row td.cell-year,
tr.typo-hit-row td.cell-ganzhi { color: var(--color-accent); font-weight: 700; }
.year-card.typo-hit { background: color-mix(in srgb, var(--color-accent) 6%, var(--color-surface)); }
.year-card.typo-hit .yc-year,
.year-card.typo-hit .yc-ganzhi { color: var(--color-accent); }
.ea-gz-years { color: var(--color-text-secondary); }
tr.nearby-row td {
  background: color-mix(in srgb, var(--color-bg) 60%, transparent) !important;
  color: var(--color-text-secondary);
}
tr.nearby-row td.cell-year { background: color-mix(in srgb, var(--color-bg) 60%, transparent) !important; }
tr.nearby-row:hover td { background: var(--color-surface-hover) !important; }
tr.nearby-row td.cell-cn-era,
tr.nearby-row td.cell-jp-era { color: var(--color-text-secondary); font-weight: 500; }
/* 分隔横线行 (精准命中行下方, 居中短横线, 其下为年号全部年份) */
tr.nearby-sep-row td {
  padding: 0.9rem 0.75rem;
  background: transparent !important;
  border-bottom: none;
}
tr.nearby-sep-row:hover td { background: transparent !important; }
.nearby-sep {
  display: block;
  width: 220px;
  max-width: 40%;
  margin: 0 auto;
  border-top: 1px solid var(--color-border);
}
/* 横线下方小字标题: 左对齐, 浅色小字, 提示下方为年号全部年份 */
.nearby-label {
  display: block;
  margin-top: 0.55rem;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--color-text-muted);
  text-align: left;
}
/* 精准行强调 (无描边, 仅与正常行保持一致, 命中位置由跳转定位保证) */

/* 日本年号命中闪烁 (jp-era 单元格 + 提示条) */
.jp-flash-cell {
  animation: jpFlashCell 1.6s ease-in-out 2;
  border-radius: var(--radius-sm);
}
@keyframes jpFlashCell {
  0%, 100% { background: transparent; }
  30% { background: color-mix(in srgb, var(--color-japan-accent) 22%, transparent); }
  60% { background: color-mix(in srgb, var(--color-japan-accent) 14%, transparent); }
}
.jp-flash-hint {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.15rem 0.6rem;
  border-radius: 100px;
  font-size: 0.72rem;
  font-weight: 600;
  background: color-mix(in srgb, var(--color-japan-accent) 16%, transparent);
  color: var(--color-japan-accent);
  border: 1px solid color-mix(in srgb, var(--color-japan-accent) 35%, transparent);
  white-space: nowrap;
}
.jp-flash-hint::before { content: 'ⓙ'; font-size: 0.72rem; }

/* ============================================
   V8.0 其他朝代 (日本+周边政权)
   ============================================ */
/* 其他朝代列: 政权名小字徽标 */
.ot-state-tag {
  display: inline-block;
  padding: 0.05rem 0.4rem;
  margin-right: 0.25rem;
  border-radius: var(--radius-sm);
  font-size: 0.72rem;
  line-height: 1.5;
  background: color-mix(in srgb, var(--color-japan-accent) 10%, transparent);
  color: var(--color-japan-accent);
  border: 1px solid color-mix(in srgb, var(--color-japan-accent) 22%, transparent);
  vertical-align: baseline;
}
/* 无年号占位 (V8.0) */
.era-entry.no-era .era-text {
  color: var(--color-text-muted);
  font-style: italic;
  font-size: 0.88em;
}
/* 在位君主: 默认省略, 悬停显示 (V8.0) */
.ruler-hover {
  display: inline-block;
  position: relative;
  cursor: help;
}
.ruler-hover .ruler-mask {
  display: inline-block;
  max-width: 5.5em;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  vertical-align: bottom;
}
.ruler-hover .ruler-name {
  display: none;
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%);
  z-index: 40;
  padding: 0.35rem 0.6rem;
  border-radius: var(--radius-sm);
  background: var(--color-popover);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-md);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--color-text);
  white-space: nowrap;
  pointer-events: none;
}
.ruler-hover:hover .ruler-name,
.ruler-hover:focus .ruler-name {
  display: block;
}

/* 相同年号高亮提醒框 (表头上方) */
.era-alert {
  display: none;
  margin: 0 0 0.9rem;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--color-accent) 7%, var(--color-surface));
  border: 1px solid color-mix(in srgb, var(--color-accent) 28%, transparent);
  border-left: 3px solid var(--color-accent);
  font-size: 0.82rem;
  line-height: 1.65;
  color: var(--color-text);
  animation: alertIn 0.3s var(--ease-spring);
}
.era-alert.show { display: block; }
@keyframes alertIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
.era-alert .ea-title {
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-weight: 700;
  color: var(--color-accent);
  margin-right: 0.4rem;
}
.era-alert .ea-title::before { content: '⚠'; font-size: 0.85rem; }
.era-alert .ea-tag {
  display: inline-block;
  padding: 0.05rem 0.5rem;
  margin: 0 0.2rem 0.15rem 0;
  border-radius: 100px;
  font-size: 0.74rem;
  font-weight: 600;
  background: color-mix(in srgb, var(--color-accent) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--color-accent) 25%, transparent);
}
.era-alert .ea-jp { background: color-mix(in srgb, var(--color-japan-accent) 14%, transparent); border-color: color-mix(in srgb, var(--color-japan-accent) 32%, transparent); color: var(--color-japan-accent); }

/* ============================================
   Knowledge Panel — 书画纪时常识悬浮模块
   ============================================ */
.knowledge-btn {
  position: fixed; bottom: 5.5rem; right: 1.5rem; z-index: 200;
  width: 42px; height: 42px;
  min-width: 42px; max-width: 180px;
  border-radius: 100px;
  background: var(--color-primary);
  color: var(--color-bg);
  border: none; cursor: pointer;
  font-family: var(--font-body); font-size: 0.8rem;
  box-shadow: var(--shadow-lg);
  transition: all 0.35s var(--ease-spring);
  white-space: nowrap;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  gap: 0.35rem; padding: 0;
}
.knowledge-btn .kb-text { max-width: 0; overflow: hidden; opacity: 0; transition: all 0.35s var(--ease-spring); }
.knowledge-btn .kb-icon { flex-shrink: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
.knowledge-btn:hover { width: auto; min-width: 170px; padding: 0 0.85rem; background: var(--color-primary-light); }
.knowledge-btn:hover .kb-text { max-width: 140px; opacity: 1; }
.knowledge-btn.locked { background: var(--color-accent); }


.knowledge-panel {
  position: fixed; bottom: 5rem; right: 7rem; z-index: 190;
  width: 680px; max-width: calc(100vw - 8rem);
  max-height: 80vh;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  display: flex;
  opacity: 0; visibility: hidden;
  transform: translateX(12px) scale(0.98);
  transition: opacity 0.25s var(--ease-spring), visibility 0.25s var(--ease-spring), transform 0.25s var(--ease-spring);
  overflow: hidden;
}
.knowledge-panel.show { opacity: 1; visibility: visible; transform: translateX(0) scale(1); }

.knowledge-nav {
  width: 140px; min-width: 120px; flex-shrink: 0;
  background: var(--color-bg-alt);
  border-right: 1px solid var(--color-border-light);
  padding: 0.75rem 0;
  overflow-y: auto;
}
.knowledge-nav-item {
  display: block; width: 100%;
  padding: 0.5rem 1rem;
  border: none; background: none;
  text-align: left;
  font-family: var(--font-body); font-size: 0.82rem;
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  border-left: 3px solid transparent;
}
.knowledge-nav-item:hover { color: var(--color-text); background: var(--color-surface-hover); }
.knowledge-nav-item.active {
  color: var(--color-text); font-weight: 600;
  border-left-color: var(--color-primary); background: var(--color-surface);
}

.knowledge-content {
  flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem;
  min-height: 0;
}
.knowledge-content h3 { font-size: 1.1rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--color-divider); color: var(--color-text); }
.knowledge-content h4 { font-size: 0.9rem; margin: 1rem 0 0.5rem; color: var(--color-text); }
.knowledge-content .sub-section { margin-bottom: 1.2rem; }
.knowledge-content table { width: 100%; border-collapse: collapse; margin: 0.5rem 0 1rem; font-size: 0.82rem; }
.knowledge-content table td, .knowledge-content table th { padding: 0.35rem 0.6rem; border: 1px solid var(--color-border-light); text-align: left; vertical-align: top; }
.knowledge-content table th { background: var(--color-bg-alt); font-weight: 600; font-size: 0.78rem; }
.knowledge-content .kw { font-weight: 700; color: var(--color-text); }
.knowledge-content .pinyin { font-size: 0.78rem; color: var(--color-text-muted); margin-left: 2px; }

.knowledge-panel-close { display: none; }

/* Mobile: bottom drawer */
@media (max-width: 768px) {
  .knowledge-btn { bottom: 4.5rem; right: 1rem; width: auto; min-width: 42px; padding: 0 0.75rem; }
  .knowledge-btn .kb-text { max-width: 140px; opacity: 1; }
  .knowledge-panel {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; max-width: 100%; max-height: 100vh;
    border-radius: 0; transform: translateY(100%);
    flex-direction: column;
  }
  .knowledge-panel.show { transform: translateY(0); }
  .knowledge-nav {
    width: 100%; min-width: 0; border-right: none;
    border-bottom: 1px solid var(--color-border-light);
    display: flex; overflow-x: auto; padding: 0; flex-shrink: 0;
  }
  .knowledge-nav-item { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; font-size: 0.78rem; padding: 0.6rem 0.75rem; }
  .knowledge-nav-item.active { border-left-color: transparent; border-bottom-color: var(--color-primary); }
  .knowledge-content { padding: 1rem; }
  .knowledge-panel-close {
    display: flex !important; align-items: center; justify-content: center;
    width: 100%; padding: 0.6rem;
    border: none; background: var(--color-bg-alt);
    color: var(--color-text); font-family: var(--font-body);
    font-size: 0.9rem; cursor: pointer;
    border-top: 1px solid var(--color-border);
  }
}

mark.search-highlight {
  background: var(--color-highlight);
  color: var(--color-highlight-text);
  padding: 1px 3px;
  border-radius: 2px;
  font-weight: 600;
}

/* ============================================
   Empty State
   ============================================ */
.empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  text-align: center;
}
.empty-state.active { display: flex; }
.empty-state .empty-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
  opacity: 0.4;
}
.empty-state h3 {
  font-size: 1.2rem;
  margin-bottom: 0.5rem;
  color: var(--color-text);
}
.empty-state p {
  font-size: 0.9rem;
  color: var(--color-text-secondary);
  max-width: 400px;
}

/* ============================================
   Pagination
   ============================================ */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 1.5rem 0 2rem;
  flex-wrap: wrap;
}
.pagination .page-btn {
  min-width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-btn-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all var(--transition-fast);
  padding: 0 0.6rem;
}
.pagination .page-btn:hover:not(:disabled):not(.active) {
  background: var(--color-btn-hover);
  border-color: var(--color-text-muted);
}
.pagination .page-btn.active {
  background: var(--color-btn-active);
  color: var(--color-btn-active-text);
  border-color: var(--color-btn-active);
  font-weight: 600;
}
.pagination .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.pagination .page-ellipsis {
  width: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-muted);
  font-size: 0.85rem;
}

/* ============================================
   Footer
   ============================================ */
.app-footer {
  background: var(--color-bg-alt);
  border-top: 1px solid var(--color-border-light);
  padding: 1.25rem 0;
  margin-top: auto;
}
.footer-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.75rem;
  font-size: 0.8rem;
  color: var(--color-text-muted);
}
.footer-notes { line-height: 1.6; }
.footer-changelog-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.25rem 0.7rem;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  background: var(--color-surface);
  color: var(--color-text-secondary);
  font-family: var(--font-body);
  font-size: 0.75rem;
  cursor: pointer;
  text-decoration: none;
  transition: all var(--transition-fast);
  white-space: nowrap;
}
.footer-changelog-btn:hover {
  color: var(--color-accent);
  border-color: var(--color-accent-light);
  background: var(--color-surface-hover);
}

/* ============================================
   Toast
   ============================================ */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--color-primary);
  color: var(--color-bg);
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius-lg);
  font-size: 0.85rem;
  font-family: var(--font-body);
  box-shadow: var(--shadow-lg);
  z-index: 500;
  transition: transform var(--transition-md);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ============================================
   Loading Spinner
   ============================================ */
.loading-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(2px);
  z-index: 50;
  align-items: center;
  justify-content: center;
}
.loading-overlay.active { display: flex; }
[data-theme="dark"] .loading-overlay { background: rgba(10,10,10,0.6); }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--color-border);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 1024px) {
  .app-container { padding: 0 1rem; }
  .header-inner { padding: 0 1rem; }
  .filter-inner { padding: 0 1rem; }
  .filter-tags { gap: 0.25rem; }
  .filter-tag { font-size: 0.75rem; padding: 0.25rem 0.55rem; }
  .table-wrapper { border-radius: var(--radius-sm); }
  .table-wrapper td, .table-wrapper th { padding: 0.45rem 0.6rem; font-size: 0.8rem; }
}

@media (max-width: 768px) {
  .header-brand h1 { font-size: 0.85rem; }
  .header-brand .brand-icon { width: 28px; height: 28px; font-size: 0.9rem; }
  .header-search { min-width: 160px; order: 10; flex-basis: 100%; }
  .header-search input { padding: 0.5rem 0.85rem 0.5rem 2.3rem; font-size: 0.85rem; }
  
  .filter-bar { top: auto; position: relative; }
  .filter-desktop { display: none; }
  .filter-toggle-mobile { display: flex; }
  .filter-panel-mobile, .filter-panel-overlay { display: block; }
  
  .stats-bar { flex-direction: column; align-items: flex-start; }
  .stats-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  
  .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-wrapper table { min-width: 900px; }
  .table-wrapper td, .table-wrapper th { padding: 0.4rem 0.5rem; font-size: 0.78rem; }
  
  .pagination { gap: 0.2rem; }
  .pagination .page-btn { min-width: 32px; height: 32px; font-size: 0.78rem; }
  
  .footer-inner { flex-direction: column; text-align: center; }
}

@media (max-width: 480px) {
  .header-inner { gap: 0.5rem; }
  .header-search input { font-size: 0.8rem; }
  .btn { padding: 0.35rem 0.7rem; font-size: 0.78rem; }
  .btn-icon { width: 34px; height: 34px; }
  .table-wrapper td, .table-wrapper th { font-size: 0.72rem; padding: 0.35rem 0.4rem; }
}

/* ============================================
   Print
   ============================================ */
@media print {
  .app-header, .filter-bar, .stats-bar, .pagination, .app-footer, .btn-icon, .filter-toggle-mobile { display: none !important; }
  .table-wrapper { box-shadow: none; border: 1px solid #ccc; }
  body { background: #fff; color: #000; }
}

/* ============================================
   v2.2 Motion & Polish
   主题切换平滑过渡 / 滚动进度条 / 表格行入场
   ============================================ */
body { transition: background-color 0.3s ease, color 0.3s ease; }
.table-wrapper, .filter-bar, .app-footer, .modal, .search-suggestions,
.knowledge-panel, .toast { transition-property: background-color, border-color, color, opacity, transform, visibility; }
.table-wrapper { transition-duration: 0.3s; }

/* 滚动进度条 (页面顶部 2px) */
.scroll-progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0;
  background: var(--color-primary);
  z-index: 400;
  transition: width 80ms linear;
  pointer-events: none;
}

/* 表格行入场 (渲染时整体淡入; 不对 tr 用 transform 以免破坏粘性年份列) */
.table-wrapper tbody { animation: tbodyFadeIn 0.25s var(--ease-spring); }
@keyframes tbodyFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* 尊重系统减少动画偏好 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* v3.0 导航下拉菜单 (说明文档) */
.nav-dropdown { position: relative; flex-shrink: 0; }
.nav-dropdown-btn {
  display: inline-flex; align-items: center; gap: 0.1rem;
  color: var(--color-text-muted); text-decoration: none;
  font-size: 0.85rem; font-weight: 500; font-family: var(--font-body);
  padding: 0.35rem 0.75rem; border-radius: var(--radius-sm);
  transition: all var(--transition-fast); white-space: nowrap;
  border: none; background: transparent; cursor: pointer;
}
.nav-dropdown-btn:hover { color: var(--color-text); background: var(--color-surface-hover); }
.nav-dropdown-btn.active { color: var(--color-text); background: var(--color-bg-alt); font-weight: 600; }
.nav-dropdown-btn svg { transition: transform var(--transition-fast); }
.nav-dropdown:hover .nav-dropdown-btn svg, .nav-dropdown:focus-within .nav-dropdown-btn svg { transform: rotate(180deg); }
.nav-dropdown-menu {
  position: absolute; top: 100%; left: 0; margin-top: 6px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  min-width: 132px; padding: 0.3rem;
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity 0.18s var(--ease-spring), visibility 0.18s var(--ease-spring), transform 0.18s var(--ease-spring);
  z-index: 210;
}
.nav-dropdown:hover .nav-dropdown-menu, .nav-dropdown:focus-within .nav-dropdown-menu {
  opacity: 1; visibility: visible; transform: translateY(0);
}
.nav-dropdown-menu a {
  display: block; padding: 0.45rem 0.75rem; border-radius: var(--radius-sm);
  color: var(--color-text-secondary); font-size: 0.85rem; text-decoration: none;
  transition: all var(--transition-fast); white-space: nowrap;
}
.nav-dropdown-menu a:hover { background: var(--color-surface-hover); color: var(--color-text); }
.nav-dropdown-menu a.active { color: var(--color-text); font-weight: 600; background: var(--color-bg-alt); }
/* 用户菜单（登录下拉，点击展开，含繁简切换） */
.user-dropdown { position: relative; }
.user-btn { display: flex; align-items: center; cursor: pointer; }
.user-login-link { color: inherit; text-decoration: none; }
.user-login-link:hover { text-decoration: none; }
.user-menu { right: 0; left: auto; min-width: 168px; }
/* 点击展开（非 hover）: .open 时显示 */
.user-dropdown .user-menu { opacity: 0; visibility: hidden; transform: translateY(-6px); transition: opacity 0.18s var(--ease-spring), visibility 0.18s var(--ease-spring), transform 0.18s var(--ease-spring); }
.user-dropdown:hover .user-menu, .user-dropdown:focus-within .user-menu { opacity: 0; visibility: hidden; transform: translateY(-6px); } /* 覆盖 nav-dropdown 的 hover 展开 */
.user-dropdown.open .user-menu { opacity: 1; visibility: visible; transform: translateY(0); }
.user-dropdown.open .user-btn svg { transform: rotate(180deg); }
.user-menu-section { padding: 0.45rem 0.75rem; }
.user-menu-label {
  display: block; font-size: 0.72rem; color: var(--color-text-muted);
  margin-bottom: 0.4rem; letter-spacing: 0.02em;
}
.user-menu .lang-switch { width: 100%; }
.user-menu .lang-switch button { flex: 1; }
.user-menu-login { border-top: 1px solid var(--color-border); margin-top: 0.25rem; padding-top: 0.5rem !important; border-radius: 0 0 var(--radius-sm) var(--radius-sm) !important; }
.user-menu-settings{border-top:1px solid var(--color-border);margin-top:.25rem;padding-top:.5rem !important;border-radius:0 0 var(--radius-sm) var(--radius-sm) !important}

/* ============================================
   快捷筛选浮窗 (V5.1)
   ============================================ */
.qf-wrap { position: relative; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.qf-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.45rem 1rem; font-size: 0.85rem; font-family: var(--font-body);
  color: var(--color-text); background: var(--color-btn-bg);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  cursor: pointer; transition: all var(--transition-fast);
  white-space: nowrap;
}
.qf-btn:hover { background: var(--color-btn-hover); border-color: var(--color-scrollbar-hover); transform: translateY(-1px); }
.qf-btn:active { transform: scale(0.97); }
.qf-btn svg { transition: transform var(--transition-fast); }
.qf-wrap.open .qf-btn svg { transform: rotate(180deg); }
.qf-chips { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
.qf-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.82rem; padding: 0.32rem 0.8rem; border-radius: 999px;
  cursor: pointer; transition: all var(--transition-fast); white-space: nowrap;
}
.qf-chip.qf-chip-dyn { background: var(--color-bg-alt); color: var(--color-text); border: 1px solid var(--color-border); font-weight: 600; }
.qf-chip.qf-chip-era { background: var(--color-surface); color: var(--color-text-secondary); border: 1px solid var(--color-border); }
.qf-chip .qf-chip-x { opacity: 0.55; font-size: 0.85em; line-height: 1; }
.qf-chip:hover .qf-chip-x { opacity: 1; }
.qf-chip:hover { border-color: var(--color-scrollbar-hover); }
.qf-clear {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; border-radius: var(--radius-sm);
  color: var(--color-text-muted); background: var(--color-btn-bg);
  border: 1px solid var(--color-border); cursor: pointer; transition: all var(--transition-fast);
}
.qf-clear:hover { color: #dc2626; border-color: #dc2626; background: var(--color-btn-hover); }
/* 浮窗面板 */
.qf-panel {
  position: absolute; top: calc(100% + 8px); left: 0; z-index: 300;
  display: flex; background: var(--color-surface);
  border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); overflow: hidden;
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity 0.18s var(--ease-spring), visibility 0.18s var(--ease-spring), transform 0.18s var(--ease-spring);
  max-width: min(720px, calc(100vw - 2rem));
}
.qf-wrap.open .qf-panel { opacity: 1; visibility: visible; transform: translateY(0); }
.qf-col-dyn {
  flex: 0 0 160px; border-right: 1px solid var(--color-border);
  background: var(--color-bg-alt); padding: 0.6rem; overflow-y: auto; max-height: 420px;
}
.qf-dyn-label { font-size: 0.72rem; color: var(--color-text-muted); padding: 0.2rem 0.55rem 0.45rem; letter-spacing: 0.02em; }
.qf-dyn-item {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.88rem; padding: 0.42rem 0.65rem; border-radius: var(--radius-sm);
  color: var(--color-text-secondary); cursor: pointer; transition: all var(--transition-fast);
  user-select: none;
}
.qf-dyn-item:hover { background: var(--color-surface-hover); color: var(--color-text); }
.qf-dyn-item.viewing { background: var(--color-surface); color: var(--color-text); font-weight: 600; }
.qf-dyn-item.selected { color: var(--color-primary); font-weight: 600; }
.qf-dyn-item.selected::after { content: '✓'; font-size: 0.78rem; }
.qf-dyn-sep { height: 1px; background: var(--color-border); margin: 0.4rem 0.3rem; }
.qf-col-era { flex: 1; min-width: 380px; padding: 0.75rem 0.9rem; overflow-y: auto; max-height: 420px; }
.qf-era-empty { font-size: 0.85rem; color: var(--color-text-muted); padding: 2.5rem 1rem; text-align: center; }
.qf-era-label { font-size: 0.72rem; color: var(--color-text-muted); margin-bottom: 0.6rem; letter-spacing: 0.02em; }
.qf-emperor { margin-bottom: 0.95rem; }
.qf-emperor-name { font-size: 0.9rem; font-weight: 600; color: var(--color-text); margin-bottom: 0.4rem; }
.qf-emperor-name .qf-emperor-given { font-size: 0.76rem; font-weight: 400; color: var(--color-text-muted); margin-left: 0.4rem; }
.qf-era-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.qf-era-tag {
  font-size: 0.82rem; padding: 0.24rem 0.7rem; border-radius: 999px;
  border: 1px solid var(--color-border); color: var(--color-text-secondary);
  background: var(--color-surface); cursor: pointer; transition: all var(--transition-fast);
  user-select: none;
}
.qf-era-tag:hover { border-color: var(--color-scrollbar-hover); color: var(--color-text); }
.qf-era-tag.selected { background: var(--color-primary); color: var(--color-bg); border-color: var(--color-primary); font-weight: 600; }

/* V8.3: 整朝筛选操作条 (右列顶部) */
.qf-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.75rem; padding-bottom: 0.65rem; border-bottom: 1px dashed var(--color-border); }
.qf-act-btn {
  font-size: 0.78rem; padding: 0.28rem 0.75rem; border-radius: 999px;
  border: 1px solid var(--color-border); background: var(--color-surface);
  color: var(--color-text-secondary); cursor: pointer; transition: all var(--transition-fast);
  user-select: none;
}
.qf-act-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
.qf-act-btn.active { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); font-weight: 600; }
.qf-act-hint { font-size: 0.7rem; color: var(--color-text-muted); width: 100%; }

/* ============================================
   V8.2 移动端适配覆盖层 (≤768px)
   桌面端 (>768px) 架构 100% 不变
   ============================================ */
/* ---- 汉堡按钮 (默认隐藏, ≤768px 显示) ---- */
.m-hamburger {
  display: none;
  width: 40px; height: 40px; flex-shrink: 0;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); cursor: pointer;
  align-items: center; justify-content: center;
  color: var(--color-text);
}
.m-hamburger:hover { background: var(--color-surface-hover); }
.m-hamburger svg { display: block; }

/* ---- 抽屉遮罩 ---- */
.drawer-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 900;
  background: rgba(0,0,0,0.45);
  opacity: 0; visibility: hidden;
  transition: opacity var(--transition-md), visibility var(--transition-md);
}
.drawer-overlay.open { opacity: 1; visibility: visible; }

/* ---- 右滑抽屉 ---- */
.drawer {
  display: none;
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 950;
  width: min(78vw, 320px);
  background: var(--color-surface);
  border-left: 1px solid var(--color-border);
  box-shadow: var(--shadow-lg);
  transform: translateX(105%);
  transition: transform var(--transition-md) var(--ease-spring);
  overflow-y: auto;
  padding: 1rem 0.9rem 2rem;
  flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-brand {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.5rem 0.4rem 1rem; border-bottom: 1px solid var(--color-border);
  margin-bottom: 0.8rem;
}
.drawer-brand .brand-icon {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  background: var(--color-primary); color: var(--color-bg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 0.95rem;
}
.drawer-brand h2 { font-size: 0.92rem; font-weight: 600; margin: 0; }
.drawer-nav { display: flex; flex-direction: column; gap: 0.1rem; }
.drawer-nav-group { font-size: 0.72rem; color: var(--color-text-muted); padding: 0.8rem 0.4rem 0.3rem; letter-spacing: 0.03em; }
.drawer-link {
  display: flex; align-items: center; gap: 0.55rem;
  padding: 0.65rem 0.6rem; border-radius: var(--radius-md);
  font-size: 0.92rem; color: var(--color-text);
  text-decoration: none; transition: all var(--transition-fast);
}
.drawer-link:hover { background: var(--color-surface-hover); }
.drawer-link.active { background: var(--color-bg-alt); font-weight: 600; }
.drawer-user { margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 0.5rem; }
.drawer-user .lang-switch { display: flex; gap: 0.3rem; }

/* ---- 卡片视图 (桌面与移动共用, 默认隐藏, body.view-card 或 ≤768px 显示) ---- */
/* V8.3: 桌面卡片改为横向网格排布 (4列/6列可切换, 由 body 类控制) */
.card-view { display: none; flex-direction: column; gap: 0.85rem; }
body.view-card .table-wrapper { display: none !important; }
body.view-card .card-view { display: flex; }
/* 桌面网格: 默认 4 列; body.card-cols-6 时为 6 列; ≤1280px 自动降列数; 移动端保持单列 */
body.view-card .card-view {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: start;
}
body.view-card.card-cols-6 .card-view { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1280px) {
  body.view-card .card-view { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  body.view-card.card-cols-6 .card-view { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  body.view-card .card-view, body.view-card.card-cols-6 .card-view { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 768px) {
  body.view-card .card-view, body.view-card.card-cols-6 .card-view { grid-template-columns: 1fr; }
}
/* 分隔行在网格中跨整行 */
.card-sep { grid-column: 1 / -1; }
.year-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 0.85rem 0.9rem;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-fast);
}
.year-card:hover { box-shadow: var(--shadow-md); }
.year-card.precise { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.yc-top { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.yc-year { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.yc-year.bc { color: var(--color-china-accent); }
.yc-ganzhi { font-size: 0.92rem; font-weight: 600; color: var(--color-text-secondary); }
.yc-zodiac { font-size: 0.75rem; color: var(--color-text-muted); }
.yc-block { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0.5rem 0.65rem; margin-bottom: 0.45rem; }
.yc-block.jp { border-color: var(--color-japan-accent); }
.yc-block-label { font-size: 0.68rem; color: var(--color-text-muted); letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.yc-era-row { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; padding: 0.2rem 0; flex-wrap: wrap; }
.yc-era-name { font-size: 0.9rem; font-weight: 600; }
.yc-era-name .era-flash { animation: eraFlash 1.6s ease-in-out infinite; }
@keyframes eraFlash { 0%,100% { background: transparent; } 50% { background: rgba(255, 193, 7, 0.35); } }
.yc-copy {
  font-size: 0.66rem; padding: 0.14rem 0.45rem;
  border: 1px solid var(--color-border); border-radius: 999px;
  background: var(--color-bg-alt); color: var(--color-text-secondary);
  cursor: pointer; transition: all var(--transition-fast);
}
.yc-copy:hover { border-color: var(--color-accent); color: var(--color-accent); }
.yc-copy.copied { background: var(--color-accent); color: var(--color-bg); }
.yc-meta { font-size: 0.75rem; color: var(--color-text-muted); }
.yc-notes { font-size: 0.78rem; color: var(--color-text-secondary); padding-top: 0.3rem; border-top: 1px dashed var(--color-border); margin-top: 0.4rem; }
.yc-empty { font-size: 0.82rem; color: var(--color-text-muted); padding: 0.3rem 0; }
.yc-empty .yc-dash { color: var(--color-text-muted); }
/* V8.3: 卡片内年号行 (表格 .era-entry 结构复用, 含独立复制按钮) */
.yc-era-rows { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.15rem 0; }
.card-view .era-entry { display: flex; align-items: center; gap: 3px; padding: 1px 0; }
.card-view .era-copy-btn { opacity: 1; } /* 卡片内复制按钮常显 */

/* ---- 大事记区块 (表格子行 + 卡片区块共用) ---- */
.events-block { padding: 0.4rem 0.2rem; }
.events-block-title { font-size: 0.74rem; font-weight: 600; color: var(--color-accent); letter-spacing: 0.05em; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
.events-block-title::before { content: '◆'; font-size: 0.6rem; }
.event-item { padding: 0.45rem 0; border-bottom: 1px dashed var(--color-border); }
.event-item:last-child { border-bottom: none; }
.event-title { font-size: 0.9rem; font-weight: 600; }
.event-title mark { background: rgba(255, 193, 7, 0.3); }
.event-desc { font-size: 0.82rem; color: var(--color-text-secondary); margin-top: 0.2rem; line-height: 1.55; }
.event-desc mark { background: rgba(255, 193, 7, 0.3); }
.event-meta { font-size: 0.7rem; color: var(--color-text-muted); margin-top: 0.25rem; }
.event-subrow td { background: var(--color-bg-alt); }
.yc-events { margin-top: 0.55rem; padding-top: 0.5rem; border-top: 1px dashed var(--color-border); }

/* ---- 视图切换控件 ---- */
.view-mode-switch { display: inline-flex; align-items: center; gap: 0.2rem; margin-left: 0.9rem; background: var(--color-bg-alt); border: 1px solid var(--color-border); border-radius: 999px; padding: 0.15rem; }
.view-mode-switch button {
  border: none; background: transparent; color: var(--color-text-muted);
  font-size: 0.74rem; padding: 0.3rem 0.7rem; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.3rem; transition: all var(--transition-fast);
}
.view-mode-switch button.active { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); font-weight: 600; }
/* V8.3: 卡片列数切换 (视图切换组内分隔) */
.card-cols-switch { display: inline-flex; align-items: center; gap: 0.15rem; margin-left: 0.35rem; padding-left: 0.35rem; border-left: 1px solid var(--color-border); }
.card-cols-btn {
  border: none; background: transparent; color: var(--color-text-muted);
  font-size: 0.72rem; padding: 0.22rem 0.5rem; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; transition: all var(--transition-fast);
  font-variant-numeric: tabular-nums;
}
.card-cols-btn:hover { color: var(--color-text); background: var(--color-surface-hover); }
.card-cols-btn.active { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-sm); font-weight: 600; }
@media (max-width: 768px) {
  .card-cols-switch { display: none !important; }
}

/* ---- ≤768px 覆盖: 汉堡显示 / 桌面导航隐藏 / 表格强制卡片 / qf 底部抽屉 ---- */
@media (max-width: 768px) {
  .m-hamburger { display: inline-flex; }
  .drawer-overlay, .drawer { display: block; }
  .header-inner .header-nav { display: none !important; }
  .header-search { order: 3; }
  .header-actions .user-dropdown { display: none !important; }
  
  /* 修复: 旧移动筛选遮罩仅打开时显示, 平时不遮挡点击 */
  .filter-panel-overlay { display: none; }
  .filter-panel-overlay.open { display: block; }
  .filter-panel-mobile { display: none; }
  .filter-panel-mobile.open { display: block; }
  
  /* 强制卡片 (不依赖 body 类) */
  .table-wrapper { display: none !important; }
  .card-view { display: flex !important; }
  .empty-state { display: block; }
  
  /* qf 快捷筛选 → 底部全屏抽屉 */
  .qf-panel {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: 100%; max-height: 78vh;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
    z-index: 980;
    transform: translateY(105%);
    transition: transform var(--transition-md) var(--ease-spring);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex; flex-direction: column;
  }
  .qf-panel.open { transform: translateY(0); }
  .qf-col-dyn { min-width: 0; width: 50%; }
  .qf-col-era { min-width: 0; width: 50%; max-height: none; }
  .qf-wrap .qf-chips { display: none; }
  
  .stats-bar .view-mode-switch { display: none; } /* 移动端无需切换 (强制卡片) */
  
  /* 卡片内触控友好 */
  .year-card { padding: 0.8rem 0.9rem; }
  .yc-copy { padding: 0.28rem 0.7rem; font-size: 0.75rem; }
}

/* ============================================================
   v3 视觉对齐（纪年查询区）
   —— 令牌取自 设计原型\桌面版-v3.html :root
   —— 白卡无描边 + 轻阴影 / 圆角四档 / 灰阶层级
   ============================================================ */
:root{
  --v3-bg-page:#F2F3F5; --v3-card:#FFFFFF; --v3-fill:#F2F3F5; --v3-hover:#F7F8F9; --v3-badge:#EDEEF0;
  --v3-t1:#171A1F; --v3-t2:#5F6672; --v3-t3:#8F959E; --v3-t4:#C2C6CC; --v3-divider:#F0F1F3;
  --v3-r-card:24px; --v3-r-mid:18px; --v3-r-pill:999px;
  --v3-shadow-card:0 6px 20px rgba(0,0,0,.06);
  --v3-shadow-float:0 20px 50px rgba(0,0,0,.18);
}
[data-theme="dark"]{
  --v3-bg-page:#0A0A0A; --v3-card:#171717; --v3-fill:#1F1F1F; --v3-hover:#262626; --v3-badge:#262626;
  --v3-t1:#FAFAFA; --v3-t2:#D4D4D4; --v3-t3:#A3A3A3; --v3-t4:#737373; --v3-divider:rgba(255,255,255,.08);
  --v3-shadow-card:0 6px 20px rgba(0,0,0,.5);
  --v3-shadow-float:0 20px 50px rgba(0,0,0,.65);
}
body{ background: var(--v3-bg-page); }

/* ===== 页头（v3 phead） ===== */
.page-head{ display:flex; align-items:flex-start; gap:16px; margin:24px 0 16px; flex-wrap:wrap; }
.page-head .ph-text{ flex:1; min-width:0; }
.page-head h2{ font-size:20px; font-weight:700; color:var(--v3-t1); margin:0 0 4px; letter-spacing:-.01em; line-height:1.35; }
.page-head p{ margin:0; font-size:12px; color:var(--v3-t3); line-height:1.7; max-width:900px; }
.page-head p b{ color:var(--v3-t2); font-weight:600; }
.page-head .ph-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; flex:0 0 auto; }
.ph-chip{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 12px; border-radius:var(--v3-r-pill); background:var(--v3-badge); color:var(--v3-t2); font-size:11.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.ph-chip b{ color:var(--v3-t1); font-weight:600; }

/* ===== 统计/工具条 → v3 白卡 ===== */
.app-container{ padding:0 28px 12px; }
.stats-bar{ background:var(--v3-card); border-radius:var(--v3-r-card); box-shadow:var(--v3-shadow-card); padding:12px 16px; margin-bottom:16px; }
.stats-info{ font-size:12.5px; color:var(--v3-t2); }
.stats-info strong{ color:var(--v3-t1); font-weight:600; font-variant-numeric:tabular-nums; }
.ft-badge{ display:inline-block; margin-left:8px; padding:1px 8px; border-radius:6px; background:var(--v3-fill); color:var(--v3-t2); font-size:11px; font-weight:500; vertical-align:1px; }
.ft-badge[hidden]{ display:none; }
.view-mode-switch{ background:var(--v3-badge); border:0; border-radius:var(--v3-r-pill); }
.view-mode-switch button{ color:var(--v3-t2); border-radius:var(--v3-r-pill); font-size:11.5px; }
.view-mode-switch button.active{ background:var(--v3-card); color:var(--v3-t1); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.stats-actions > span{ font-size:11.5px; color:var(--v3-t3); }
.per-page-select{ border:0; background:var(--v3-badge); border-radius:var(--v3-r-pill); padding:0.34rem 0.7rem; font-size:12px; color:var(--v3-t2); }
.btn{ border:0; border-radius:var(--v3-r-pill); background:var(--v3-badge); color:var(--v3-t1); font-size:12.5px; padding:0.42rem 0.95rem; }
.btn:hover{ background:#E2E4E8; border:0; transform:none; }
[data-theme="dark"] .btn:hover{ background:#33363C; }
.qf-btn{ border-radius:var(--v3-r-pill); }
.qf-chip{ border-radius:var(--v3-r-pill); }

/* ===== 表格 → v3 白卡 + 轻表头 ===== */
.table-wrapper{ border:0; border-radius:var(--v3-r-card); box-shadow:var(--v3-shadow-card); background:var(--v3-card); }
.table-wrapper th{
  background:var(--v3-card); color:var(--v3-t3);
  font-size:11.5px; font-weight:500; padding:14px 12px 10px;
  border-bottom:1px solid var(--v3-divider); letter-spacing:.02em;
}
.table-wrapper th.sortable:hover{ background:var(--v3-hover); color:var(--v3-t1); }
.table-wrapper th.col-year{ background:var(--v3-card); }
.table-wrapper td{
  padding:9px 12px; font-size:12.5px; line-height:1.6;
  border-bottom:1px solid var(--v3-divider); color:var(--v3-t1); vertical-align:middle;
}
.table-wrapper tbody tr:nth-child(even) td{ background:transparent; }
.table-wrapper tbody tr:nth-child(even) td.cell-year{ background:var(--v3-card); }
.table-wrapper tbody tr:hover td{ background:var(--v3-hover); }
.table-wrapper tbody tr:hover td.cell-year{ background:var(--v3-hover); }
.table-wrapper tbody tr:last-child td{ border-bottom:0; }
td.cell-year{ background:var(--v3-card); color:var(--v3-t1); font-size:12.5px; }
td.cell-ganzhi{ color:var(--v3-t2); }
td.cell-notes{ font-size:11.5px; color:var(--v3-t2); }
td.cell-cn-era,td.cell-jp-era{ color:var(--v3-t1); }
tr.nearby-row td{ background:color-mix(in srgb,var(--v3-bg-page) 60%,transparent) !important; }
tr.nearby-row td.cell-year{ background:color-mix(in srgb,var(--v3-bg-page) 60%,transparent) !important; }
tr.typo-hit-row td{ background:color-mix(in srgb,var(--v3-t1) 6%,var(--v3-card)) !important; }
.era-copy-btn:hover{ background:var(--v3-hover); border-color:var(--v3-divider); color:var(--v3-t1); }
.ot-state-tag{ background:var(--v3-fill); color:var(--v3-t2); border-radius:6px; }

/* ===== 分页 → v3 胶囊 ===== */
.pagination{ padding:22px 0 28px; gap:6px; }
.pagination .page-btn{ min-width:32px; height:32px; border:0; border-radius:10px; background:var(--v3-badge); color:var(--v3-t2); font-size:12px; padding:0 0.55rem; }
.pagination .page-btn:hover:not(:disabled):not(.active){ background:#E2E4E8; border:0; color:var(--v3-t1); }
[data-theme="dark"] .pagination .page-btn:hover:not(:disabled):not(.active){ background:#33363C; }
.pagination .page-btn.active{ background:var(--v3-t1); color:var(--v3-bg-page); border:0; font-weight:600; }
.pagination .page-btn:disabled{ opacity:.4; }
.pagination .page-ellipsis{ width:32px; color:var(--v3-t3); }

/* ===== 空状态 / 加载遮罩 ===== */
.empty-state{ background:var(--v3-card); border-radius:var(--v3-r-card); box-shadow:var(--v3-shadow-card); margin-top:4px; }
.loading-overlay{ border-radius:var(--v3-r-card); }

/* ===== 顶部导航/搜索 → v3 圆角 ===== */
.app-header{ background:color-mix(in srgb,var(--v3-bg-page) 82%,transparent); border-bottom:1px solid var(--v3-divider); }
.header-inner{ padding:0 28px; }
.header-brand h1{ font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:-.01em; }
.header-brand .brand-icon{ border-radius:9px; }
.header-nav{ gap:.15rem; }
.header-nav .nav-link{ border-radius:var(--v3-r-pill); font-size:12px; padding:0.38rem 0.7rem; }
.header-nav .nav-link:hover{ background:var(--v3-badge); }
.header-nav .nav-link.active{ background:var(--v3-badge); }
.header-search input{
  border:0; border-radius:var(--v3-r-pill); background:var(--v3-badge);
  font-size:13px; padding:0.42rem 4.5rem 0.42rem 2.6rem; color:var(--v3-t1);
}
.header-search input::placeholder{ color:var(--v3-t3); }
.header-search input:hover{ border:0; }
.header-search input:focus{ background:var(--v3-card); box-shadow:0 0 0 1px var(--v3-t4),0 0 0 3px var(--v3-fill); }
.header-search .search-btn{ border-radius:var(--v3-r-pill); background:var(--v3-t1); color:var(--v3-bg-page); font-size:12px; right:4px; }
.header-search .search-btn:hover{ background:var(--v3-t1); opacity:.88; }
.lang-switch{ border:0; background:var(--v3-badge); border-radius:var(--v3-r-pill); }
.lang-switch button{ border-radius:var(--v3-r-pill); }
.lang-switch button.active{ background:var(--v3-card); color:var(--v3-t1); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.btn-icon{ border:0; background:var(--v3-badge); border-radius:var(--v3-r-pill); color:var(--v3-t2); }
.btn-icon:hover{ background:#E2E4E8; border:0; }
[data-theme="dark"] .btn-icon:hover{ background:#33363C; }
.search-suggestions{ border:0; border-radius:var(--v3-r-mid); box-shadow:var(--v3-shadow-float); }
.nav-dropdown-menu{ border:0; border-radius:var(--v3-r-mid); box-shadow:var(--v3-shadow-float); }

/* ===== 全表浏览模式（默认） ===== */
body.is-full-table .per-page-wrap{ display:none; }
body.is-full-table .pagination{ display:none !important; }
.ft-hint{ display:none; font-size:11.5px; color:var(--v3-t3); }
body.is-full-table .ft-hint{ display:inline; }
/* 「加载全部年份」按钮：仅全表且尚未全量时显示 */
.ft-load-all{ font-size:12px; }
.ft-load-all[hidden]{ display:none !important; }
.ft-load-all:disabled{ opacity:.65; cursor:default; }
body.ft-all-loaded .ft-load-all{ display:none !important; }

/* ===== 窄屏 ===== */
@media (max-width: 768px){
  .app-container{ padding:0 16px 8px; }
  .header-inner{ padding:0 16px; }
  .page-head{ margin:18px 0 12px; gap:10px; }
  .page-head h2{ font-size:18px; }
  .page-head p{ font-size:11.5px; }
  .ph-chip{ display:none; }
  .stats-bar{ padding:10px 12px; border-radius:var(--v3-r-mid); }
  .stats-bar .stats-actions > span,
  .stats-bar .per-page-wrap{ display:none; }
  .table-wrapper{ border-radius:var(--v3-r-mid); }
}

/* ============================================================
   v3 版式 —— 纪年查询（query 视图）
   依据 设计原型\桌面版-v3.html：灰底白卡 / 圆角 24·18 / 字阶 20·13.5·12.5·11.5
   —— 卡片白底无描边 + 轻阴影；分段控件浅灰底 pill + 白色选中
   ============================================================ */
:root{
  --v3-pad-card:20px; --v3-gap-card:16px;
}
[data-theme="dark"]{
  --v3-hover2:#33363C;
}

/* ---- 桌面内嵌：站点顶栏 / 页脚完全不出现（网页版可保留） ---- */
html.is-embed .app-header{ display:none !important; }
html.is-embed .app-footer{ display:none !important; }

/* ---- 网页版精简顶栏：仅品牌 + 简繁（导航/登录/主题已移除） ---- */
.app-header{
  background:var(--v3-card); border-bottom:1px solid var(--v3-divider);
  padding:0; backdrop-filter:none; -webkit-backdrop-filter:none; animation:none;
}
.header-inner{ max-width:none; padding:0 28px; height:56px; display:flex; align-items:center; gap:12px; flex-wrap:nowrap; }
.header-brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; text-decoration:none; color:inherit; }
.header-brand .brand-icon{ width:28px; height:28px; border-radius:8px; }
.header-brand h1{ font-family:var(--font-body); font-size:13.5px; font-weight:600; color:var(--v3-t1); letter-spacing:-.01em; }
.web-topbar-sep{ width:1px; height:16px; background:var(--v3-divider); flex:0 0 1px; }
.web-topbar-page{ font-size:12px; color:var(--v3-t3); white-space:nowrap; }
.header-inner .lang-switch{ margin-left:auto; display:inline-flex; align-items:center; gap:0; padding:3px; border:0; border-radius:var(--v3-r-pill); background:var(--v3-badge); overflow:visible; }
.header-inner .lang-switch button{ border:0; background:none; color:var(--v3-t2); border-radius:var(--v3-r-pill); font-family:var(--font-body); font-size:11.5px; font-weight:500; padding:4px 11px; line-height:1.2; cursor:pointer; }
.header-inner .lang-switch button.active{ background:var(--v3-card); color:var(--v3-t1); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }

/* ---- 页头（v3 phead） ---- */
.app-container{ max-width:1400px; padding:0 28px 24px; }
.page-head{ display:flex; align-items:flex-start; gap:16px; padding:24px 2px 18px; margin:0; flex-wrap:wrap; }
.page-head .ph-text{ flex:1 1 320px; min-width:0; }
.page-head h2{ font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--v3-t1); margin:0 0 4px; line-height:1.35; letter-spacing:-.01em; }
.page-head p{ font-size:12px; color:var(--v3-t3); line-height:1.7; max-width:880px; margin:0; }
.page-head p b{ color:var(--v3-t2); font-weight:600; }
.page-head .ph-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; flex:0 0 auto; }

/* ---- v3 按钮 / 分段控件 ---- */
.btn{
  height:36px; padding:0 16px; border:0; border-radius:var(--v3-r-pill);
  background:var(--v3-badge); color:var(--v3-t1); font-family:var(--font-body);
  font-size:13.5px; font-weight:500; display:inline-flex; align-items:center;
  justify-content:center; gap:7px; cursor:pointer; white-space:nowrap;
  transition:background var(--transition-fast);
}
.btn:hover{ background:#E2E4E8; border:0; transform:none; }
.btn:active{ transform:none; background:#DDE0E4; }
.btn.primary{ background:var(--v3-t1); color:var(--v3-bg-page); font-weight:600; }
.btn.primary:hover{ background:var(--v3-t2); }
.btn.ghost{ background:var(--v3-badge); }
.btn.sm{ height:30px; padding:0 12px; font-size:12px; }
[data-theme="dark"] .btn{ background:var(--v3-badge); color:var(--v3-t1); }
[data-theme="dark"] .btn:hover{ background:var(--v3-hover2); }
[data-theme="dark"] .btn.primary{ background:var(--v3-t1); color:#0A0A0A; }

.seg{ display:inline-flex; align-items:center; padding:3px; border:0; border-radius:var(--v3-r-pill); background:var(--v3-badge); }
.seg > button, .view-mode-switch button{
  height:30px; padding:0 14px; border:0; background:none; border-radius:var(--v3-r-pill);
  font-family:var(--font-body); font-size:12px; font-weight:500; color:var(--v3-t2);
  cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
}
.seg > button.on, .seg > button.active, .view-mode-switch button.active{
  background:var(--v3-card); color:var(--v3-t1); font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.view-mode-switch{ margin:0; gap:0; border:0; background:var(--v3-badge); }
.view-mode-switch svg{ width:13px; height:13px; }
.card-cols-switch{ display:inline-flex; align-items:center; gap:2px; margin:0; padding:0 0 0 8px; border-left:1px solid var(--v3-divider); }
.card-cols-btn{
  height:24px; padding:0 8px; border:0; background:none; border-radius:var(--v3-r-pill);
  font-family:var(--font-body); font-size:11px; color:var(--v3-t3); cursor:pointer;
}
.card-cols-btn.active{ background:var(--v3-card); color:var(--v3-t1); box-shadow:0 1px 3px rgba(0,0,0,.08); }

/* ---- 搜索行（v3 searchrow：圆角大输入框 + 检索 + 清除） ---- */
.searchrow{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--v3-card); border-radius:var(--v3-r-card);
  box-shadow:var(--v3-shadow-card); padding:14px 16px; margin-bottom:var(--v3-gap-card);
}
.searchrow .field{
  position:relative; display:flex; align-items:center; gap:9px;
  height:40px; flex:1 1 300px; min-width:0; padding:0 14px;
  background:var(--v3-fill); border-radius:var(--v3-r-mid);
}
.searchrow .field .field-ic{ width:16px; height:16px; flex:0 0 16px; fill:none; stroke:var(--v3-t3); stroke-width:1.9; }
.searchrow .field input{
  flex:1 1 auto; min-width:0; width:100%; border:0; outline:none; background:none;
  font-family:var(--font-body); font-size:13.5px; color:var(--v3-t1); padding:0;
}
.searchrow .field input::placeholder{ color:var(--v3-t3); }
.searchrow .btn{ height:40px; padding:0 20px; }
.searchrow .qf-wrap{ margin-left:auto; }
.searchrow .qf-btn{
  height:36px; padding:0 14px; border:0; border-radius:var(--v3-r-pill);
  background:var(--v3-badge); color:var(--v3-t1); font-family:var(--font-body);
  font-size:12.5px; font-weight:500; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  white-space:nowrap;
}
.searchrow .qf-btn:hover{ background:#E2E4E8; border:0; transform:none; }
.searchrow .qf-clear{ background:var(--v3-badge); border:0; border-radius:var(--v3-r-pill); }
[data-theme="dark"] .searchrow .field{ background:#1F1F1F; }
[data-theme="dark"] .searchrow .qf-btn:hover{ background:var(--v3-hover2); }
[data-theme="dark"] .qf-clear{ background:var(--v3-badge); color:var(--v3-t2); }
/* 桌面端筛选浮窗右对齐到按钮，避免溢出页面右侧 */
@media (min-width: 769px){
  .searchrow .qf-panel{ left:auto; right:0; }
}
/* 筛选浮窗的 v3 外观 */
.searchrow .qf-panel{ border:0; border-radius:var(--v3-r-mid); background:var(--v3-card); box-shadow:var(--v3-shadow-float); }
.searchrow .qf-col-dyn{ background:var(--v3-fill); border-right:1px solid var(--v3-divider); }
.searchrow .qf-dyn-label{ color:var(--v3-t3); }
.searchrow .qf-dyn-item{ color:var(--v3-t2); border-radius:8px; }
.searchrow .qf-dyn-item:hover{ background:var(--v3-hover); color:var(--v3-t1); }
.searchrow .qf-dyn-item.viewing{ background:var(--v3-card); color:var(--v3-t1); }
.searchrow .qf-era-empty, .searchrow .qf-era-label{ color:var(--v3-t3); }
.searchrow .qf-era-tag{ border:0; background:var(--v3-fill); color:var(--v3-t2); border-radius:var(--v3-r-pill); }
.searchrow .qf-era-tag:hover{ background:var(--v3-badge); color:var(--v3-t1); }
.searchrow .qf-era-tag.selected{ background:var(--v3-t1); color:var(--v3-bg-page); }
.searchrow .qf-act-btn{ border:0; background:var(--v3-fill); color:var(--v3-t2); border-radius:var(--v3-r-pill); }
.searchrow .qf-act-btn.active{ background:var(--v3-t1); color:var(--v3-bg-page); }
.searchrow .qf-emperor-name{ color:var(--v3-t1); }
.searchrow .qf-chip{ border:0; border-radius:var(--v3-r-pill); font-size:11.5px; padding:5px 11px; }
.searchrow .qf-chip.qf-chip-dyn{ background:var(--v3-badge); color:var(--v3-t1); }
.searchrow .qf-chip.qf-chip-era{ background:var(--v3-fill); color:var(--v3-t2); }
.searchrow .qf-clear{ width:32px; height:32px; border:0; border-radius:var(--v3-r-pill); background:var(--v3-badge); color:var(--v3-t3); }
.searchrow .qf-clear:hover{ background:#FBE3E4; color:#C0392B; }

/* 搜索建议：挂在输入框下方 */
.search-suggestions{
  top:calc(100% + 8px); left:0; right:0; margin-top:0;
  border:0; border-radius:var(--v3-r-mid); background:var(--v3-card);
  box-shadow:var(--v3-shadow-float); z-index:260;
}
.search-suggestion-item{ font-size:13px; border-bottom:1px solid var(--v3-divider); }
.search-suggestion-item:hover, .search-suggestion-item.focused{ background:var(--v3-hover); }
.search-suggestion-item mark{ background:var(--v3-badge); color:var(--v3-t1); }

/* ---- 结果白卡 + 卡头（「1600 年 · 4 条」/ 排序说明） ---- */
.result-card{
  background:var(--v3-card); border-radius:var(--v3-r-card);
  box-shadow:var(--v3-shadow-card); padding:var(--v3-pad-card);
  margin-bottom:var(--v3-gap-card);
}
.result-card .card-h{ display:flex; align-items:baseline; justify-content:space-between; gap:10px 16px; margin-bottom:12px; flex-wrap:wrap; }
.result-card .ch-left{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; min-width:0; }
.result-card .card-title{ font-size:15px; font-weight:600; color:var(--v3-t1); }

<script>
(function() {
'use strict';

// ========================================
// 简繁转换 (映射表来自 conv_tables.js, 由 build_conv_tables.py 生成)
// ========================================
// 全局转换器: 读取 conv_tables.js 定义的 S2T_MAP / T2S_MAP
function getConvTables() {
  const t = typeof S2T_MAP !== 'undefined' ? S2T_MAP : {};
  const f = typeof T2S_MAP !== 'undefined' ? T2S_MAP : {};
  return { s2t: t, t2s: f };
}

// 生成排序后的键列表 (长键优先) — 惰性缓存
let _s2tKeys = null, _t2sKeys = null;
function getKeys(mapObj) {
  return Object.keys(mapObj).sort((a, b) => b.length - a.length || a.localeCompare(b, 'zh'));
}

// V10.0 性能优化: 按「首字」分桶的转换表
// 原实现每个字符都要扫全部键 (conv_tables.js 约 700 条约 3000 次 startsWith/字符)，
// 默认繁体时全表 700+ 行渲染累计 >1s。分桶后每字符只比较「同首字」的少量键，
// 匹配语义与「全局最长键优先」完全一致（不同首字的键本就不可能匹配），输出不变。
let _s2tBuckets = null, _t2sBuckets = null;
function getBuckets(mapObj) {
  const buckets = new Map();
  for (const k of Object.keys(mapObj)) {
    const first = k[0];
    let arr = buckets.get(first);
    if (!arr) { arr = []; buckets.set(first, arr); }
    arr.push(k);
  }
  for (const arr of buckets.values()) arr.sort((a, b) => b.length - a.length);
  return buckets;
}

// 核心转换: 按最长键匹配替换
function convertText(text, mapObj) {
  if (!text || !mapObj) return text;
  const isS2T = (mapObj === getConvTables().s2t);
  let buckets;
  // 注意：主逻辑 IIFE 在 conv_tables.js 之前执行，顶部构建 FULL_DATA 时若先调用过
  // toSimplified()，会用空表缓存出空桶，导致此后简繁转换恒等（繁体查询失效）。
  // 这里在「缓存为空但映射表已有内容」时重建一次，兼容脚本加载顺序。
  const hasMapKeys = Object.keys(mapObj).length > 0;
  if (isS2T) {
    if (!_s2tBuckets || (_s2tBuckets.size === 0 && hasMapKeys)) _s2tBuckets = getBuckets(mapObj);
    buckets = _s2tBuckets;
  } else {
    if (!_t2sBuckets || (_t2sBuckets.size === 0 && hasMapKeys)) _t2sBuckets = getBuckets(mapObj);
    buckets = _t2sBuckets;
  }
  if (!buckets || buckets.size === 0) return text;

  let result = '';
  let i = 0;
  const n = text.length;
  while (i < n) {
    const arr = buckets.get(text[i]);
    let matched = false;
    if (arr) {
      for (let j = 0; j < arr.length; j++) {
        const k = arr[j];
        if (text.startsWith(k, i)) {
          result += mapObj[k];
          i += k.length;
          matched = true;
          break;
        }
      }
    }
    if (!matched) {
      result += text[i];
      i += 1;
    }
  }
  return result;
}

// 简体 -> 繁体
function toTraditional(text) {
  return convertText(text, getConvTables().s2t);
}
// 繁体 -> 简体
function toSimplified(text) {
  return convertText(text, getConvTables().t2s);

// 转换含 HTML 的字符串 (转换标签间文本 + data-copy 属性值, 保留标签结构)

if (typeof window !== 'undefined') window.KansekiLang = {

  onChange: function(fn) {
    if (typeof fn !== 'function') return function() {};

    return function() {

  ready: true

const GANZHI = ['甲子','乙丑','丙寅','丁卯','戊辰','己巳','庚午','辛未','壬申','癸酉',

// ========================================
// 构建年份对照数据

// 数字转中文序数（年号用）
function yearNumToChinese(n) {
  if (n <= 0) return '';
  if (n === 1) return '元年';
  const digits = ['', '一','二','三','四','五','六','七','八','九'];
  const units = ['', '十','百','千'];
  if (n < 10) return digits[n] + '年';
  if (n < 20) return '十' + (n === 10 ? '年' : digits[n % 10] + '年');
  if (n < 100) return digits[Math.floor(n / 10)] + '十' + (n % 10 === 0 ? '年' : digits[n % 10] + '年');
  return n + '年';
}

function buildFullDataset() {
  const data = [];
  
  // Determine year ranges
  // China data: -841 to 1912
  // Japan data: 645 to 2026
  // Combined: -841 to 2026
  const startYear = -841;
  const endYear = 2026;

  // Pre-process Chinese era data for quick lookup
  const cnEraMap = new Map(); // year -> [{dynasty, eraName, eraFull, ruler, notes}]
  
  for (const dynasty of CN_DYNASTIES) {
    for (const era of dynasty.eras) {
      const yrStart = era.r[0];
      const yrEnd = era.r[1] || yrStart;
      
      // Handle sub-eras first
      if (era.subEras) {
        for (const sub of era.subEras) {
          const sStart = sub.r[0];
          const sEnd = sub.r[1] || sStart;
          for (let y = sStart; y <= sEnd; y++) {
            if (!cnEraMap.has(y)) cnEraMap.set(y, []);
            cnEraMap.get(y).push({
              dynasty: dynasty.name,
              eraName: sub.name,
              eraFull: sub.name + yearNumToChinese(y - sStart + 1),
              ruler: era.ruler,
              notes: era.notes || dynasty.name
            });
          }
        }
      } else {
        for (let y = yrStart; y <= yrEnd; y++) {
          if (!cnEraMap.has(y)) cnEraMap.set(y, []);
          cnEraMap.get(y).push({
            dynasty: dynasty.name,
            eraName: era.name,
            eraFull: era.name + yearNumToChinese(y - yrStart + 1),
            ruler: era.ruler,
            notes: era.notes || dynasty.name
          });
        }
      }
    }
  }

  // Pre-process Japanese era data
  const jpEraMap = new Map(); // year -> [{period, eraName, eraFull, ruler, notes, kind}]
  
  for (const period of JP_PERIODS) {
    for (const era of period.eras) {
      const yrStart = era.r[0];
      const yrEnd = era.r[1] || yrStart;
      
      if (era.subEras) {
        for (const sub of era.subEras) {
          const sStart = sub.r[0];
          const sEnd = sub.r[1] || sStart;
          for (let y = sStart; y <= sEnd; y++) {
            if (!jpEraMap.has(y)) jpEraMap.set(y, []);
            jpEraMap.get(y).push({
              period: period.name,
              eraName: sub.name,
              eraFull: sub.name + yearNumToChinese(y - sStart + 1),
              ruler: era.ruler,
              notes: era.notes || '',
              kind: 'jp'
            });
          }
        }
      } else {
        for (let y = yrStart; y <= yrEnd; y++) {
          if (!jpEraMap.has(y)) jpEraMap.set(y, []);
          jpEraMap.get(y).push({
            period: period.name,
            eraName: era.name,
            eraFull: era.name + yearNumToChinese(y - yrStart + 1),
            ruler: era.ruler,
            notes: era.notes || '',
            kind: 'jp'
          });
        }
      }
    }
  }

  // V8.0: 周边政权年号 (朝鲜/渤海/南诏/大理/越南等) 并入"其他朝代"列
  // kind: 'jp' = 日本, 'ot' = 其他政权
  const otherStatesMap = new Map(); // year -> [{period, eraName, eraFull, ruler, notes, kind}]
  if (typeof OTHER_STATES !== 'undefined') {
    for (const st of OTHER_STATES) {
      for (const era of (st.eras || [])) {
        const yrStart = era.r[0];
        const yrEnd = era.r[1] || yrStart;
        for (let y = yrStart; y <= yrEnd; y++) {
          if (!otherStatesMap.has(y)) otherStatesMap.set(y, []);
          otherStatesMap.get(y).push({
            period: st.name,
            eraName: era.name,
            eraFull: era.name + yearNumToChinese(y - yrStart + 1),
            ruler: era.ruler,
            notes: era.notes || '',
            kind: 'ot'
          });
        }
      }
    }
  }

  // Build year by year — every year is ONE row, eras merged in cells
  for (let year = startYear; year <= endYear; year++) {
    const yearStr = year < 0 ? '前' + Math.abs(year) : String(year);
    const ganzhi = getGanzhi(year);
    const zodiac = getZodiac(year);
    
    const cnEntries = cnEraMap.get(year) || [];
    // V8.0: 日本 + 周边政权 合并为"其他朝代"列
    const jpEntries = (jpEraMap.get(year) || []).concat(otherStatesMap.get(year) || []);
    const hasJapanData = year >= 645 || jpEntries.length > 0;
    
    // Sort Chinese entries by dynasty group then era name
    cnEntries.sort((a, b) => {
      const order = ['先秦','秦汉','魏晋南北朝','隋唐五代','宋辽金夏','元明清'];
      const aGrp = CN_DYNASTIES.find(d => d.name === a.dynasty);
      const bGrp = CN_DYNASTIES.find(d => d.name === b.dynasty);
      const aIdx = aGrp ? order.indexOf(aGrp.group) : 99;
      const bIdx = bGrp ? order.indexOf(bGrp.group) : 99;
      if (aIdx !== bIdx) return aIdx - bIdx;
      return a.eraName.localeCompare(b.eraName, 'zh');
    });
    
    // Merge Chinese entries into single cell: era name only (dynasty in separate col)
    const cnDynastyArr = [...new Set(cnEntries.map(e => e.dynasty))];
    const cnEraBaseNames = [...new Set(cnEntries.map(e => e.eraName))]; // raw era names for filtering
    const cnEraLines = cnEntries.length > 0
      ? cnEntries.map(e => {
          const yrDisplay = year < 0 ? '前' + Math.abs(year) : year;
          const copyText = e.eraFull + '（' + yrDisplay + '）';
          return `<span class="era-entry"><span class="era-text">${e.eraFull}</span><button class="era-copy-btn" data-copy="${escapeHtml(copyText)}" title="复制 ${copyText}" aria-label="复制年号"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></span>`;
        }).join('<br>')
      : '—';
    const cnRulerArr = [...new Set(cnEntries.map(e => e.ruler))];
    const cnNotesArr = [...new Set(cnEntries.map(e => e.notes).filter(Boolean))];
    
    // Merge Japanese/other-states entries: 日本在前, 其他政权按名称排序
    jpEntries.sort((a, b) => {
      if (a.kind !== b.kind) return a.kind === 'jp' ? -1 : 1;
      return a.period.localeCompare(b.period, 'zh');
    });
    const jpPeriodArr = [...new Set(jpEntries.map(e => e.period))];
    // V8.0: 实际年号列表 (排除"无年号"占位)
    const jpRealEras = jpEntries.filter(e => e.eraName !== '—' && e.eraName !== '-');
    const jpEraNamesArr = [...new Set(jpRealEras.map(e => e.eraName))];
    const jpPeriodRealArr = [...new Set(jpRealEras.map(e => e.period))];
    // V8.0: 「无年号」占位 (—) 不渲染复制按钮, 显示为"无年号"
    const jpEraLines = jpEntries.length > 0
      ? jpEntries.map(e => {
          if (e.eraName === '—' || e.eraName === '-') {
            return `<span class="era-entry no-era"><span class="era-text">${e.period}·无年号</span></span>`;
          }
          const yrDisplay = year < 0 ? '前' + Math.abs(year) : year;
          const copyText = e.eraFull + '（' + yrDisplay + '）';
          return `<span class="era-entry"><span class="era-text">${e.period}·${e.eraFull}</span><button class="era-copy-btn" data-copy="${escapeHtml(copyText)}" title="复制 ${copyText}" aria-label="复制年号"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></span>`;
        }).join('<br>')
      : '—';
    const jpRulerArr = [...new Set(jpEntries.map(e => e.ruler))];
    const jpNotesArr = [...new Set(jpEntries.map(e => e.notes).filter(Boolean))];
    
    const allNotes = [...cnNotesArr, ...jpNotesArr];
    
    // 模糊补全候选 (简体): 年号全名 (如"同治十一年") 与 年号+干支 (如"同治戊戌")
    // 用于搜索建议: 输入"同治一"提示"同治十一年/二十一年", 输入"同治戊"提示"同治戊戌/戊寅"
    const eraFullCandidates = [...new Set(cnEntries.map(e => e.eraFull).concat(jpRealEras.map(e => e.eraFull)))]
      .filter(s => s && s.length >= 2 && !s.startsWith('—') && !s.startsWith('-'));
    const eraGzCandidates = [...new Set(
      cnEntries.map(e => e.eraName + getGanzhi(year)).concat(jpRealEras.map(e => e.eraName + getGanzhi(year)))
    )].filter(s => s && s.length >= 3 && !s.startsWith('—') && !s.startsWith('-'));
    
    // 简体归一化搜索串: 用于繁简无差别检索 (一次构建, 长期复用)
    // 包含 eraFull (如"万历十一年") 以便"万历十一年"这类写法也能命中
    const cnEraFullNames = [...new Set(cnEntries.map(e => e.eraFull))];
    const jpEraFullNames = [...new Set(jpRealEras.map(e => e.eraFull))];
    const searchKeyParts = [
      yearStr, ganzhi, zodiac,
      cnDynastyArr.join('、'), cnEraBaseNames.join('、'), cnEraFullNames.join('、'), cnRulerArr.join('、'),
      jpPeriodRealArr.join('、'),
      jpEraNamesArr.join('、'), jpEraFullNames.join('、'), jpRulerArr.join('、'),
      allNotes.join('；')
    ].filter(Boolean);
    // 统一转为简体, 保证"萬曆"也能匹配"万历"
    const searchKey = toSimplified(searchKeyParts.join(' '));
    
    data.push({
      year,
      yearStr,
      ganzhi,
      zodiac,
      // 简体归一化检索串 (全字段, 用于繁简无差别匹配)
      searchKey,
      // 模糊补全候选 (简体): "年号全名" 与 "年号+干支" 列表
      eraFullCandidates,
      eraGzCandidates,
      // for filtering (arrays)
      cnDynasties: cnDynastyArr.length > 0 ? cnDynastyArr : ['—'],
      cnEraNames: cnEraBaseNames.length > 0 ? cnEraBaseNames : ['—'],
      jpEraNames: jpEraNamesArr.length > 0 ? jpEraNamesArr : ['—'],
      jpPeriods: jpPeriodRealArr.length > 0 ? jpPeriodRealArr : ['—'],
      // for display (strings with HTML)
      cnDynasty: cnDynastyArr.length > 0 ? cnDynastyArr.join('、') : '—',
      cnEra: cnEraLines,
      cnRuler: cnRulerArr.length > 0 ? cnRulerArr.join('、') : '—',
      jpPeriod: jpPeriodRealArr.length > 0 ? jpPeriodRealArr.join('、') : '—',
      jpEra: jpEraLines,
      jpRuler: jpRulerArr.length > 0 ? jpRulerArr.join('、') : '—',
      notes: allNotes.join('；'),
      // v3 单年区域表用的结构化条目（中国 / 日本 / 其他政权，互不合并）
      _v3cn: cnEntries.map(e => ({ dynasty: e.dynasty, era: e.eraFull, ruler: e.ruler })),
      _v3jp: jpEntries.filter(e => e.kind === 'jp').map(e => ({ period: e.period, era: e.eraFull, ruler: e.ruler })),
      _v3ot: jpEntries.filter(e => e.kind === 'ot').map(e => ({ state: e.period, era: e.eraFull, ruler: e.ruler }))
    });
  }
  
  return data;
}

// ========================================
// v2.0 候选索引: 按"年号/帝王名"聚合的去重候选, 供建议栏展示
// 年号候选带朝代前缀 (明·景泰); 帝王名候选不带前缀 (周景王/汉景帝)
// 排序: 按历史顺序(年份升序) — 如"景"-> 景王(-544)/汉景帝(-156)/景初(237)...
// ========================================
let ERA_CANDIDATES = [];   // 全部候选(年号+帝王名), 已排序
let PY_HINT_MAP = null;    // 拼音前缀/缩写键(小写) -> [candidate, ...]
let WORD_PY_PREFIX = null; // 词 -> 拼音前缀集合 (供行过滤用)

// 生成某词条的全部读音组合 (每字取一个候选读音)
function pyCombos(pyCells) {
  let combos = [[]];
  for (const cells of pyCells) {
    const next = [];
    for (const combo of combos) {
      for (const p of cells) next.push(combo.concat([p]));
    }
    combos = next;
  }
  return combos;
}

function buildEraCandidates() {
  const cand = [];
  const seen = new Map(); // key: prefix + '|' + era -> 最早年份
  const eraSet = new Set(); // 全部年号名 (供帝王名去重)
  const addCand = (era, prefix, type, year, yearStr) => {
    if (!era || era === '—') return;
    const key = prefix + '|' + era;
    if (seen.has(key)) {
      // 同 prefix+era 只保留最早年份
      if (year < seen.get(key).year) seen.get(key).year = year;
      return;
    }
    const obj = { era, prefix, type, year, yearStr };
    seen.set(key, obj);
    cand.push(obj);
  };
  for (const row of FULL_DATA) {
    // 中国年号 + 朝代
    const dyns = (row.cnDynasties || []).filter(d => d && d !== '—');
    (row.cnEraNames || []).forEach((e, i) => {
      if (!e || e === '—') return;
      addCand(e, dyns[Math.min(i, dyns.length - 1)] || '', 'cn', row.year, row.yearStr);
      eraSet.add(e);
    });
    // 日本年号 + 时代
    const pers = (row.jpPeriods || []).filter(p => p && p !== '—');
    (row.jpEraNames || []).forEach((e, i) => {
      if (!e || e === '—') return;
      addCand(e, pers[Math.min(i, pers.length - 1)] || '', 'jp', row.year, row.yearStr);
      eraSet.add(e);
    });
  }
  // 中国帝王名 (去括号取主名; 与年号重名则跳过 — 年号候选已覆盖)
  for (const row of FULL_DATA) {
    const dyn = (row.cnDynasties || []).find(d => d && d !== '—') || '';
    (row.cnRuler || '').split(/[、,，]/).forEach(r => {
      let nm = (r || '').split('(')[0].trim();
      if (!nm || nm === '—') return;
      // 跳过与年号重名的"朝代字+名"形式 (周景王 -> 景王 已在年号)
      if (nm.length >= 2 && '周汉唐宋元明清'.includes(nm[0]) && eraSet.has(nm.slice(1))) return;
      if (eraSet.has(nm)) return; // 与年号完全重名
      addCand(nm, '', 'cnRuler', row.year, row.yearStr);
    });
  }
  // 日本天皇名 (去"天皇"后缀, 前缀留空; 与年号重名则跳过 — 年号候选已覆盖)
  for (const row of FULL_DATA) {
    const per = (row.jpPeriods || []).find(p => p && p !== '—') || '';
    (row.jpRuler || '').split(/[、,，]/).forEach(r => {
      let nm = (r || '').split('(')[0].trim().replace(/天皇/g, '');
      if (!nm || nm === '—') return;
      if (eraSet.has(nm)) return; // 明治天皇 -> 明治 与年号重名
      addCand(nm, '', 'jpRuler', row.year, row.yearStr);
    });
  }
  // 排序: 按年份升序 (历史顺序), 同年按名称
  cand.sort((a, b) => a.year - b.year || a.era.localeCompare(b.era, 'zh'));
  ERA_CANDIDATES = cand;
  // 拼音索引: 每个候选生成 全拼/缩写 的前缀键
  PY_HINT_MAP = new Map();
  for (const c of cand) {
    const term = PINYIN_TERMS.find(t => t.w === c.era);
    if (!term) continue;
    const combos = pyCombos(term.py);
    const keys = new Set();
    const fulls = new Set();
    const inis = new Set();
    const sylPrefixes = new Set();
    for (const combo of combos) {
      const full = combo.join('').toLowerCase();
      const ini = combo.map(p => p[0]).join('').toLowerCase();
      fulls.add(full);
      inis.add(ini);
      // 全拼逐字符前缀
      for (let l = 1; l <= full.length; l++) keys.add(full.slice(0, l));
      // 缩写逐字符前缀
      for (let l = 1; l <= ini.length; l++) keys.add(ini.slice(0, l));
      // 音节前缀: 查询词长度>=4 时启用 (如 "jingt" 前缀匹配 "jingtai")
      if (full.length >= 4) {
        let acc = '';
        for (const syl of combo) {
          acc += syl;
          sylPrefixes.add(acc);
        }
      }
    }
    c.pyFulls = fulls;
    c.pyInis = inis;
    c.pySylPrefixes = sylPrefixes;
    for (const k of keys) {
      if (!PY_HINT_MAP.has(k)) PY_HINT_MAP.set(k, []);
      const arr = PY_HINT_MAP.get(k);
      if (!arr.includes(c)) arr.push(c);
    }
  }
  // 词级拼音前缀集合: 行过滤时直接查 (词 -> 前缀集合)
  WORD_PY_PREFIX = new Map();
  for (const t of PINYIN_TERMS) {
    const combos = pyCombos(t.py);
    const set = new Set();
    for (const combo of combos) {
      const full = combo.join('').toLowerCase();
      const ini = combo.map(p => p[0]).join('').toLowerCase();
      for (let l = 1; l <= full.length; l++) set.add(full.slice(0, l));
      for (let l = 1; l <= ini.length; l++) set.add(ini.slice(0, l));
    }
    WORD_PY_PREFIX.set(t.w, set);
  }

  // ================================================
  // v2.1 年份/干支拼音候选 (运行时生成, 并入统一索引)
  // ================================================
  buildExtraPinyinIndex();
}

// 干支拼音表: 60 组干支 -> 全拼 (含首字母)

  '戊子':'wuzi','己丑':'jichou','庚寅':'gengyin','辛卯':'xinmao','壬辰':'renchen','癸巳':'guisi',
