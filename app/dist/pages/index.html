};
// 汉字数字拼音 (年份如"万历十一年"中数字检索用; 这里主要用于年份的汉字写法)
const CN_NUM_PY = { '0':'ling','〇':'ling','零':'ling','1':'yi','一':'yi','2':'er','二':'er','3':'san','三':'san',
  '4':'si','四':'si','5':'wu','五':'wu','6':'liu','六':'liu','7':'qi','七':'qi','8':'ba','八':'ba',
  '9':'jiu','九':'jiu','十':'shi','百':'bai','千':'qian' };

// 年份/干支拼音候选索引 (v2.1):
//   YEAR_PY_MAP  : 拼音前缀/缩写 -> [年份候选 {year, yearStr}]
//   GZ_PY_MAP    : 干支拼音 -> 干支 (全拼精确 + 缩写)
let YEAR_PY_MAP = null;
let GZ_PY_MAP = null;

function buildExtraPinyinIndex() {
  // --- 年份: 把年份字符串 (如 "2026") 映射到汉字数字读法拼音 ---
  // 例: 2026 -> 二零二六 -> er ling er liu; 前缀 er/erl/erli...; 缩写 elerl
  YEAR_PY_MAP = new Map();
  GZ_PY_MAP = new Map();
  const addKey = (map, key, obj) => {
    if (!key) return;
    key = key.toLowerCase();
    if (!map.has(key)) map.set(key, []);
    const arr = map.get(key);
    if (!arr.some(x => x.year === obj.year && x.value === obj.value)) arr.push(obj);
  };
  // 年份数字拼音 (支持正负年份, 前N年 -> 前+n)
  for (const row of FULL_DATA) {
    const y = row.year;
    const digits = String(Math.abs(y)).split('').map(d => CN_NUM_PY[d] || d);
    const full = (y < 0 ? 'qian' : '') + digits.join('');
    const ini = (y < 0 ? 'q' : '') + digits.map(p => p[0]).join('');
    const base = { year: y, yearStr: row.yearStr, value: '公元' + row.yearStr + '年', full, ini };
    // 前缀键
    for (let l = 1; l <= full.length; l++) addKey(YEAR_PY_MAP, full.slice(0, l), base);
    for (let l = 1; l <= ini.length; l++) addKey(YEAR_PY_MAP, ini.slice(0, l), base);
  }
  // 干支拼音: 全拼精确 + 前缀 + 缩写
  const jzMap = { '甲':'j','乙':'y','丙':'b','丁':'d','戊':'w','己':'j','庚':'g','辛':'x','壬':'r','癸':'g',
                  '子':'z','丑':'c','寅':'y','卯':'m','辰':'c','巳':'s','午':'w','未':'w','申':'s','酉':'y','戌':'x','亥':'h' };
  for (const [gz, py] of Object.entries(GANZHI_PY)) {
    const ini2 = gz.split('').map(ch => jzMap[ch] || ch).join(''); // 逐字首字母缩写 (甲子 -> jz)
    const base = { gz, value: gz + '年', py, ini: ini2 };
    addKey(GZ_PY_MAP, py, base);            // 完整全拼
    addKey(GZ_PY_MAP, ini2, base);          // 缩写
    for (let l = 1; l < py.length; l++) addKey(GZ_PY_MAP, py.slice(0, l), base); // 前缀
  }
}

// 拼音匹配: 查询词为纯拼音/首字母缩写时返回候选列表 (按匹配质量排序)
// 匹配规则 (统一评分, 跨年号/年份/干支三类):
//   完整全拼 == q (4分) > 完整缩写 == q (3分) > 全拼音节前缀 (2分) > 缩写前缀 (1分)
// 干支命中需展开为该干支的全部年份; 年份按单行候选
function matchPinyinCandidates(q, maxResults) {
  const scored = []; // {score, cand, sortYear}
  const seen = new Set();
  const pushScored = (score, c, sortYear) => {
    const k = (c.prefix || '') + '|' + (c.era || c.value || '') + '|' + c.year;
    if (seen.has(k)) return;
    seen.add(k);
    scored.push({ score, c, sortYear });
  };

  // 1) 干支拼音: 全拼精确=4, 缩写精确=3, 前缀=1; 命中后展开全部该干支年份
  const gzHits = (GZ_PY_MAP && GZ_PY_MAP.get(q)) || [];
  for (const g of gzHits) {
    let score;
    if (g.py === q) score = 4;
    else if (g.ini === q) score = 3;
    else score = 1;
    const gzRows = FULL_DATA.filter(r => r.ganzhi === g.gz);
    gzRows.forEach(r => pushScored(score, { era: g.value, prefix: '', type: 'gz', year: r.year, yearStr: r.yearStr }, r.year));
  }
  // 2) 年份拼音: 全拼精确=4, 缩写精确=3, 前缀=1
  const yearHits = (YEAR_PY_MAP && YEAR_PY_MAP.get(q)) || [];
  for (const y of yearHits) {
    let score;
    if (y.full === q) score = 4;
    else if (y.ini === q) score = 3;
    else score = 1;
    pushScored(score, { era: y.value, prefix: '', type: 'year', year: y.year, yearStr: y.yearStr }, y.year);
  }
  // 3) 年号/帝王名拼音 (v2.0 评分逻辑)
  const hits = PY_HINT_MAP.get(q) || [];
  for (const c of hits) {
    let score = 0;
    if (c.pyFulls && c.pyFulls.has(q)) score = 4;
    else if (c.pyInis && c.pyInis.has(q)) score = 3;
    else if (c.pySylPrefixes && c.pySylPrefixes.has(q)) score = 2;
    else score = 1;
    pushScored(score, c, c.year);
  }
  // 统一排序: 评分降序 (精确优先), 同级按年份升序 (历史顺序)
  scored.sort((a, b) => b.score - a.score || a.sortYear - b.sortYear);
  return scored.slice(0, maxResults).map(x => x.c);
}

// 拼音匹配判定 (用于行过滤): 行内年号/帝王名/干支/年份的拼音前缀含 q 即命中
function rowPinyinHit(row, q) {
  if (!/^[a-z]+$/.test(q) || q.length < 1) return false;
  // v2.1: 干支拼音 (如 wuchen -> 戊辰年)
  if (GZ_PY_MAP && GZ_PY_MAP.has(q) && row.ganzhi) {
    const gzHits = GZ_PY_MAP.get(q);
    if (gzHits.some(g => g.gz === row.ganzhi)) return true;
  }
  // v2.1: 年份拼音 (如 erlingerliu -> 2026年)
  if (YEAR_PY_MAP && YEAR_PY_MAP.has(q)) {
    const yrHits = YEAR_PY_MAP.get(q);
    if (yrHits.some(y => y.year === row.year)) return true;
  }
  if (!WORD_PY_PREFIX) return false;
  const names = [];
  (row.cnEraNames || []).forEach(n => { if (n && n !== '—') names.push(n); });
  (row.jpEraNames || []).forEach(n => { if (n && n !== '—') names.push(n); });
  (row.cnRuler || '').split(/[、,，]/).forEach(r => {
    const nm = (r || '').split('(')[0].trim();
    if (nm && nm !== '—') names.push(nm);
  });
  (row.jpRuler || '').split(/[、,，]/).forEach(r => {
    let nm = (r || '').split('(')[0].trim().replace(/天皇/g, '');
    if (nm && nm !== '—') names.push(nm);
  });
  for (const n of names) {
    const pre = WORD_PY_PREFIX.get(n);
    if (pre && pre.has(q)) return true;
  }
  return false;
}

const ALL_CN_ERAS = new Set();
const ALL_JP_ERAS = new Set();
const JP_ONLY_ERAS = new Set(); // V8.0: 仅日本时代专属年号 (不含周边政权)
(function buildEraSets() {

  }

  if (typeof JP_PERIODS !== 'undefined') {

        const push = name => { if (name && name !== '—' && name !== '-') JP_ONLY_ERAS.add(name); };
        if (e.subEras) e.subEras.forEach(s => push(s.name));

// V4.3: 年号 → 朝代/时代 归属映射 (直接从 CN_DYNASTIES/JP_PERIODS 生成, 不经行合并)
// 用于重名提醒: 崇祯只属「明」, 不会因 1644 年明亡清立而被归给「清」
const ERA_CN_SCOPE = new Map(); // 年号名 -> Map(朝代 -> [minYear, maxYear])
const ERA_JP_SCOPE = new Map(); // 年号名 -> Map(时代 -> [minYear, maxYear])
(function buildEraScopeMaps() {
  for (const d of CN_DYNASTIES) {
    for (const e of (d.eras || [])) {
      const pushEra = (name, r) => {
        if (!name || name === '—' || name === '-') return;
        if (!ERA_CN_SCOPE.has(name)) ERA_CN_SCOPE.set(name, new Map());
        const m = ERA_CN_SCOPE.get(name);
        if (!m.has(d.name)) m.set(d.name, [r[0], r[1]]);
        else { const v = m.get(d.name); v[0] = Math.min(v[0], r[0]); v[1] = Math.max(v[1], r[1]); }
      };
      if (e.subEras) e.subEras.forEach(s => pushEra(s.name, s.r));
      else pushEra(e.name, e.r);
    }
  }
  for (const p of JP_PERIODS) {
    for (const e of (p.eras || [])) {
      const pushEra = (name, r) => {
        if (!name || name === '—' || name === '-') return;
        if (!ERA_JP_SCOPE.has(name)) ERA_JP_SCOPE.set(name, new Map());
        const m = ERA_JP_SCOPE.get(name);
        if (!m.has(p.name)) m.set(p.name, [r[0], r[1]]);
        else { const v = m.get(p.name); v[0] = Math.min(v[0], r[0]); v[1] = Math.max(v[1], r[1]); }
      };
      if (e.subEras) e.subEras.forEach(s => pushEra(s.name, s.r));
      else pushEra(e.name, e.r);
    }
  }
  // V8.0: 周边政权 (朝鲜/渤海/南诏/大理/越南等) 也纳入归属映射
  if (typeof OTHER_STATES !== 'undefined') {
    for (const st of OTHER_STATES) {
      for (const e of (st.eras || [])) {
        const pushEra = (name, r) => {
          if (!name || name === '—' || name === '-') return;
          if (!ERA_JP_SCOPE.has(name)) ERA_JP_SCOPE.set(name, new Map());
          const m = ERA_JP_SCOPE.get(name);
          if (!m.has(st.name)) m.set(st.name, [r[0], r[1]]);
          else { const v = m.get(st.name); v[0] = Math.min(v[0], r[0]); v[1] = Math.max(v[1], r[1]); }
        };
        pushEra(e.name, e.r);
      }
    }
  }
})();

// 构建筛选数据源: 中国朝代分组 + 其他朝代 (日本时代 + 周边政权), 每项含 eras(含 ruler)
// 返回 [{ key, label, kind:'cn'|'jp'|'ot', section, eras:[{name,ruler,r}] }]
function qfBuildSources() {
  const list = [];
  // 中国: 按 CHINA_FILTER_GROUPS 的组顺序, 展开为各朝代
  for (const g of CHINA_FILTER_GROUPS) {
    for (const dynName of g.dynasties) {
      const dyn = CN_DYNASTIES.find(d => d.name === dynName);
      if (!dyn) continue;
      list.push({ key: 'cn:' + dyn.name, label: dyn.name, kind: 'cn', section: '中国朝代', eras: dyn.eras || [] });
    }
  }
  // 日本: 各时代
  for (const p of JP_PERIODS) {
    list.push({ key: 'jp:' + p.name, label: p.name, kind: 'jp', section: '日本', eras: p.eras || [] });
  }
  // V8.0: 周边政权 (朝鲜半岛/东北/云南/越南等)
  if (typeof OTHER_STATES !== 'undefined') {
    for (const st of OTHER_STATES) {
      list.push({
        key: 'ot:' + st.name,
        label: st.name,
        kind: 'ot',
        section: OT_SECTIONS[st.name] || '周边政权',
        eras: st.eras || []
      });
    }
  }
  return list;
}

// 解析 ruler 为 { title, given } 帝号/名字
function qfParseRuler(ruler) {
  if (!ruler) return { title: '', given: '' };
  const m = ruler.match(/^([^()（）]+)[(（]([^()（）]+)[)）]/);
  if (m) return { title: m[1].trim(), given: m[2].trim() };
  return { title: ruler.trim(), given: '' };
}

// 将一个朝代/时代的 eras 按皇帝分组, 组内与组间均按时间排序
// 返回 [{ title, given, eras:[{name,r}] }]  (name 过滤 '-'/'—')
function qfGroupByEmperor(eras) {
  const groups = new Map(); // rulerKey -> { title, given, eras:[], minYear }
  for (const e of eras) {
    const subList = e.subEras ? e.subEras : [e];
    for (const s of subList) {
      const nm = s.name;
      if (!nm || nm === '—' || nm === '-') continue;
      const { title, given } = qfParseRuler(e.ruler);
      const key = title + '|' + given;
      if (!groups.has(key)) groups.set(key, { title, given, eras: [], minYear: Infinity });
      const g = groups.get(key);
      g.minYear = Math.min(g.minYear, s.r[0]);
      // 同年号去重
      if (!g.eras.some(x => x.name === nm)) g.eras.push({ name: nm, r: s.r });
    }
  }
  const arr = [...groups.values()];
  arr.forEach(g => g.eras.sort((a, b) => a.r[0] - b.r[0]));
  arr.sort((a, b) => a.minYear - b.minYear);
  return arr;
}

      // 只切换 viewing 高亮，不重建整列：重建会让 hover 中的节点被替换，

      qfRenderChips();
      applyFilters();
    });
  });
}

  const wrap = document.getElementById('qfWrap');

  const clearBtn = document.getElementById('qfClear');
  if (!wrap || !btn) return;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();

    btn.setAttribute('aria-expanded', open ? 'true' : 'false');

    if (!wrap.contains(e.target)) {
      wrap.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');

  });

}

}
function attachFilterEvents() {
  // 移动端 filter-tag 仍走旧逻辑 (中国朝代/日本时代/年号)
  document.querySelectorAll('.filter-tag').forEach(tag => {
    if (tag.dataset.qfBound) return;
    tag.dataset.qfBound = '1';
    tag.addEventListener('click', function() {
      const type = this.dataset.type;
      const value = this.dataset.value;
      if (type === 'china') {
        if (selectedChinaFilters.has(value)) selectedChinaFilters.delete(value);
        else selectedChinaFilters.add(value);
      } else if (type === 'china-era') {
        if (selectedChinaEras.has(value)) selectedChinaEras.delete(value);
        else selectedChinaEras.add(value);
      } else {
        if (selectedJapanFilters.has(value)) selectedJapanFilters.delete(value);
        else selectedJapanFilters.add(value);
      }
      renderFilterTags();
      applyFilters();
    });
  });
}

// ========================================
// Filter + Search Logic
// ========================================

// 干支解析: 识别查询词中的干支 (支持简体/繁体写法)
// 返回: { ganzhi: '癸未' } 或 null (无干支)
// 支持格式: '癸未' / '癸未年' / '万历癸未' / '萬曆癸未'
const GZ_TIANGAN_S = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const GZ_TIANGAN_T = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸']; // 天干繁简相同
const GZ_DIZHI_S = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GZ_DIZHI_T = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥']; // 地支繁简相同
// 地支繁体别名 (罕见, 但兼容输入)
const DIZHI_T_ALIAS = {};

function extractGanzhi(query) {
  // 先归一化为简体再解析 (干支繁简同形, 但保险起见)
  const q = toSimplified(query.trim());
  const re = /([甲乙丙丁戊己庚辛壬癸])([子丑寅卯辰巳午未申酉戌亥])/g;
  let match;
  while ((match = re.exec(q)) !== null) {
    const gz = match[1] + match[2];
    // 校验是否为有效干支组合 (阳干配阳支, 阴干配阴支)
    const tgIdx = GZ_TIANGAN_S.indexOf(match[1]);
    const dzIdx = GZ_DIZHI_S.indexOf(match[2]);
    if (tgIdx >= 0 && dzIdx >= 0 && ((tgIdx % 2) === (dzIdx % 2))) {
      return { ganzhi: gz };
    }
    if (match.index + 2 < q.length && re.lastIndex === match.index + 2) continue;
  }
  return null;
}

// 判断查询词中是否包含干支 (用于"万历癸未"这类年号+干支组合)
function queryContainsGanzhi(q) {
  return extractGanzhi(q) !== null;
}

// 行级搜索命中判定
// fuzzy=false: 精确匹配 (干支语义 + searchKey 包含 + 公元前特判)
// fuzzy=true:  精确为空时启用模糊补全 (年号前缀+片段)
function rowSearchHit(row, q, fuzzy) {
  // --- 干支语义解析 ---
  const gzMatch = extractGanzhi(q);
  if (gzMatch) {
    const gz = gzMatch.ganzhi;
    // 纯干支查询: 只要年份干支匹配即命中
    const ganzhiHit = row.ganzhi === gz;
    
    // 提取干支前后可能的年号关键词 (如"万历癸未"中的"万历")
    const before = q.slice(0, q.indexOf(gz[0]));
    const after = q.slice(q.indexOf(gz[1]) + 1);
    const eraKeyword = (before + after).trim();
    
    if (eraKeyword) {
      // 年号+干支组合查询: 需同时满足年号与干支
      const eraHit = row.cnEraNames.some(e => e.includes(eraKeyword)) ||
                     row.jpEraNames.some(j => j.includes(eraKeyword)) ||
                     row.jpPeriods.some(p => p.includes(eraKeyword)) ||
                     row.cnDynasties.some(d => d.includes(eraKeyword));
      if (ganzhiHit && eraHit) return true;
      // 组合查询失败时不额外放行, 继续走常规搜索
    } else {
      // 纯干支: 命中即返回
      if (ganzhiHit) return true;
    }
  }
  
  // V8.3: 干支错写兼容 — 查询含 "巳X" (X为地支) 时, 若该行干支为 "己X", 视作命中
  //        (古籍中「己」常误写为「巳」)
  //        若查询在错写干支前还有年号关键词 (如"光绪巳巳"), 需同时命中年号
  const typoQ = detectGanzhiTypo(q);
  if (typoQ) {
    if (row.ganzhi === typoQ.corrected) {
      // 检查错写干支之前是否有其他汉字 (年号关键词)
      const beforeTypo = q.slice(0, q.indexOf(typoQ.original));
      if (beforeTypo.trim()) {
        const kw = beforeTypo.trim();
        const eraHit = (row.cnEraNames || []).some(e => e && e.includes(kw)) ||
                       (row.jpEraNames || []).some(j => j && j.includes(kw)) ||
                       (row.jpPeriods || []).some(p => p && p.includes(kw)) ||
                       (row.cnDynasties || []).some(d => d && d.includes(kw));
        if (eraHit) return true;
      } else {
        return true;
      }
    }
  }
  
  // --- 常规文本匹配 (基于预构建的简体 searchKey) ---
  if (row.searchKey && row.searchKey.includes(q)) return true;
  
  // --- 模糊匹配: "年号 + 片段" (如"同治一"→同治十一年, "同治戊"→同治戊辰) ---
  if (fuzzy && q.length >= 3 && row.searchKey) {
    if (eraPrefixHit(row, q)) return true;
  }
  
  // 公元前年份特判
  if (row.year < 0) {
    const bcStr = '前' + Math.abs(row.year);
    if (bcStr.includes(q) || String(row.year).includes(q)) return true;
  }
  
  // V8.2: 大事记命中 (title/desc/source 含 q)
  if (typeof window.eventsHit === 'function' && window.eventsHit(row, q)) return true;
  
  return false;
}

// 模糊命中判定: 查询拆为"年号前缀+片段", 行内任一候选包含该片段
// 例: q="同治一" -> 同治十一年/二十一年; q="同治戊" -> 同治戊戌/戊寅
function eraPrefixHit(row, q) {
  const eraNames = [];
  if (row.cnEraNames) row.cnEraNames.forEach(e => { if (e && e !== '—') eraNames.push(e); });
  if (row.jpEraNames) row.jpEraNames.forEach(j => { if (j && j !== '—') eraNames.push(j); });
  if (row.jpPeriods) row.jpPeriods.forEach(p => { if (p && p !== '—') eraNames.push(p); });
  for (const name of eraNames) {
    if (!name || name.length < 2 || !q.startsWith(name) || q.length <= name.length) continue;
    const rest = q.slice(name.length);
    if (!rest) continue;
    // 年号全名候选或年号+干支候选, 包含剩余片段即命中
    if (row.eraFullCandidates && row.eraFullCandidates.some(c => c.startsWith(name) && c.includes(rest))) return true;
    if (row.eraGzCandidates && row.eraGzCandidates.some(c => c.startsWith(name) && c.includes(rest))) return true;
  }
  return false;
}

// V8.3: 混合查询解析 — 「汉字+拼音」或「汉字+数字」组合
// 例: "光绪wushen" → {eraPart:'光绪', gzPart:'戊申'}; "光绪3" → {eraPart:'光绪', numPart:3}
// 例: "qingwuxu" → 纯拼音走原逻辑; 本函数仅处理"汉字 + 拉丁/数字"混合
// 返回 null 表示非混合查询 (走原逻辑)
function parseMixedQuery(q) {
  if (!q || q.length < 3) return null;
  const hasHan = /[\u4e00-\u9fff]/.test(q);
  const hasLat = /[a-z]/.test(q);
  const hasNum = /[0-9]/.test(q);
  if (!hasHan || (!hasLat && !hasNum)) return null;
  // 分离: 汉字段 与 拼音/数字段 (允许交错, 但简化处理: 按位置切分)
  // 情形A: 汉字前缀 + 拼音后缀 (光绪wushen)
  const hanMatch = q.match(/^([\u4e00-\u9fff]+)([a-z0-9]+)$/);
  if (hanMatch) {
    const eraPart = hanMatch[1];
    const tail = hanMatch[2];
    // 纯数字后缀: 光绪3 → 光绪三年 / 光绪1843
    if (/^\d+$/.test(tail)) {
      return { eraPart, numPart: parseInt(tail, 10) };
    }
    // 拼音后缀: 尝试匹配干支拼音 (wushen → 戊申)
    if (/^[a-z]+$/.test(tail) && GZ_PY_MAP) {
      // 精确全拼
      for (const [k, arr] of GZ_PY_MAP) {
        if (k === tail && arr.length > 0) {
          return { eraPart, gzPart: arr[0].gz };
        }
      }
      // 前缀匹配 (取最长的匹配键)
      let best = null, bestLen = 0;
      for (const [k, arr] of GZ_PY_MAP) {
        if (tail.startsWith(k) && k.length > bestLen && arr.length > 0) {
          best = arr[0].gz; bestLen = k.length;
        }
      }
      if (best) return { eraPart, gzPart: best };
    }
    return { eraPart };
  }
  // 情形B: 拼音在中间或汉字在中间 (如 "光xu绪") — 拆分汉字与字母, 再重组
  const hanSegs = q.split(/[a-z0-9]+/).filter(Boolean);
  const latSegs = q.split(/[\u4e00-\u9fff]+/).filter(Boolean);
  if (hanSegs.length === 1 && latSegs.length === 1) {
    const eraPart = hanSegs[0];
    const tail = latSegs[0];
    if (/^\d+$/.test(tail)) return { eraPart, numPart: parseInt(tail, 10) };
    if (/^[a-z]+$/.test(tail) && GZ_PY_MAP) {
      for (const [k, arr] of GZ_PY_MAP) {
        if (k === tail && arr.length > 0) return { eraPart, gzPart: arr[0].gz };
      }
      let best = null, bestLen = 0;
      for (const [k, arr] of GZ_PY_MAP) {
        if (tail.startsWith(k) && k.length > bestLen && arr.length > 0) { best = arr[0].gz; bestLen = k.length; }
      }
      if (best) return { eraPart, gzPart: best };
    }
    return { eraPart };
  }
  return null;
}

// V8.3: 混合查询行级命中 — 在 rowSearchHit 常规逻辑之外做 AND 匹配
// 返回 true 表示命中 (年号段 与 干支/年份段 同时满足)
function mixedQueryHit(row, mq) {
  if (!mq || !mq.eraPart) return false;
  const eraPart = mq.eraPart;
  // 年号段匹配: 行内 cnEraNames/jpEraNames/jpPeriods/cnDynasties 含 eraPart
  const eraHit = (row.cnEraNames || []).some(e => e && e.includes(eraPart)) ||
                 (row.jpEraNames || []).some(j => j && j.includes(eraPart)) ||
                 (row.jpPeriods || []).some(p => p && p.includes(eraPart)) ||
                 (row.cnDynasties || []).some(d => d && d.includes(eraPart));
  if (!eraHit) return false;
  // 干支段: 行干支匹配
  if (mq.gzPart) {
    return row.ganzhi === mq.gzPart;
  }
  // 数字段: 三种解释 — (a) 年份绝对值 (b) 年号第N年 (c) 公历年份
  if (mq.numPart !== undefined && mq.numPart !== null) {
    const n = mq.numPart;
    // (c) 公历年份 (1000-3000 视为公历)
    if (n >= 1000 && n <= 3000) {
      if (row.year === n) return true;
    }
    // (a) 年份绝对值
    if (Math.abs(row.year) === n) return true;
    // (b) 年号第N年: 该行 eraPart 年号的起始年 + n - 1
    const eraRows = FULL_DATA.filter(r =>
      (r.cnEraNames || []).some(e => e && e.includes(eraPart)) ||
      (r.jpEraNames || []).some(j => j && j.includes(eraPart)));
    if (eraRows.length > 0) {
      // 找到与当前行同一归属的最小年份作为起始
      const startYear = Math.min(...eraRows.map(r => r.year));
      if (row.year === startYear + n - 1) return true;
    }
    return false;
  }
  return false;
}

// V8.3: 干支错写检测 — 古籍常见将「己」误写为「巳」等
// 例: "巳巳" → 提示"己巳"; "巳卯" → 提示"己卯"; "光绪巳巳" → 提示"光绪己巳"
// 规则: 查询中出现「巳X」(X为地支) 且「己X」为有效干支组合时, 提示修正
function detectGanzhiTypo(q) {
  if (!q || !/[\u4e00-\u9fff]/.test(q)) return null;
  const dzSet = new Set(GZ_DIZHI_S);
  // 在任意位置查找 "巳X" (X为地支)
  for (let i = 0; i < q.length - 1; i++) {
    if (q[i] !== '巳') continue;
    const second = q[i + 1];
    if (!dzSet.has(second)) continue;
    const candidate = '己' + second;
    const tgIdx = GZ_TIANGAN_S.indexOf('己'); // 1 (阴干)
    const dzIdx = GZ_DIZHI_S.indexOf(second);
    // 阴干配阴支: 己(1, 阴) 需配 阴支 (地支索引为奇数)
    if (tgIdx >= 0 && dzIdx >= 0 && ((tgIdx % 2) === (dzIdx % 2))) {
      return { original: q.slice(i, i + 2), corrected: candidate, type: 'si→ji' };
    }
  }
  return null;
}

function applyFilters() {
  // 1. 先按筛选器 (朝代/年号/时代) 过滤
  let base = FULL_DATA.filter(row => {
    // China dynasty filter — check against array
    if (selectedChinaFilters.size > 0) {
      const cnMatch = row.cnDynasties.some(d => selectedChinaFilters.has(d));
      if (!cnMatch) return false;
    }
    // China era name filter — check against array
    if (selectedChinaEras.size > 0) {
      const eraMatch = row.cnEraNames.some(e => selectedChinaEras.has(e));
      if (!eraMatch) return false;
    }
    // Japan period filter — check against array
    if (selectedJapanFilters.size > 0) {
      const jpMatch = row.jpPeriods.some(p => selectedJapanFilters.has(p));
      if (!jpMatch) return false;
    }
    return true;
  });
  
  // 2. 搜索词两阶段匹配 (精确优先, 精确为空时才启用模糊补全)
  //    避免"万历十一年"被模糊片段误匹配到"万历二十一年"等行
  if (searchQuery.trim()) {
    // 查询词转简体后匹配 (繁简无差别)
    const q = toSimplified(searchQuery.trim()).toLowerCase();
    // V8.3: 混合查询 (汉字+拼音/数字) 优先尝试
    const mixedQ = parseMixedQuery(q);
    if (mixedQ && mixedQ.eraPart && (mixedQ.gzPart || mixedQ.numPart !== undefined)) {
      const mixedRows = base.filter(r => mixedQueryHit(r, mixedQ));
      if (mixedRows.length > 0) {
        filteredData = mixedRows;
      } else {
        filteredData = base.filter(r => rowSearchHit(r, q, true));
      }
    } else if (/^[a-z]+$/.test(q)) {
      // v2.0: 拼音/首字母查询走拼音行匹配 (如 "jingtai" -> 景泰年间)
      const pinyinRows = base.filter(r => rowPinyinHit(r, q));
      filteredData = pinyinRows.length > 0 ? pinyinRows : base.filter(r => rowSearchHit(r, q, true));
    } else {
      const exact = base.filter(r => rowSearchHit(r, q, false));
      filteredData = exact.length > 0 ? exact : base.filter(r => rowSearchHit(r, q, true));
    }
  } else {
    filteredData = base;
  }
  
  // V8.3: 干支错写处理 — 查询含错写干支 (如 "巳巳") 时:
  //  1) 无论常规搜索是否有结果, 只要存在错写且修正后有匹配行, 即设置标记 (供弱高亮)
  //  2) 常规搜索无结果时, 自动改用修正干支重搜, 列出对应年份
  window.__ganzhiTypoCorrected = null;
  if (searchQuery.trim()) {
    const q0 = toSimplified(searchQuery.trim()).toLowerCase();
    const typo = detectGanzhiTypo(q0);
    if (typo) {
      // 修正后是否有匹配行 (含修正干支)
      const correctedQuery = q0.replace(typo.original, typo.corrected);
      const q2 = correctedQuery.toLowerCase();
      const correctedExact = base.filter(r => rowSearchHit(r, q2, false));
      const correctedRows = correctedExact.length > 0 ? correctedExact : base.filter(r => rowSearchHit(r, q2, true));
      // 命中修正结果 → 标记 (弱高亮)
      if (correctedRows.length > 0) {
        window.__ganzhiTypoCorrected = { original: typo.original, corrected: typo.corrected };
      }
      // 常规结果为空 (如 "巳巳" 无直接命中) → 用修正结果兜底
      if (filteredData.length === 0 && correctedRows.length > 0) {
        filteredData = correctedRows;
      }
    }
  }
  
  // V4.2: 精准查询检测 (排序后进行, 用排序后真实行重新定位, 避免 index 错位)
  let preciseHit = null;
  if (searchQuery.trim() && filteredData.length > 0) {
    const q = toSimplified(searchQuery.trim()).toLowerCase();
    const realBeforeSort = filteredData;
    sortData();
    preciseHit = detectPreciseHit(q, realBeforeSort);
  } else {
    sortData();
  }
  currentPage = 1;
  
  // V4.2: 精准命中 → 排序后插入整个年号年份 (紧跟命中行)
  // 注意: insertNearbyRows 仅在首次 (无临近块) 时插入, 幂等
  if (preciseHit && !filteredData.some(r => isNearbySep(r))) {
    // 命中行在排序后的真实行中重新定位 (detectPreciseHit 的 index 基于排序前)
    const real = filteredData.filter(r => !isNearbyRow(r) && !isNearbySep(r));
    const hitYear = preciseHit.year;
    const reIdx = real.findIndex(r => r.year === hitYear);
    if (reIdx >= 0) {
      preciseHit.index = reIdx;
    }
    filteredData = insertNearbyRows(filteredData, preciseHit);
  }
  
  // V10.0: 从搜索/筛选回到全表时，回到「最近区间」默认视图
  // （用户此前若点过「加载全部年份」，重新进入全表时仍以常用区间起步，避免每次都被全量拖慢）
  const nowFullMode = !searchQuery.trim() &&
    selectedChinaFilters.size === 0 && selectedChinaEras.size === 0 && selectedJapanFilters.size === 0 &&
    effectiveMode() === 'table';
  if (nowFullMode && !wasFullTableMode) fullTableRange = 'all';
  wasFullTableMode = nowFullMode;

  // V8.2: 按视图模式渲染 (表格/卡片)
  renderByViewMode();
  renderPagination();
  updateStats();
}

// V4.2: 真实行 (剔除临近行/分隔行) 计数与列表
function realFilteredCount() {
  return filteredData.filter(r => !isNearbyRow(r) && !isNearbySep(r)).length;
}
function realFilteredRows() {
  return filteredData.filter(r => !isNearbyRow(r) && !isNearbySep(r));
}

// ========================================
// V4.2 精准查询检测: 年号+年份 / 年号+干支 命中单一目标行
// 返回 { index, year, isJp, eraName, scope } 或 null
//   eraName: 命中的年号名 (如 "道光")
//   scope: 归属范围 (如 "清" / "平安") 用于收集整个年号的年份
// ========================================
function detectPreciseHit(q, rows) {
  if (!q || q.length < 3) return null;
  const gzMatch = extractGanzhi(q);
  let eraKeyword = '';
  let yearNum = null;
  
  if (gzMatch) {
    // 年号+干支: "道光丁酉" -> 道光 + 丁酉
    const gz = gzMatch.ganzhi;
    const before = q.slice(0, q.indexOf(gz[0]));
    const after = q.slice(q.indexOf(gz[1]) + 1);
    eraKeyword = (before + after).trim();
    if (!eraKeyword) return null; // 纯干支不触发
    // 目标年: 该干支年份中, 年号命中且最接近
    const gzRows = rows.filter(r => r.ganzhi === gz);
    let hit = null;
    // V1.3: 同一年号跨政权时，中国朝代优先（先找中国年号命中，再找其他政权）
    const gzEraHit = (r) => (r.cnEraNames || []).some(e => e && e.includes(eraKeyword)) ||
                            (r.jpEraNames || []).some(j => j && j.includes(eraKeyword)) ||
                            (r.jpPeriods || []).some(p => p && p.includes(eraKeyword)) ||
                            (r.cnDynasties || []).some(d => d && d.includes(eraKeyword));
    for (const r of gzRows) {
      if ((r.cnEraNames || []).some(e => e && e.includes(eraKeyword)) && gzEraHit(r)) { hit = r; break; }
    }
    if (!hit) {
      for (const r of gzRows) {
        if (gzEraHit(r)) { hit = r; break; }
      }
    }
    if (!hit) return null;
    // 取命中的年号全名与归属
    const { eraName, scope } = resolveEraScope(hit, eraKeyword);
    return { index: rows.indexOf(hit), year: hit.year, isJp: isJapanEraHit(hit, eraKeyword), eraName, scope };
  }
  
  // 年号+年份: "道光三年" / "道光 3" / "道光1843"
  const eraNames = [];
  for (const row of FULL_DATA) {
    (row.cnEraNames || []).forEach(e => { if (e && e !== '—' && e.length >= 2) eraNames.push(e); });
    (row.jpEraNames || []).forEach(e => { if (e && e !== '—' && e.length >= 2) eraNames.push(e); });
  }
  const uniqEras = [...new Set(eraNames)].sort((a, b) => b.length - a.length);
  for (const era of uniqEras) {
    if (!q.startsWith(era) || q.length <= era.length) continue;
    const rest = q.slice(era.length);
    // 中文数字年份: 道光三年 / 道光十一年 / 道光二十三年
    const cnNumMatch = rest.match(/^([〇零一二三四五六七八九十百]+)年?$/);
    if (cnNumMatch) {
      const n = chineseNumToInt(cnNumMatch[1]);
      if (n >= 1 && n <= 60) {
        // 目标年 = 年号起始年 + n - 1 (按公历推算; 若行命中则直接取行)
        // 先尝试: rows 中 cnEra/jpEra 含 era 的起始行
        let eraRows = rows.filter(r =>
          (r.cnEraNames || []).some(e => e === era) || (r.jpEraNames || []).some(e => e === era));
        // V1.3: 同一年号跨政权时，中国朝代优先（起始年按中国年号计算）
        const cnEraRows = eraRows.filter(r => (r.cnEraNames || []).some(e => e === era));
        if (cnEraRows.length > 0) eraRows = cnEraRows;
        if (eraRows.length > 0) {
          const startRow = eraRows[0];
          const targetYear = startRow.year + n - 1;
          const hit = eraRows.find(r => r.year === targetYear);
          if (hit) {
            const { eraName, scope } = resolveEraScope(hit, era);
            return { index: rows.indexOf(hit), year: hit.year, isJp: isJapanEraHit(hit, era), eraName, scope };
          }
          // 目标年不在结果集 (可能被筛选过滤) — 用起始年所在行
          const { eraName, scope } = resolveEraScope(startRow, era);
          return { index: rows.indexOf(startRow), year: startRow.year, isJp: isJapanEraHit(startRow, era), eraName, scope };
        }
      }
    }
    // 阿拉伯数字年份: 道光3 / 道光1843
    const numMatch = rest.match(/^(\d+)$/);
    if (numMatch) {
      const n = parseInt(numMatch[1], 10);
      if (n >= 1000 && n <= 3000) {
        const hit = rows.find(r => r.year === n &&
          ((r.cnEraNames || []).some(e => e === era) || (r.jpEraNames || []).some(e => e === era)));
        if (hit) {
          const { eraName, scope } = resolveEraScope(hit, era);
          return { index: rows.indexOf(hit), year: hit.year, isJp: isJapanEraHit(hit, era), eraName, scope };
        }
      }
    }
  }
  return null;
}

// 解析命中行的年号全名与归属 (用于收集整个年号的年份)
// 优先: 行内 cnEraNames/jpEraNames 精确包含 keyword 的年号; scope = 该行所在朝代/时代
function resolveEraScope(row, keyword) {
  const cn = (row.cnEraNames || []).filter(e => e && e !== '—');
  const jp = (row.jpEraNames || []).filter(e => e && e !== '—');
  // 精确匹配优先, 其次包含
  let eraName = cn.find(e => e === keyword) || jp.find(e => e === keyword)
             || cn.find(e => e.includes(keyword)) || jp.find(e => e.includes(keyword));
  if (!eraName) eraName = keyword;
  let scope = '';
  const cnDyn = (row.cnDynasties || []).find(d => d && d !== '—');
  const jpPer = (row.jpPeriods || []).find(p => p && p !== '—');
  if (cn.some(e => e === eraName || e.includes(keyword))) scope = cnDyn || '';
  else if (jp.some(e => e === eraName || e.includes(keyword))) scope = jpPer || '';
  return { eraName, scope };
}

// 中文数字转整数 (一~九十九; 支持 十/廿/三十/四十三 等)
function chineseNumToInt(s) {
  const digits = { '〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,
    '十':10,'廿':20,'卅':30 };
  if (s === '十') return 10;
  if (s === '廿') return 20;
  if (s === '卅') return 30;
  if (s.length === 1) return digits[s] !== undefined ? digits[s] : NaN;
  // 两位/三位: X十Y / 十Y / X十
  const hasShi = s.indexOf('十');
  if (hasShi === -1) {
    // 纯数字串 (十以下)
    let n = 0;
    for (const ch of s) { if (digits[ch] === undefined || digits[ch] >= 10) return NaN; n = n * 10 + digits[ch]; }
    return n;
  }
  let n = 0;
  if (hasShi === 0) {
    n = 10;
  } else {
    const first = digits[s[0]];
    if (first === undefined || first >= 10) return NaN;
    n = first * 10;
  }
  if (hasShi === s.length - 1) return n;
  const last = digits[s[s.length - 1]];
  if (last === undefined || last >= 10) return NaN;
  return n + last;
}

// 该行是否命中日本年号关键词 (用于闪烁提醒)
function isJapanEraHit(row, keyword) {
  return (row.jpEraNames || []).some(j => j && j !== '—' && j.includes(keyword)) ||
         (row.jpPeriods || []).some(p => p && p !== '—' && p.includes(keyword));
}

// V4.2: 精准命中行标记 (模块级, 不污染 FULL_DATA)
// key: row 对象引用 -> { precise: true, jpFlash: bool }
let preciseHitMark = new Map();

// V4.2: 在命中行后插入「整个年号」的全部年份 (命中年置顶, 其余年份随后列出)
// 注意: 不修改 FULL_DATA 行对象, 临近行以克隆形式插入, 精准/闪烁标记用模块级状态
function insertNearbyRows(rows, hitMeta) {
  const hitRow = rows[hitMeta.index];
  // 记录命中行标记 (深色强调 + 日本闪烁)
  if (hitRow) {
    preciseHitMark.set(hitRow, { precise: true, jpFlash: !!hitMeta.isJp });
  }
  
  // 收集该年号在归属范围内的全部年份行 (如 道光 → 清 1821~1850 全部)
  // 命中年置顶, 其余按年份升序列出
  const nearby = [];
  const seen = new Set();
  if (hitMeta.eraName) {
    const era = hitMeta.eraName;
    const scope = hitMeta.scope || '';
    const eraRows = [];
    for (const r of FULL_DATA) {
      if (seen.has(r.year)) continue;
      const cnHit = (r.cnEraNames || []).some(e => e === era) &&
                    (!scope || (r.cnDynasties || []).some(d => d === scope));
      const jpHit = (r.jpEraNames || []).some(e => e === era) &&
                    (!scope || (r.jpPeriods || []).some(p => p === scope));
      if (cnHit || jpHit) { eraRows.push(r); seen.add(r.year); }
    }
    // 排序: 命中年置顶, 其余按年份升序
    eraRows.sort((a, b) => {
      if (a.year === hitMeta.year) return -1;
      if (b.year === hitMeta.year) return 1;
      return a.year - b.year;
    });
    eraRows.forEach(r => {
      if (r.year === hitMeta.year) return; // 命中行本身保留在原位
      nearby.push({ row: r, offset: r.year - hitMeta.year });
    });
  }
  
  if (nearby.length === 0) return rows;
  
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    if (i === hitMeta.index) {
      out.push(rows[i]);
      // 隔行插入分组标签
      out.push({ __nearbySep: true });
      nearby.forEach(n => out.push(Object.assign({}, n.row, { __nearby: n.offset })));
    } else {
      out.push(rows[i]);
    }
  }
  return out;
}

// V4.2: 渲染时判断行是否临近行/分隔行
function isNearbyRow(row) { return !!(row && row.__nearby); }
function isNearbySep(row) { return !!(row && row.__nearbySep); }
function nearbyOffset(row) { return row.__nearby || 0; }

// V4.2: 重名年号提醒框 (表头上方)
// 命中重名年号 (中国内部跨朝代 或 中日之间) 时展示
let lastEraAlert = null; // { name, html } 缓存去重
function updateEraAlert(query) {
  const alertEl = document.getElementById('eraAlert');
  if (!alertEl) return;
  if (!query || !query.trim()) {
    alertEl.classList.remove('show');
    alertEl.innerHTML = '';
    lastEraAlert = null;
    return;
  }
  const q = toSimplified(query.trim()).toLowerCase();
  
  // V8.3: 干支错写提醒 (如 "巳巳" → "己巳", "巳卯" → "己卯")
  // 先于年号重名检测: 若查询本身含疑似错写干支, 优先提示修正
  const typo = detectGanzhiTypo(q);
  if (typo) {
    // 列出正确干支对应的所有年份
    const rows = FULL_DATA.filter(r => r.ganzhi === typo.corrected);
    const years = rows.map(r => toDisplay(r.yearStr)).join('、');
    const gzYear = rows.length > 0
      ? `<br><span style="color:var(--color-text-secondary);">${toDisplay('对应年份')}：</span><span class="ea-gz-years">${years}</span>`
      : '';
    const html = `<span class="ea-title">${toDisplay('干支错写提醒')}</span>`
      + `${toDisplay('古籍中常见「巳」误写，您输入的「')}${toDisplay(typo.original)}${toDisplay('」应为「')}${toDisplay(typo.corrected)}${toDisplay('」。')}`
      + gzYear;
    if (!(lastEraAlert && lastEraAlert.name === 'typo:' + typo.original)) {
      lastEraAlert = { name: 'typo:' + typo.original };
      alertEl.innerHTML = html;
      alertEl.classList.add('show');
    }
    return;
  }
  
  // 提取查询中的年号关键词 (从搜索词中找命中的年号)
  const eraName = findEraNameInQuery(q);
  if (!eraName) {
    alertEl.classList.remove('show');
    alertEl.innerHTML = '';
    lastEraAlert = null;
    return;
  }
  
  // 收集该年号所有出现 (中国朝代 + 其他朝代/政权 + 年份区间)
  // V4.3: 用 ERA_CN_SCOPE/ERA_JP_SCOPE 归属映射 (直接从朝代/时代数据生成),
  //       避免 1644 年明亡清立等跨政权年份把年号误归给多个政权
  const cnOcc = ERA_CN_SCOPE.get(eraName) || new Map();
  const jpOcc = ERA_JP_SCOPE.get(eraName) || new Map();

  const totalOcc = cnOcc.size + jpOcc.size;
  const hasCrossCn = cnOcc.size > 1;          // 中国内部跨朝代重名
  const hasCrossJp = jpOcc.size > 1;          // 其他朝代内部跨政权重名
  const hasCnJp = cnOcc.size > 0 && jpOcc.size > 0; // 中国与其他朝代重名

  if (totalOcc <= 1) {
    alertEl.classList.remove('show');
    alertEl.innerHTML = '';
    lastEraAlert = null;
    return;
  }

  const fmtRange = r => (r[0] < 0 ? '前' + Math.abs(r[0]) : r[0]) + '–' + (r[1] < 0 ? '前' + Math.abs(r[1]) : r[1]);
  const cnTags = [...cnOcc.entries()].map(([d, r]) =>
    `<span class="ea-tag">${toDisplay(d)} ${fmtRange(r)}</span>`).join('');
  const jpTags = [...jpOcc.entries()].map(([p, r]) =>
    `<span class="ea-tag ea-jp">${toDisplay(p)} ${fmtRange(r)}</span>`).join('');

  let reason = '';
  if (hasCnJp) reason = '「' + toDisplay(eraName) + '」同時是中國與其他朝代（日本、朝鮮、越南等）年號，請注意區分所查對象！';
  else if (hasCrossCn) reason = '「' + toDisplay(eraName) + '」在中國歷史上被多個朝代使用，請確認朝代！';
  else if (hasCrossJp) reason = '「' + toDisplay(eraName) + '」在其他朝代（日本、朝鮮、越南等）中被多個政權使用，請確認政權！';
  else reason = '「' + toDisplay(eraName) + '」存在重名，請注意區分！';
  
  const html = `<span class="ea-title">年號提醒</span>${reason}<br><span style="color:var(--color-text-secondary);">出現：</span>${cnTags}${jpTags}`;
  if (lastEraAlert && lastEraAlert.name === eraName) return; // 同一年号不重复重绘
  lastEraAlert = { name: eraName };
  alertEl.innerHTML = html;
  alertEl.classList.add('show');
}

// 从查询词中提取年号关键词 (最长匹配)
function findEraNameInQuery(q) {
  if (!q) return null;
  const eraNames = new Set();
  for (const row of FULL_DATA) {
    (row.cnEraNames || []).forEach(e => { if (e && e !== '—') eraNames.add(e); });
    (row.jpEraNames || []).forEach(e => { if (e && e !== '—') eraNames.add(e); });
  }
  const list = [...eraNames].sort((a, b) => b.length - a.length);
  for (const era of list) {
    if (q.includes(era)) return era;
  }
  return null;
}

// V1.3: 检索年号时，同一年号可能被中国、日本及其他地区共同使用：
// 按 中国 → 日本 → 其他地区 的既有目标排序，保证中国朝代的结果优先展示。
function rowEraRegionRank(row, eraName) {
  if (!eraName) return 0;
  if ((row.cnEraNames || []).some(e => e === eraName)) return 0;           // 中国
  if ((row._v3jp || []).some(e => String(e.era || '').indexOf(eraName) === 0)) return 1; // 日本
  if ((row._v3ot || []).some(e => String(e.era || '').indexOf(eraName) === 0)) return 2; // 其他地区
  return 0;
}

function sortData() {
  // V4.2: 临近行/分隔行不参与排序 (保持跟随命中行的相对顺序)
  const real = filteredData.filter(r => !isNearbyRow(r) && !isNearbySep(r));
  // V1.3: 仅检索年号时启用「中国优先」；按年份浏览/年份查询时仍保持纯纪年顺序
  const q = (searchQuery || '').trim();
  const eraName = q ? findEraNameInQuery(toSimplified(q).toLowerCase()) : null;
  real.sort((a, b) => {
    if (eraName) {
      const ra = rowEraRegionRank(a, eraName);
      const rb = rowEraRegionRank(b, eraName);
      if (ra !== rb) return ra - rb;   // 中国 → 日本 → 其他地区
    }
    if (sortDir === 'asc') return a.year - b.year;
    return b.year - a.year;
  });
  filteredData = real;
}

// ========================================
// Table Rendering
// ========================================
function highlightText(text, query) {
  if (!query || !query.trim() || !text) return escapeHtml(String(text));
  const q = query.trim();
  const escaped = escapeHtml(String(text));
  // Simple case-insensitive highlight
  const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return escaped.replace(regex, '<mark class="search-highlight">$1</mark>');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// V8.0: 在位君主列 — 默认省略显示, 鼠标悬停/聚焦时展示完整君主名
function renderRulerHover(text) {
  if (!text || text === '—') return '—';
  const disp = toDisplay(text);
  return `<span class="ruler-hover" tabindex="0" title="${escapeHtml(disp)}"><span class="ruler-mask">${escapeHtml(disp)}</span><span class="ruler-name">${escapeHtml(disp)}</span></span>`;
}

// V8.0: 其他朝代列 (日本+周边政权) — 政权名渲染为徽标, 高亮保持
function renderPeriodTags(text, q) {
  if (!text || text === '—') return '—';
  const parts = String(text).split('、').filter(Boolean);
  return parts.map(p => `<span class="ot-state-tag">${highlightText(toDisplay(p), q)}</span>`).join('');
}

// ========================================
// V10.0 单行表格 HTML 构建 (renderTable 分页模式 / renderFullTable 全表模式共用)
// 从原 renderTable 的 map 回调原样抽出，行为不变
// ========================================
function buildTableRowHtml(row, q) {
  // V4.3: 分隔行 (居中横线, 其下小字标题 + 年号全部年份)
  if (isNearbySep(row)) {
    return `<tr class="nearby-sep-row" role="row"><td colspan="10"><span class="nearby-sep" aria-hidden="true"></span><span class="nearby-label">${toDisplay('该年号下的所有年份')}</span></td></tr>`;
  }
  // V8.2: 大事记区块 (稀疏渲染, 无数据返回 '')
  const evBlock = renderEventsBlock(row.year, q);
  const evSub = evBlock ? `<tr class="event-subrow" role="row"><td colspan="10">${evBlock}</td></tr>` : '';
  // V4.2: 临近行 (同一年号其他年份, 弱化)
  if (isNearbyRow(row)) {
    return `<tr class="nearby-row" role="row">
      <td class="cell-year">${highlightText(toDisplay(row.yearStr), q)}</td>
      <td class="cell-ganzhi">${highlightText(toDisplay(row.ganzhi), q)}</td>
      <td class="cell-cn-era">${highlightHtml(toDisplayHtml(row.cnEra), q)}</td>
      <td class="cell-cn-dynasty">${highlightText(toDisplay(row.cnDynasty), q)}</td>
      <td class="cell-cn-ruler">${highlightText(toDisplay(row.cnRuler), q)}</td>
      <td class="cell-jp-period">${renderPeriodTags(row.jpPeriod, q)}</td>
      <td class="cell-jp-era">${highlightHtml(toDisplayHtml(row.jpEra), q)}</td>
      <td class="cell-jp-ruler">${renderRulerHover(row.jpRuler)}</td>
      <td class="cell-notes">${highlightText(toDisplay(row.notes), q)}</td>
      <td class="cell-zodiac">${highlightText(toDisplay(row.zodiac), q)}</td>
    </tr>${evSub}`;
  }
  // V4.2: 精准命中行标记 (描边 + 日本闪烁)
  const mark = preciseHitMark.get(row) || null;
  const preciseCls = mark && mark.precise ? ' precise-hit-row' : '';
  // V8.3: 干支错写修正命中行弱高亮
  const typoCls = (window.__ganzhiTypoCorrected && row.ganzhi === window.__ganzhiTypoCorrected.corrected) ? ' typo-hit-row' : '';
  let jpFlash = mark && mark.jpFlash ? ' jp-flash-cell' : '';
  // 日本专属年号整体命中: 若行内日本年号含查询年号且非中国年号 → 闪烁
  if (!jpFlash && searchQuery.trim()) {
    const qq = toSimplified(searchQuery.trim()).toLowerCase();
    const eraN = findEraNameInQuery(qq);
    if (eraN && !ALL_CN_ERAS.has(eraN) && JP_ONLY_ERAS.has(eraN) &&
        (row.jpEraNames || []).some(e => e === eraN)) {
      jpFlash = ' jp-flash-cell';
    }
  }
  const yearClass = row.year < 0 ? 'cell-year bc' : 'cell-year';
  return `<tr role="row" class="${preciseCls.trim()}${typoCls}">
    <td class="${yearClass}">${highlightText(toDisplay(row.yearStr), q)}</td>
    <td class="cell-ganzhi">${highlightText(toDisplay(row.ganzhi), q)}</td>
    <td class="cell-cn-era">${highlightHtml(toDisplayHtml(row.cnEra), q)}</td>
    <td class="cell-cn-dynasty">${highlightText(toDisplay(row.cnDynasty), q)}</td>
    <td class="cell-cn-ruler">${highlightText(toDisplay(row.cnRuler), q)}</td>
    <td class="cell-jp-period">${renderPeriodTags(row.jpPeriod, q)}</td>
    <td class="cell-jp-era${jpFlash}">${highlightHtml(toDisplayHtml(row.jpEra), q)}</td>
    <td class="cell-jp-ruler">${renderRulerHover(row.jpRuler)}</td>
    <td class="cell-notes">${highlightText(toDisplay(row.notes), q)}</td>
    <td class="cell-zodiac">${highlightText(toDisplay(row.zodiac), q)}</td>
  </tr>${evSub}`;
}

// ========================================
// V10.0 全表渲染 (默认视图)
// 打开页面 / 清空搜索与筛选后，渲染「年份表格」。
//   · V1.0：默认就是「全部年份」，仍分段渲染（首段同步出内容，其余逐帧补）；
//   · 点击「加载全部年份」后 fullTableRange='all'，从头分段插入全部年份；
//   · 分段插入：首段同步出内容，其余逐段补，避免一次性插入上万节点卡死；
//   · 完成时写入 window.__fullTableStats，便于自检/诊断。
// ========================================
function renderFullTable() {
  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const tableWrapper = document.getElementById('tableWrapper');
  const pagination = document.getElementById('pagination');
  const loadingOverlay = document.getElementById('loadingOverlay');

  // 重名年号提醒框 (全表无查询词 → 清空)
  updateEraAlert('');

  if (!filteredData || filteredData.length === 0) {
    tbody.innerHTML = '';
    emptyState.classList.add('active');
    tableWrapper.style.display = 'none';
    if (pagination) pagination.style.display = 'none';
    document.getElementById('emptyStateMsg').textContent = '暂无数据';
    return;
  }

  emptyState.classList.remove('active');
  tableWrapper.style.display = '';
  if (pagination) { pagination.innerHTML = ''; pagination.style.display = 'none'; }
  document.body.classList.add('is-full-table');

  // 作废上一次尚未完成的分段任务
  fullTableSeq++;
  const seq = fullTableSeq;
  if (fullTableTimer) { clearTimeout(fullTableTimer); fullTableTimer = null; }

  const nAll = filteredData.length;
  const isAll = fullTableRange === 'all' || nAll <= FULL_TABLE_DEFAULT_SPAN;
  const startIdx = isAll ? 0 : Math.max(0, nAll - FULL_TABLE_DEFAULT_SPAN);
  const rows = isAll ? filteredData : filteredData.slice(startIdx);
  const total = rows.length;
  const chunk = isAll ? FULL_TABLE_CHUNK_ALL : FULL_TABLE_CHUNK;
  const q = queryForDisplay('');
  const stats = window.__fullTableStats = {
    total: total, allTotal: nAll, startIdx: startIdx, isAll: isAll,
    firstYear: total ? rows[0].yearStr : null,
    lastYear: total ? rows[total - 1].yearStr : null,
    seq: seq, chunk: chunk,
    startedAt: performance.now(), firstChunkMs: null, totalMs: null, done: false, chunks: 0, chunkTimings: []
  };
  document.body.classList.toggle('ft-all-loaded', isAll);
  updateFullTableControls();

  tbody.innerHTML = '';
  loadingOverlay.classList.add('active');

  let idx = 0;
  const pushChunk = () => {
    const c0 = performance.now();
    const end = Math.min(idx + chunk, total);
    const parts = new Array(end - idx);
    let k = 0;
    for (; idx < end; idx++) parts[k++] = buildTableRowHtml(rows[idx], q);
    const buildMs = performance.now() - c0;
    tbody.insertAdjacentHTML('beforeend', parts.join(''));
    stats.chunks++;
    stats.chunkTimings.push(+(performance.now() - c0).toFixed(1));
    if (!stats.buildTimings) stats.buildTimings = [];
    stats.buildTimings.push(+buildMs.toFixed(1));
    return idx >= total;
  };

  // 首段同步插入 (立即出内容)，随后隐藏 loading，剩余分段逐帧补
  const finishedFirst = pushChunk();
  stats.firstChunkMs = performance.now() - stats.startedAt;
  loadingOverlay.classList.remove('active');
  if (!finishedFirst) {
    const tick = () => {
      if (seq !== fullTableSeq) return; // 已被新的渲染取代
      const done = pushChunk();
      updateFullTableProgress(idx, total);
      if (!done) {
        fullTableTimer = setTimeout(tick, 0);
      } else {
        fullTableTimer = null;
        stats.totalMs = performance.now() - stats.startedAt;
        stats.done = true;
        updateStats();
      }
    };
    fullTableTimer = setTimeout(tick, 0);
  } else {
    stats.totalMs = stats.firstChunkMs;
    stats.done = true;
    updateStats();
  }
}

function renderTable() {
  // V10.0: 早先的全表分段任务若未结束，先作废，避免旧行被追加进本次分页结果
  cancelFullTableRender();
  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');
  const tableWrapper = document.getElementById('tableWrapper');
  const pagination = document.getElementById('pagination');
  const loadingOverlay = document.getElementById('loadingOverlay');
  
  // V4.2: 重名年号提醒框 (表头上方)
  updateEraAlert(searchQuery);
  
  if (!filteredData || filteredData.length === 0) {
    tbody.innerHTML = '';
    emptyState.classList.add('active');
    tableWrapper.style.display = 'none';
    pagination.style.display = 'none';
    
    let msg = '未找到匹配的记录';
    if (searchQuery.trim()) {
      msg = '未找到包含"' + searchQuery.trim() + '"的记录，请尝试其他关键词';
    } else if (selectedChinaFilters.size > 0 || selectedJapanFilters.size > 0) {
      msg = '当前筛选条件下没有匹配记录，请放宽筛选条件';
    }

  emptyState.classList.remove('active');
  tableWrapper.style.display = '';
  pagination.style.display = '';
  
  // V8.2: 分页窗口计算提取为共享函数 (renderTable / renderCardView 共用)
  const { finalPage } = computeFinalPage();
  
  loadingOverlay.classList.add('active');
  
  // Each row now maps to exactly one year — eras merged in cells, no multi-row
  requestAnimationFrame(() => {
    const q = queryForDisplay(searchQuery);
    const fragments = finalPage.map(row => buildTableRowHtml(row, q));
    
    tbody.innerHTML = fragments.join('');
    loadingOverlay.classList.remove('active');

}

// ============================================================
// v3 单年区域对照表（对齐 设计原型\桌面版-v3.html 的 query 视图）
// ------------------------------------------------------------
// 当检索/筛选后只剩 1 个年份、且处于桌面表格视图时，把该年展开成
// 「中国 → 日本 → 其他地区」的区域行：区域 / 朝代·幕府 / 年号 / 君主 / 干支 / 公元起止。
// 全表（2,868 年）与多行结果仍用年份表格，避免把全表撑成上万行。
// ============================================================
const V3_KR_STATES = ['高句丽', '新罗', '泰封', '后百济', '高丽', '朝鲜王朝', '渤海'];
const V3_VN_STATES = ['前李朝', '丁朝', '前黎朝', '李朝', '陈朝', '胡朝', '后黎朝', '莫朝', '后黎朝(后期)', '阮朝'];

function v3Uniq(arr) {
  return [...new Set(arr.filter(v => v !== null && v !== undefined && String(v).trim() !== ''))];
}
function v3EraText(list) {
  return v3Uniq(list.map(e => (e.era && !/^[—-]/.test(e.era)) ? e.era : '无年号')).join('、');
}
function v3RulerText(list) {
  const parts = v3Uniq(list.map(e => e.ruler));
  return parts.length ? parts.join('、') : '—';
}

// 单一年份 → 区域行数组
function v3AreaRowsForYear(row) {
  if (!row) return [];
  const out = [];
  const yearStr = toDisplay(row.yearStr);
  const span = yearStr + toDisplay(' 全年');
  const gz = toDisplay(row.ganzhi || '—');

  if (row._v3cn && row._v3cn.length) {
    out.push({
      area: toDisplay('中国'),
      dyn: toDisplay(v3Uniq(row._v3cn.map(e => e.dynasty)).join('、') || '—'),
      era: toDisplay(v3EraText(row._v3cn) || '—'),
      ruler: toDisplay(v3RulerText(row._v3cn)),
      gz, span
    });
  }
  if (row._v3jp && row._v3jp.length) {
    out.push({
      area: toDisplay('日本'),
      dyn: toDisplay(v3Uniq(row._v3jp.map(e => e.period)).join('、') || '—'),
      era: toDisplay(v3EraText(row._v3jp) || '—'),
      ruler: toDisplay(v3RulerText(row._v3jp)),
      gz, span
    });
  }
  // 其他政权：按政权（state）归并，“朝鲜 / 越南”单独标区域
  if (row._v3ot && row._v3ot.length) {
    const byState = new Map();
    for (const e of row._v3ot) {
      const k = e.state || '其他地区';
      if (!byState.has(k)) byState.set(k, []);
      byState.get(k).push(e);
    }
    for (const [state, list] of byState) {
      let area = '其他地区';
      if (V3_KR_STATES.indexOf(state) >= 0) area = '朝鲜';
      else if (V3_VN_STATES.indexOf(state) >= 0) area = '越南';
      out.push({
        area: toDisplay(area),
        dyn: toDisplay(state),
        era: toDisplay(v3EraText(list) || '—'),
        ruler: toDisplay(v3RulerText(list)),
        gz, span
      });
    }
  }
  return out;
}

// 从 renderTable 提取的分页窗口计算 (renderTable 与 renderCardView 共用)
// 返回 { finalPage, totalPages, realRows, pageReal }
function computeFinalPage() {
  const realRows = filteredData.filter(r => !isNearbyRow(r) && !isNearbySep(r));
  const totalPages = Math.ceil(realRows.length / perPage);
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * perPage;
  const pageReal = realRows.slice(startIdx, startIdx + perPage);
  const pageRealSet = new Set(pageReal);
  const pageData = [];
  let prevRealRowRef = null;
  for (const r of filteredData) {
    if (isNearbyRow(r) || isNearbySep(r)) {
      if (pageRealSet.has(prevRealRowRef)) pageData.push(r);
    } else {
      prevRealRowRef = r;
      if (pageRealSet.has(r)) pageData.push(r);
    }
  }
  const finalPage = pageData.length > 0 ? pageData : pageReal;
  return { finalPage, totalPages, realRows, pageReal };
}

// 大事记区块 HTML (表格子行 / 卡片区块共用; 无数据返回 '')
function renderEventsBlock(year, q) {
  if (typeof window.getEventsForYear !== 'function') return '';
  const list = window.getEventsForYear(year);
  if (!list || list.length === 0) return '';
  const ql = q ? q.trim() : '';
  const items = list.map(it => {
    const title = toDisplay(it.title || '');
    const desc = toDisplay(it.desc || '');
    const metaParts = [];
    if (it.category) metaParts.push(toDisplay(it.category));
    if (it.source) metaParts.push('来源：' + toDisplay(it.source));
    const meta = metaParts.length ? '<div class="event-meta">' + metaParts.join(' · ') + '</div>' : '';
    return '<div class="event-item">' +
      '<div class="event-title">' + highlightText(title, ql) + '</div>' +
      (desc ? '<div class="event-desc">' + highlightText(desc, ql) + '</div>' : '') +
      meta +
      '</div>';
  }).join('');
  return '<div class="events-block"><div class="events-block-title">' + toDisplay('大事记') + '</div>' + items + '</div>';
}

      }

// 单卡片渲染
function renderOneCard(row, q, isNearby) {
  const mark = preciseHitMark.get(row) || null;
  const preciseCls = mark && mark.precise ? ' precise' : '';
  // V8.3: 干支错写修正命中行 (如 "巳巳" → 己巳年) 弱高亮
  const typoCls = (window.__ganzhiTypoCorrected && row.ganzhi === window.__ganzhiTypoCorrected.corrected) ? ' typo-hit' : '';
  let jpFlash = mark && mark.jpFlash ? ' era-flash' : '';
  if (!jpFlash && searchQuery.trim()) {
    const qq = toSimplified(searchQuery.trim()).toLowerCase();
    const eraN = findEraNameInQuery(qq);
    if (eraN && !ALL_CN_ERAS.has(eraN) && JP_ONLY_ERAS.has(eraN) &&
        (row.jpEraNames || []).some(e => e === eraN)) {
      jpFlash = ' era-flash';
    }
  }
  const yearClass = row.year < 0 ? 'yc-year bc' : 'yc-year';
  const nearbyCls = isNearby ? ' year-card-nearby' : '';
  const yearStr = toDisplay(row.yearStr);
  // V8.3: 年号行直接复用行内 HTML (含每个年号独立复制按钮)
  const cnEraHtml = cardEraRows(row.cnEra, q);
  const jpEraHtml = cardEraRows(row.jpEra, q);

  let eventsHtml = '';
  if (typeof window.getEventsForYear === 'function') {
    const evHtml = renderEventsBlock(row.year, q);
    if (evHtml) eventsHtml = '<div class="yc-events">' + evHtml + '</div>';
  }

  return `<div class="year-card${preciseCls}${nearbyCls}${typoCls}">
    <div class="yc-top">
      <span class="${yearClass}">${highlightText(yearStr, q)}</span>
      <span class="yc-ganzhi">${highlightText(toDisplay(row.ganzhi), q)}</span>
      <span class="yc-zodiac">${toDisplay(row.zodiac)}</span>
    </div>
    <div class="yc-block">
      <div class="yc-block-label">${toDisplay('中国')}</div>
      <!-- V8.3: 直接渲染内嵌年号行 (含每个年号独立复制按钮, 与表格一致) -->
      <div class="yc-era-rows">${cnEraHtml}</div>
      <div class="yc-meta">${highlightText(toDisplay(row.cnDynasty), q)}${row.cnRuler && row.cnRuler !== '—' ? ' · ' + highlightText(toDisplay(row.cnRuler), q) : ''}</div>
    </div>
    <div class="yc-block jp">
      <div class="yc-block-label">${toDisplay('其他朝代')}</div>
      <div class="yc-era-rows${jpFlash}">${jpEraHtml}</div>
      <div class="yc-meta">${highlightText(toDisplay(row.jpPeriod), q)}${row.jpRuler && row.jpRuler !== '—' ? ' · ' + highlightText(toDisplay(row.jpRuler), q) : ''}</div>
    </div>
    ${row.notes && row.notes !== '—' ? '<div class="yc-notes">' + highlightHtml(toDisplayHtml(row.notes), q) + '</div>' : ''}
    ${eventsHtml}
  </div>`;
}

// V8.3: 卡片内年号行渲染 — 直接使用行内已构建的 era HTML (含独立复制按钮)
// 但行内 HTML 是为表格 .era-entry 构建的, 卡片需要包裹容器样式
// 说明: cnEra/jpEra 已含 <span class="era-entry">...</span> 结构, 直接复用
function cardEraRows(html, q) {
  if (!html || html === '—') return '<div class="yc-empty">—</div>';
  return highlightHtml(toDisplayHtml(html), q);
}

// Highlight text that may contain HTML tags (preserve tags, highlight only text)
function highlightHtml(html, query) {
  if (!query || !query.trim() || !html || html === '—') return html;
  const q = query.trim();
  return html.replace(/>([^<]*)</g, (match, text) => {
    const highlighted = text.replace(
      new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'),
      '<mark class="search-highlight">$1</mark>'
    );
    return '>' + highlighted + '<';
  });
}

// ========================================
// Pagination
// ========================================
function renderPagination() {
  const container = document.getElementById('pagination');
  const pagerRow = document.getElementById('pagerRow');
  const summary = document.getElementById('pagerSummary');
  const v3 = document.body.classList.contains('v3-year');
  const full = isFullTableMode();
  const n = realFilteredRows().length;

  // v3 单年区域表自带页脚；全表连续展示不需要分页条
  if (v3 || full || n === 0) {
    if (pagerRow) pagerRow.hidden = true;
    container.innerHTML = '';
    container.style.display = '';
    if (summary) summary.textContent = '';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(n / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  if (pagerRow) pagerRow.hidden = false;
  container.style.display = '';
  if (summary) {
    summary.textContent = toDisplay('共') + ' ' + n.toLocaleString() + ' ' + toDisplay('条') +
      ' · ' + toDisplay('第') + ' ' + currentPage + ' / ' + totalPages + ' ' + toDisplay('页');
  }

  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  
  let html = '';
  
  // Prev button
  html += `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} data-page="${currentPage - 1}" aria-label="上一页">‹</button>`;
  
  // Page numbers
  const maxButtons = 7;
  let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
  let endPage = Math.min(totalPages, startPage + maxButtons - 1);
  if (endPage - startPage < maxButtons - 1) {
    startPage = Math.max(1, endPage - maxButtons + 1);
  }
  
  if (startPage > 1) {
    html += `<button class="page-btn" data-page="1">1</button>`;
    if (startPage > 2) html += `<span class="page-ellipsis">…</span>`;
  }
  
  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
  }
  
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += `<span class="page-ellipsis">…</span>`;
    html += `<button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
  }
  
  // Next button
  html += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} data-page="${currentPage + 1}" aria-label="下一页">›</button>`;
  
  container.innerHTML = html;
  
  // Attach events
  container.querySelectorAll('.page-btn:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', function() {
      const page = parseInt(this.dataset.page);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderByViewMode();
        renderPagination();
        const target = document.getElementById('resultCard') || document.getElementById('tableWrapper');
        if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
      }
    });
  });
}
