<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%232b3a67'/%3E%3Ctext%20x='16'%20y='22'%20font-size='17'%20text-anchor='middle'%20fill='%23fff'%20font-family='serif'%3E%E6%BC%A2%3C/text%3E%3C/svg%3E">
<title>网站嵌入 — 日本汉籍编目工具</title>
<style>
:root{--color-bg:#fafafa;--color-bg-alt:#f5f5f5;--color-surface:#fff;--color-surface-hover:#f5f5f5;--color-primary:#171717;--color-primary-light:#404040;--color-accent:#171717;--color-accent-light:#404040;--color-text:#0a0a0a;--color-text-secondary:#525252;--color-text-muted:#737373;--color-border:#e5e5e5;--color-border-light:#eee;--color-divider:#f0f0f0;--color-highlight:#f5f5f5;--color-highlight-text:#0a0a0a;--color-table-header:#171717;--color-table-header-text:#fafafa;--color-shadow:rgba(0,0,0,.05);--color-shadow-lg:rgba(0,0,0,.09);--font-display:'Noto Serif SC','SimSun','STSong',serif;--font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--transition-fast:150ms cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.16,1,.3,1);--radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-xl:12px;--shadow-sm:0 1px 2px var(--color-shadow);--shadow-md:0 2px 8px -2px var(--color-shadow),0 1px 3px rgba(0,0,0,.04);--shadow-lg:0 8px 30px -6px var(--color-shadow-lg),0 2px 8px rgba(0,0,0,.04)}
[data-theme="dark"]{--color-bg:#0a0a0a;--color-bg-alt:#141414;--color-surface:#171717;--color-surface-hover:#262626;--color-primary:#e5e5e5;--color-primary-light:#fafafa;--color-accent:#fafafa;--color-text:#fafafa;--color-text-secondary:#d4d4d4;--color-text-muted:#a3a3a3;--color-border:rgba(255,255,255,.1);--color-border-light:rgba(255,255,255,.07);--color-divider:rgba(255,255,255,.07);--color-highlight:#262626;--color-highlight-text:#fafafa}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);font-size:.9375rem;line-height:1.65;color:var(--color-text);background:var(--color-bg);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:var(--color-text-muted);border-radius:4px}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}

/* Header (四页一致) */
.app-header{background:color-mix(in srgb,var(--color-bg) 80%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--color-text);padding:.8rem 0;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--color-border-light);animation:hdrIn .5s var(--ease-spring)}
@keyframes hdrIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.header-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;flex-shrink:0}
.header-brand .bi{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--color-primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1rem;color:var(--color-bg);font-weight:700}
.header-brand h1{font-family:var(--font-display);font-size:1.1rem;color:var(--color-text);white-space:nowrap}
.header-nav{display:flex;gap:.25rem;flex-shrink:0}
.header-nav a{color:var(--color-text-muted);text-decoration:none;font-size:.85rem;font-weight:500;padding:.35rem .75rem;border-radius:var(--radius-sm);transition:all var(--transition-fast);white-space:nowrap}
.header-nav a:hover{color:var(--color-text);background:var(--color-surface-hover)}
.header-nav a.active{color:var(--color-text);background:var(--color-bg-alt);font-weight:600}
.header-actions{margin-left:auto;display:flex;gap:.5rem}
.btn-icon{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast);font-size:1rem}
.btn-icon:hover{background:var(--color-surface-hover);color:var(--color-text)}

/* 导航下拉 (说明文档) */
.nav-dropdown{position:relative;flex-shrink:0}
.nav-dropdown-btn{display:inline-flex;align-items:center;gap:.1rem;color:var(--color-text-muted);font-size:.85rem;font-weight:500;font-family:var(--font-body);padding:.35rem .75rem;border-radius:var(--radius-sm);transition:all var(--transition-fast);white-space:nowrap;border:none;background:none;cursor:pointer}
.nav-dropdown-btn:hover{color:var(--color-text);background:var(--color-surface-hover)}
.nav-dropdown-btn.active{color:var(--color-text);background:var(--color-bg-alt);font-weight:600}
.nav-dropdown-btn svg{transition:transform var(--transition-fast)}
.nav-dropdown:hover .nav-dropdown-btn svg,.nav-dropdown:focus-within .nav-dropdown-btn svg{transform:rotate(180deg)}
.nav-dropdown-menu{position:absolute;top:100%;left:0;margin-top:6px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);min-width:132px;padding:.3rem;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s var(--ease-spring),visibility .18s var(--ease-spring),transform .18s var(--ease-spring);z-index:210}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.nav-dropdown-menu a{display:block;padding:.45rem .75rem;border-radius:var(--radius-sm);color:var(--color-text-secondary);font-size:.85rem;text-decoration:none;transition:all var(--transition-fast);white-space:nowrap}
.nav-dropdown-menu a:hover{background:var(--color-surface-hover);color:var(--color-text)}
.nav-dropdown-menu a.active{color:var(--color-text);font-weight:600;background:var(--color-bg-alt)}

/* ===== 嵌入页主体 ===== */
.page{max-width:1400px;margin:0 auto;padding:1.25rem 1.5rem 2.5rem;width:100%;flex:1;animation:pageIn .45s var(--ease-spring) .08s backwards;display:flex;flex-direction:column}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-head{display:flex;align-items:baseline;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
.page-head h2{font-family:var(--font-display);font-size:1.3rem;color:var(--color-primary)}
.page-head p{font-size:.82rem;color:var(--color-text-muted)}

/* 地址栏 */
.embed-bar{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.embed-input{flex:1;min-width:240px;padding:.55rem .9rem;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface);color:var(--color-text);font-family:var(--font-body);font-size:.88rem;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.embed-input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-highlight)}
.embed-go{padding:.55rem 1.3rem;border:none;border-radius:10px;background:var(--color-primary);color:var(--color-bg);font-family:var(--font-body);font-size:.88rem;font-weight:600;cursor:pointer;transition:background var(--transition-fast)}
.embed-go:hover{background:var(--color-primary-light)}
.embed-go:disabled{opacity:.5;cursor:default}

/* 快捷入口 */
.embed-quick{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem;align-items:center}
.embed-quick .eq-label{font-size:.78rem;color:var(--color-text-muted);margin-right:.2rem}
.embed-quick a{display:inline-flex;align-items:center;gap:.25rem;font-size:.78rem;color:var(--color-text-secondary);text-decoration:none;border:1px solid var(--color-border);border-radius:999px;padding:.22rem .7rem;background:var(--color-surface);transition:all var(--transition-fast)}
.embed-quick a:hover{background:var(--color-surface-hover);border-color:var(--color-primary);color:var(--color-primary)}

/* 状态提示 */
.embed-status{display:none;font-size:.82rem;border-radius:8px;padding:.5rem .8rem;margin-bottom:.8rem;line-height:1.7}
.embed-status.show{display:block}
.embed-status.ok{background:color-mix(in srgb,var(--color-primary) 7%,transparent);border:1px solid var(--color-border);color:var(--color-text-secondary)}
.embed-status.warn{background:color-mix(in srgb,#d97706 9%,transparent);border:1px solid color-mix(in srgb,#d97706 40%,transparent);color:#b45309}
.embed-status.err{background:color-mix(in srgb,#dc2626 8%,transparent);border:1px solid color-mix(in srgb,#dc2626 35%,transparent);color:#b91c1c}
[data-theme="dark"] .embed-status.warn{color:#fbbf24}
[data-theme="dark"] .embed-status.err{color:#fca5a5}
.embed-status a{color:inherit;font-weight:600}
.embed-status .sicon{margin-right:.3rem}

/* 嵌入框架 */
.embed-stage{flex:1;min-height:60vh;border:1px solid var(--color-border);border-radius:var(--radius-xl);overflow:hidden;background:var(--color-surface);position:relative;box-shadow:var(--shadow-sm)}
.embed-stage.empty .embed-placeholder{display:flex}
.embed-placeholder{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:.6rem;color:var(--color-text-muted);text-align:center;padding:1rem}
.embed-placeholder .ph-ic{width:56px;height:56px;border-radius:16px;background:var(--color-bg-alt);border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.embed-placeholder .ph-t{font-size:.9rem}
.embed-placeholder .ph-s{font-size:.78rem;max-width:420px;line-height:1.8}
.embed-frame{width:100%;height:100%;border:none;display:block;background:#fff}
.embed-stage.loading::after{content:'加载中…';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--color-surface) 65%,transparent);backdrop-filter:blur(2px);font-size:.85rem;color:var(--color-text-muted);z-index:5}

.app-footer{background:var(--color-bg-alt);border-top:1px solid var(--color-border-light);padding:1rem 0;margin-top:auto}
.footer-inner{max-width:1400px;margin:0 auto;padding:0 1.5rem;text-align:center;font-size:.78rem;color:var(--color-text-muted)}

@media(max-width:768px){
  .header-inner{padding:0 1rem}.header-brand h1{font-size:.85rem}.header-nav a{font-size:.75rem;padding:.3rem .5rem}
  .page{padding:1rem .9rem 2rem}.embed-stage{min-height:50vh}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <a href="index.html" class="header-brand"><div class="bi">汉</div><h1>日本汉籍编目工具</h1></a>
    <nav class="header-nav">
      <div class="nav-dropdown"><button class="nav-dropdown-btn" type="button" aria-haspopup="true">说明文档<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left:2px;vertical-align:-1px;"><path d="M6 9l6 6 6-6"/></svg></button><div class="nav-dropdown-menu" role="menu"><a href="guide.html" role="menuitem">使用介绍</a><a href="changelog.html" role="menuitem">更新日志</a></div></div><a href="index.html">纪年查询</a><a href="catalog.html">编目规范</a><a href="embed.html" class="active">嵌入</a>
    </nav>
    <div class="header-actions"><button class="btn-icon" id="themeToggle" title="暗色/亮色">☀</button></div>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h2>网站嵌入</h2>
    <p>输入网址，将目标网站在此页内直接打开；同源页面或允许嵌入的网站均可正常显示。</p>
  </div>

  <div class="embed-bar">
    <input type="url" id="embedInput" class="embed-input" placeholder="输入网址，如 https://example.com（可省略 https://）" autocomplete="off" spellcheck="false">
    <button class="embed-go" id="embedGo" type="button">打开</button>
  </div>

  <div class="embed-quick">
    <span class="eq-label">快捷入口：</span>
    <a href="javascript:void(0)" data-url="https://ankomaryken.github.io/kanseki-catalog/">本站 GitHub Pages</a>
    <a href="javascript:void(0)" data-url="docs/manual.pdf">工作手册 PDF</a>
    <a href="javascript:void(0)" data-url="https://animate-ui.com/docs/installation">Animate UI 文档</a>
    <a href="javascript:void(0)" data-url="https://ui.shadcn.com/docs">shadcn/ui 文档</a>
  </div>

  <div class="embed-status" id="embedStatus" role="status"></div>

  <div class="embed-stage empty" id="embedStage">
    <div class="embed-placeholder">
      <div class="ph-ic">🔗</div>
      <div class="ph-t">输入网址后点击「打开」</div>
      <div class="ph-s">提示：部分网站（如 Google、维基百科、百度等）会通过响应头禁止被嵌入，此时将自动提示，您可改用「新窗口打开」。</div>
    </div>
    <iframe class="embed-frame" id="embedFrame" title="嵌入网站" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
  </div>
</main>

<footer class="app-footer">
  <div class="footer-inner">日本汉籍编目工具 · 学术参考工具</div>
</footer>

<script>
(function(){
  function initTheme(){document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}
  initTheme();
  document.getElementById('themeToggle').addEventListener('click',()=>{const c=document.documentElement.getAttribute('data-theme'),n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n)});

  const input=document.getElementById('embedInput');
  const go=document.getElementById('embedGo');
  const stage=document.getElementById('embedStage');
  const frame=document.getElementById('embedFrame');
  const status=document.getElementById('embedStatus');

  function setStatus(type,html){
    status.className='embed-status show '+type;
    status.innerHTML=html;
  }
  function clearStatus(){status.className='embed-status';status.innerHTML=''}

  function normalizeUrl(raw){
    let u=raw.trim();
    if(!u)return null;
    // 相对路径 (本站文件, 含子目录如 docs/manual.pdf)
    if(/^\.?\//.test(u)||/^[^/]+(\.html?|\.pdf|\.txt)$/i.test(u)||/^[\w-]+\/[\w.\/-]+\.(html?|pdf|txt)$/i.test(u))return u;
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    return u;
  }

  // 检测是否允许被 iframe 嵌入 (仅同源可读响应头)
  async function checkEmbeddable(url){
    try{
      const r=await fetch(url,{method:'HEAD',mode:'cors'});
      const xfo=r.headers.get('x-frame-options');
      const csp=r.headers.get('content-security-policy')||'';
      const frm=csp.match(/frame-ancestors\s+([^;]+)/i);
      if(xfo&&/deny/i.test(xfo))return {ok:false,why:'X-Frame-Options: DENY'};
      if(xfo&&/sameorigin/i.test(xfo))return {ok:false,why:'X-Frame-Options: SAMEORIGIN'};
      if(frm&&/none/i.test(frm[1]))return {ok:false,why:'CSP frame-ancestors none'};
      if(frm&&!/(\*|'self')/.test(frm[1]))return {ok:false,why:'CSP frame-ancestors '+frm[1].trim()};
      return {ok:true};
    }catch(e){
      // 跨域无法读响应头 — 无法预判, 直接尝试 (可能被浏览器拦截)
      return {ok:true,unknown:true};
    }
  }

  function loadUrl(raw){
    const url=normalizeUrl(raw);
    if(!url){setStatus('warn','<span class="sicon">⚠️</span>请输入有效网址');return}
    clearStatus();
    stage.classList.remove('empty');
    stage.classList.add('loading');
    frame.removeAttribute('src');
    frame.setAttribute('src',url);
    frame.onload=()=>{stage.classList.remove('loading');setStatus('ok','<span class="sicon">✓</span>已加载：<b>'+url+'</b>　<a href="'+url+'" target="_blank" rel="noopener">新窗口打开 ↗</a>')};
    frame.onerror=()=>{stage.classList.remove('loading');setStatus('err','<span class="sicon">✗</span>加载失败：<b>'+url+'</b>　<a href="'+url+'" target="_blank" rel="noopener">新窗口打开 ↗</a>')};
    // 异步预检 (仅同源有效)
    checkEmbeddable(url).then(res=>{
      if(!res.ok){
        stage.classList.remove('loading');
        setStatus('err','<span class="sicon">⚠️</span>该网站设置了 <b>'+res.why+'</b>，禁止被嵌入显示。<a href="'+url+'" target="_blank" rel="noopener">点击这里在新窗口打开 ↗</a>');
      }
    });
  }

  go.addEventListener('click',()=>loadUrl(input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Enter')loadUrl(input.value)});
  document.querySelectorAll('.embed-quick a[data-url]').forEach(a=>{
    a.addEventListener('click',()=>{input.value=a.dataset.url;loadUrl(a.dataset.url)});
  });
})();
</script>
</body>
</html>
